    :root {
      color-scheme: dark;

      --card: #151517;
      --elevated: #1c1c1f;
      --text: #ffffff;
      --muted: #a2a2aa;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #7c5cff;
      --warning: #ffb84d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(124, 92, 255, 0.18), transparent 34rem),
        radial-gradient(circle at bottom left, rgba(255, 184, 77, 0.08), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      color: var(--warning);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    h2 {
      margin: 34px 0 10px;
      font-size: 22px;
      line-height: 1.25;
    }

    p, li {
      color: var(--muted);
      font-size: 16px;
    }

    strong {
      color: var(--text);
    }

    a {
      color: #b9a8ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    section {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(21, 21, 23, 0.72);
    }

    .language-card {
      background: linear-gradient(145deg, rgba(255, 184, 77, 0.12), rgba(21, 21, 23, 0.72));
    }

    .language-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    select {
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--elevated);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
    }

    .localized-summary {
      margin: 16px 0 0;
      color: var(--text);
    }

    .legal-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    ul {
      padding-left: 22px;
    }

    .meta {
      margin: 0;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

        ]},
        {h:"6. Secure QR und passwortgeschützte PDFs",b:[
          "Secure-QR- und PDF-Passwortfunktionen sollen Inhalte zusätzlich schützen. Sie ersetzen keine Unternehmenssicherheitssysteme, rechtliche Compliance-Systeme oder professionelle Dokumentensicherheitsberatung. Du bist verantwortlich für die Wahl starker Passwörter, deren Vertraulichkeit und das Merken dieser Passwörter. Wir können möglicherweise keine verschlüsselten Inhalte oder passwortgeschützten PDFs wiederherstellen."
        ]},
        {h:"7. Abonnements, Tests und Käufe",b:[
          "ScanSpace kann monatliche, jährliche, Lifetime-, Test-, Aktions- oder belohnungsbasierte Zugriffsoptionen anbieten. Preise, Testdauer, Funktionen und Verfügbarkeit können je nach Land, Plattform, Kampagne und Zeitpunkt variieren.",
          ["Abonnements verlängern sich automatisch, sofern sie nicht gemäß den Regeln des Apple App Store oder Google Play gekündigt werden.","Kostenlose Testversionen können in kostenpflichtige Abonnements umgewandelt werden, wenn sie nicht vor Ende des Tests gekündigt werden.","Du kannst Abonnements über deine Apple App Store- oder Google Play-Kontoeinstellungen verwalten oder kündigen.","Rückerstattungen werden von Apple, Google oder dem jeweiligen App-Marktplatz gemäß deren Richtlinien abgewickelt."],
          "Wir können die Verfügbarkeit kostenloser und kostenpflichtiger Funktionen ändern, werden jedoch aktive bezahlte Berechtigungen nicht absichtlich ohne angemessenen Ersatz entfernen."
        ]},
        {h:"8. Drittanbieterdienste",b:[
          "Die App kann mit Drittanbieterdiensten interagieren, darunter Apple App Store, Google Play, Firebase, E-Mail-Apps, Dateianbieter, Browser, Cloud-Speicher-Apps, Messaging-Apps und andere von dir ausgewählte Apps zum Teilen oder Öffnen von Inhalten. Drittanbieterdienste unterliegen deren eigenen Bedingungen und Datenschutzrichtlinien."
        ]},
        {h:"9. Updates und Änderungen",b:[
          'Wir können die App aktualisieren, Funktionen hinzufügen oder entfernen, Fehler beheben, Preise ändern, Kampagnen anpassen oder diese Bedingungen aktualisieren. Bei wesentlichen Änderungen werden wir das Datum „Zuletzt aktualisiert" aktualisieren und können bei Bedarf zusätzliche Hinweise bereitstellen.'
        ]},
        {h:"10. Keine Gewährleistung",b:[
          'Die App wird „wie besehen" und „nach Verfügbarkeit" bereitgestellt. Im gesetzlich zulässigen Höchstmaß lehnen wir Gewährleistungen für Marktgängigkeit, Eignung für einen bestimmten Zweck, Nichtverletzung, Verfügbarkeit, Genauigkeit und fehlerfreien Betrieb ab.'
        ]},
        {h:"11. Haftungsbeschränkung",b:[
          "Im gesetzlich zulässigen Höchstmaß haften wir nicht für mittelbare, zufällige, besondere, Folge-, exemplarische oder Strafschäden, noch für Datenverlust, Dokumentenverlust, Gewinnverlust, Betriebsunterbrechung, Geräteprobleme, ungenaue Scanergebnisse, fehlgeschlagene Exporte oder die Abhängigkeit von generierten oder gescannten Inhalten."
        ]},
        {h:"12. Apple- und Google-Bedingungen",b:[
          "Wenn du die App aus dem Apple App Store oder Google Play heruntergeladen hast, unterliegt deine Nutzung auch den geltenden Marktplatzbedingungen, Abonnementregeln, Zahlungsregeln, Rückerstattungsregeln und Plattformrichtlinien."
        ]},
        {h:"13. Kontakt",b:["Bei Fragen zu diesen Bedingungen kontaktiere uns unter {{email}}."]}

      it: [
        {h:"1. Accordo",b:[
          'Questi Termini di Servizio ("Termini") regolano l\'accesso e l\'uso di ScanSpace ("l\'App"). Scaricando, accedendo o usando l\'App, accetti questi Termini. Se non sei d\'accordo, non usare l\'App.'
        ]},
        {h:"2. Cosa fa l'App",b:[
          "ScanSpace è un'app di utilità mobile per la scansione QR, la generazione QR, la scansione di documenti, la modifica PDF, l'organizzazione PDF, le funzionalità QR Sicuro, il recupero delle bozze e gli strumenti di produttività correlati.",
          "Alcune funzionalità possono essere gratuite. Altre potrebbero richiedere un abbonamento Pro, una prova gratuita, un acquisto a vita, uno sblocco a ricompensa o un altro diritto mostrato nell'App."
        ]},
        {h:"3. Il tuo contenuto e la tua responsabilità",b:[
          "Sei responsabile dei QR code, PDF, documenti, immagini, testi, link, dati Wi-Fi, dati di contatto, contenuto QR Sicuro, password, firme, annotazioni e altri contenuti che scansi, crei, modifichi, archivi, condividi o esporti.",
          "Accetti di non usare l'App per creare, archiviare, distribuire o condividere contenuti che:",
          ["violino qualsiasi legge, regolamento o diritto di terzi;","contengano malware, link di phishing, truffe, istruzioni ingannevoli o payload dannosi;","violino diritti d'autore, marchi, privacy, pubblicità o altri diritti di proprietà intellettuale;","siano abusivi, fraudolenti o destinati a danneggiare un'altra persona, dispositivo, servizio o rete."]
        ]},
        {h:"4. File locali, bozze e perdita di dati",b:[
          "ScanSpace è progettato per archiviare molte scansioni, bozze, PDF e elementi della cronologia localmente sul tuo dispositivo. Sei responsabile del mantenimento di copie di backup di documenti e password importanti. I file locali possono andare persi se li elimini, cancelli i dati dell'app, disinstalli l'App, modifichi l'archiviazione del dispositivo o se il sistema operativo rimuove i file temporanei."
        ]},
        {h:"5. Accuratezza di scansione, OCR, strumenti PDF e output QR",b:[
          "Lavoriamo per rendere affidabili la scansione QR, la scansione di documenti, l'OCR, la modifica PDF, la conversione PDF, il QR Sicuro e la generazione QR, ma nessuna app può garantire risultati perfetti in ogni condizione. Illuminazione, qualità della fotocamera, corruzione dei file, struttura PDF, codifica dei font, qualità dell'immagine, formati non supportati, danni al QR e comportamento di app di terze parti possono influenzare i risultati.",
          "Dovresti verificare i risultati di scansione importanti, i payload QR, il testo OCR, le password, i PDF esportati, i file DOCX esportati, le firme, le filigrane, le annotazioni e i documenti modificati prima di affidarti a essi o condividerli."
        ]},
        {h:"6. QR Sicuro e PDF protetti da password",b:[
          "Le funzionalità QR Sicuro e password PDF sono pensate per aggiungere protezione ai contenuti. Non sostituiscono i sistemi di sicurezza aziendali, i sistemi di conformità legale né la consulenza professionale sulla sicurezza dei documenti. Sei responsabile della scelta di password forti, della loro riservatezza e del ricordarle. Potremmo non essere in grado di recuperare contenuti crittografati o PDF protetti da password."
        ]},
        {h:"7. Abbonamenti, prove e acquisti",b:[
          "ScanSpace può offrire opzioni mensili, annuali, a vita, di prova, promozionali o di accesso a ricompensa. I prezzi, la durata della prova, le funzionalità e la disponibilità possono variare per paese, piattaforma, campagna e periodo.",
          ["Gli abbonamenti si rinnovano automaticamente salvo cancellazione secondo le regole di Apple App Store o Google Play.","Le prove gratuite possono convertirsi in abbonamenti a pagamento se non vengono annullate prima della scadenza.","Puoi gestire o annullare gli abbonamenti tramite le impostazioni del tuo account su Apple App Store o Google Play.","I rimborsi sono gestiti da Apple, Google o il marketplace applicabile secondo le loro politiche."],
          "Possiamo modificare la disponibilità delle funzionalità gratuite e a pagamento, ma le modifiche non rimuoveranno intenzionalmente i diritti pagati attivi senza una sostituzione ragionevole."
        ]},
        {h:"8. Servizi di terze parti",b:[
          "L'App può interagire con servizi di terze parti, tra cui Apple App Store, Google Play, Firebase, app di posta elettronica, fornitori di file, browser, app di archiviazione cloud, app di messaggistica e altre app selezionate da te per condividere o aprire contenuti. I servizi di terze parti sono regolati dai propri termini e politiche sulla privacy."
        ]},
        {h:"9. Aggiornamenti e modifiche",b:[
          'Possiamo aggiornare l\'App, aggiungere o rimuovere funzionalità, correggere bug, modificare i prezzi, le campagne o questi Termini. In caso di modifiche sostanziali, aggiorneremo la data di "Ultimo aggiornamento" e potremo fornire ulteriore comunicazione dove appropriato.'
        ]},
        {h:"10. Assenza di garanzie",b:[
          'L\'App è fornita "così com\'è" e "come disponibile". Nella misura massima consentita dalla legge, escludiamo garanzie di commerciabilità, idoneità per uno scopo particolare, non violazione, disponibilità, accuratezza e funzionamento privo di errori.'
        ]},
        {h:"11. Limitazione di responsabilità",b:[
          "Nella misura massima consentita dalla legge, non saremo responsabili per danni indiretti, accidentali, speciali, consequenziali, esemplari o punitivi, né per perdita di dati, perdita di documenti, perdita di profitti, interruzione dell'attività, problemi del dispositivo, risultati di scansione imprecisi, esportazioni fallite o dipendenza da contenuti generati o scansionati."
        ]},
        {h:"12. Termini Apple e Google",b:[
          "Se hai scaricato l'App dall'Apple App Store o da Google Play, il tuo utilizzo è soggetto anche ai termini del marketplace applicabile, alle regole di abbonamento, pagamento, rimborso e alle politiche della piattaforma."
        ]},
        {h:"13. Contatto",b:["Per domande su questi Termini, contattaci all'indirizzo {{email}}."]}
      ],
      nl: [
        {h:"1. Overeenkomst",b:[
          'Deze Servicevoorwaarden ("Voorwaarden") regelen jouw toegang tot en gebruik van ScanSpace ("de App"). Door de App te downloaden, te openen of te gebruiken, ga je akkoord met deze Voorwaarden. Als je het er niet mee eens bent, gebruik de App dan niet.'
        ]},
        {h:"2. Wat de App doet",b:[
          "ScanSpace is een mobiele hulpapp voor QR-scanning, QR-generatie, documentscannen, PDF-bewerking, PDF-organisatie, Secure QR-functies, ontwerpherstel en aanverwante productiviteitstools.",
          "Sommige functies kunnen gratis zijn. Andere vereisen mogelijk een Pro-abonnement, gratis proefperiode, levenslange aankoop, beloningsontgrendeling of een ander recht dat in de App wordt getoond."
        ]},
        {h:"3. Jouw inhoud en verantwoordelijkheid",b:[
          "Jij bent verantwoordelijk voor QR-codes, PDF's, documenten, afbeeldingen, tekst, links, Wi-Fi-gegevens, contactgegevens, Secure QR-inhoud, wachtwoorden, handtekeningen, annotaties en andere inhoud die je scant, maakt, bewerkt, opslaat, deelt of exporteert.",
          "Je gaat ermee akkoord de App niet te gebruiken om inhoud te maken, op te slaan, te verspreiden of te delen die:",
          ["enige wet, regelgeving of recht van derden schendt;","malware, phishinglinks, oplichting, misleidende instructies of schadelijke ladingen bevat;","auteursrechten, handelsmerken, privacy, publiciteitsrechten of andere intellectuele eigendomsrechten schendt;","beledigend, frauduleus of bedoeld is om een andere persoon, apparaat, dienst of netwerk te schaden."]
        ]},
        {h:"4. Lokale bestanden, concepten en gegevensverlies",b:[
          "ScanSpace is ontworpen om veel scans, concepten, PDF-bestanden en geschiedenis-items lokaal op je apparaat op te slaan. Je bent verantwoordelijk voor het bewaren van back-upkopieën van belangrijke documenten en wachtwoorden. Lokale bestanden kunnen verloren gaan als je ze verwijdert, app-gegevens wist, de App verwijdert, de apparaatopslag wijzigt, of als het besturingssysteem tijdelijke bestanden verwijdert."
        ]},
        {h:"5. Nauwkeurigheid van scannen, OCR, PDF-tools en QR-uitvoer",b:[
          "We streven ernaar QR-scanning, documentscannen, OCR, PDF-bewerking, PDF-conversie, Secure QR en QR-generatie betrouwbaar te maken, maar geen enkele app kan in alle omstandigheden perfecte resultaten garanderen. Verlichting, camerakwaliteit, bestandsbeschadiging, PDF-structuur, lettertypecodering, beeldkwaliteit, niet-ondersteunde formaten, QR-schade en gedrag van apps van derden kunnen de resultaten beïnvloeden.",
          "Je dient belangrijke scanresultaten, QR-payloads, OCR-tekst, wachtwoorden, geëxporteerde PDF's, geëxporteerde DOCX-bestanden, handtekeningen, watermerken, annotaties en bewerkte documenten te controleren voordat je erop vertrouwt of ze deelt."
        ]},
        {h:"6. Secure QR en met wachtwoord beveiligde PDF's",b:[
          "Secure QR- en PDF-wachtwoordfuncties zijn bedoeld om extra bescherming aan inhoud toe te voegen. Ze zijn geen vervanging voor zakelijke beveiligingssystemen, juridische nalevingssystemen of professioneel advies over documentbeveiliging. Je bent verantwoordelijk voor het kiezen van sterke wachtwoorden, het vertrouwelijk houden ervan en het onthouden ervan. We kunnen mogelijk geen versleutelde inhoud of met wachtwoord beveiligde PDF's herstellen."
        ]},
        {h:"7. Abonnementen, proefperiodes en aankopen",b:[
          "ScanSpace kan maandelijkse, jaarlijkse, levenslange, proef-, promotionele of beloningsgebaseerde toegangsopties aanbieden. Prijzen, proefperiodeduur, functies en beschikbaarheid kunnen variëren per land, platform, campagne en tijdstip.",
          ["Abonnementen worden automatisch verlengd tenzij opgezegd volgens de regels van de Apple App Store of Google Play.","Gratis proefperiodes kunnen overgaan in betaalde abonnementen als ze niet voor het einde van de proefperiode worden opgezegd.","Je kunt abonnementen beheren of opzeggen via je accountinstellingen in de Apple App Store of Google Play.","Terugbetalingen worden afgehandeld door Apple, Google of de toepasselijke app-marktplaats volgens hun beleid."],
          "We kunnen de beschikbaarheid van gratis en betaalde functies in de loop der tijd wijzigen, maar wijzigingen zullen actieve betaalde rechten niet opzettelijk verwijderen zonder een redelijke vervanging."
        ]},
        {h:"8. Diensten van derden",b:[
          "De App kan interacteren met diensten van derden, waaronder Apple App Store, Google Play, Firebase, e-mailapps, bestandsproviders, browsers, cloud-opslagapps, messaging-apps en andere apps die je hebt geselecteerd voor het delen of openen van inhoud. Diensten van derden worden beheerst door hun eigen voorwaarden en privacybeleid."
        ]},
        {h:"9. Updates en wijzigingen",b:[
          'We kunnen de App updaten, functies toevoegen of verwijderen, bugs oplossen, prijzen wijzigen, campagnes aanpassen of deze Voorwaarden bijwerken. Bij wezenlijke wijzigingen werken we de datum "Laatst bijgewerkt" bij en kunnen we indien passend aanvullende kennisgeving geven.'
        ]},
        {h:"10. Geen garanties",b:[
          'De App wordt aangeboden "zoals het is" en "zoals beschikbaar". Voor zover maximaal toegestaan door de wet, wijzen we garanties af van verhandelbaarheid, geschiktheid voor een bepaald doel, niet-inbreuk, beschikbaarheid, nauwkeurigheid en foutvrije werking.'
        ]},
        {h:"11. Beperking van aansprakelijkheid",b:[
          "Voor zover maximaal toegestaan door de wet, zijn we niet aansprakelijk voor indirecte, incidentele, speciale, gevolgschade, exemplarische of punitieve schade, of voor gegevensverlies, documentverlies, winstderving, bedrijfsonderbreking, apparaatproblemen, onnauwkeurige scanresultaten, mislukte exports of afhankelijkheid van gegenereerde of gescande inhoud."
        ]},
        {h:"12. Apple- en Google-voorwaarden",b:[
          "Als je de App hebt gedownload via de Apple App Store of Google Play, is je gebruik ook onderworpen aan de toepasselijke marktplaatsvoorwaarden, abonnementsregels, betalingsregels, terugbetalingsregels en platformbeleid."
        ]},
        {h:"13. Contact",b:["Als je vragen hebt over deze Voorwaarden, neem dan contact met ons op via {{email}}."]}
      ],
      pl: [
        {h:"1. Umowa",b:[
          'Niniejsze Warunki Korzystania z Usługi („Warunki") regulują dostęp do ScanSpace („Aplikacji") i jej użytkowanie. Pobierając, uzyskując dostęp do lub korzystając z Aplikacji, akceptujesz te Warunki. Jeśli się nie zgadzasz, nie korzystaj z Aplikacji.'
        ]},
        {h:"2. Do czego służy Aplikacja",b:[
          "ScanSpace to mobilna aplikacja użytkowa do skanowania QR, generowania QR, skanowania dokumentów, edycji PDF, organizacji PDF, funkcji Secure QR, odzyskiwania szkiców i powiązanych narzędzi produktywności.",
          "Niektóre funkcje mogą być bezpłatne. Inne mogą wymagać subskrypcji Pro, bezpłatnego okresu próbnego, dożywotniego zakupu, odblokowania nagrodą lub innego uprawnienia wyświetlanego w Aplikacji."
        ]},
        {h:"3. Twoje treści i odpowiedzialność",b:[
          "Jesteś odpowiedzialny za kody QR, pliki PDF, dokumenty, obrazy, tekst, linki, dane Wi-Fi, dane kontaktowe, treści Secure QR, hasła, podpisy, adnotacje i inne treści, które skanujesz, tworzysz, edytujesz, przechowujesz, udostępniasz lub eksportujesz.",
          "Zgadzasz się nie używać Aplikacji do tworzenia, przechowywania, rozpowszechniania lub udostępniania treści, które:",
          ["naruszają jakiekolwiek prawo, regulacje lub prawa osób trzecich;","zawierają złośliwe oprogramowanie, linki phishingowe, oszustwa, mylące instrukcje lub szkodliwe ładunki;","naruszają prawa autorskie, znaki towarowe, prywatność, prawo do wizerunku lub inne prawa własności intelektualnej;","są obraźliwe, nieuczciwe lub mają na celu skrzywdzenie innej osoby, urządzenia, usługi lub sieci."]
        ]},
        {h:"4. Pliki lokalne, szkice i utrata danych",b:[
          "ScanSpace jest zaprojektowany do przechowywania wielu skanów, szkiców, plików PDF i elementów historii lokalnie na Twoim urządzeniu. Jesteś odpowiedzialny za tworzenie kopii zapasowych ważnych dokumentów i haseł. Pliki lokalne mogą zostać utracone, jeśli je usuniesz, wyczyścisz dane aplikacji, odinstalुjesz Aplikację, zmienisz pamięć urządzenia lub jeśli system operacyjny usunie pliki tymczasowe."
        ]},
        {h:"5. Dokładność skanowania, OCR, narzędzi PDF i wyjścia QR",b:[
          "Staramy się, aby skanowanie QR, skanowanie dokumentów, OCR, edycja PDF, konwersja PDF, Secure QR i generowanie QR były niezawodne, ale żadna aplikacja użytkowa nie może zagwarantować idealnych wyników w każdych warunkach. Oświetlenie, jakość aparatu, uszkodzenia plików, struktura PDF, kodowanie czcionek, jakość obrazu, nieobsługiwane formaty, uszkodzenia QR i zachowanie aplikacji zewnętrznych mogą wpływać na wyniki.",
          "Przed poleganiem na nich lub udostępnianiem sprawdź ważne wyniki skanów, ładunki QR, tekst OCR, hasła, wyeksportowane pliki PDF i DOCX, podpisy, znaki wodne, adnotacje i edytowane dokumenty."
        ]},
        {h:"6. Secure QR i pliki PDF chronione hasłem",b:[
          "Funkcje Secure QR i hasła PDF mają na celu dodanie ochrony do treści. Nie zastępują firmowych systemów bezpieczeństwa, systemów zgodności prawnej ani profesjonalnego doradztwa w zakresie bezpieczeństwa dokumentów. Jesteś odpowiedzialny za wybór silnych haseł, zachowanie ich poufności i zapamiętanie. Możemy nie być w stanie odzyskać zaszyfrowanych treści ani plików PDF chronionych hasłem."
        ]},
        {h:"7. Subskrypcje, okresy próbne i zakupy",b:[
          "ScanSpace może oferować opcje miesięczne, roczne, dożywotnie, próbne, promocyjne lub dostęp oparty na nagrodach. Ceny, długość okresu próbnego, funkcje i dostępność mogą się różnić w zależności od kraju, platformy, kampanii i czasu.",
          ["Subskrypcje odnawiają się automatycznie, chyba że zostaną anulowane zgodnie z zasadami Apple App Store lub Google Play.","Bezpłatne okresy próbne mogą zostać przekształcone w płatne subskrypcje, jeśli nie zostaną anulowane przed ich zakończeniem.","Możesz zarządzać subskrypcjami lub je anulować w ustawieniach konta Apple App Store lub Google Play.","Zwroty są obsługiwane przez Apple, Google lub właściwy marketplace zgodnie z ich zasadami."],
          "Możemy z czasem zmieniać dostępność bezpłatnych i płatnych funkcji, ale zmiany celowo nie usuną aktywnych płatnych uprawnień bez rozsądnego zastąpienia."
        ]},
        {h:"8. Usługi zewnętrzne",b:[
          "Aplikacja może współdziałać z usługami zewnętrznymi, w tym Apple App Store, Google Play, Firebase, aplikacjami e-mail, dostawcami plików, przeglądarkami, aplikacjami do przechowywania w chmurze, komunikatorami i innymi aplikacjami wybranymi przez Ciebie do udostępniania lub otwierania treści. Usługi zewnętrzne podlegają własnym regulaminom i politykom prywatności."
        ]},
        {h:"9. Aktualizacje i zmiany",b:[
          'Możemy aktualizować Aplikację, dodawać lub usuwać funkcje, naprawiać błędy, zmieniać ceny, modyfikować kampanie lub aktualizować niniejsze Warunki. W przypadku istotnych zmian zaktualizujemy datę „Ostatnia aktualizacja" i możemy w odpowiednich przypadkach przekazać dodatkowe powiadomienie.'
        ]},
        {h:"10. Brak gwarancji",b:[
          'Aplikacja jest udostępniana w stanie „takim, jaki jest" i „w miarę dostępności". W maksymalnym zakresie dozwolonym przez prawo zrzekamy się gwarancji przydatności handlowej, przydatności do określonego celu, nienaruszania praw, dostępności, dokładności i bezbłędnego działania.'
        ]},
        {h:"11. Ograniczenie odpowiedzialności",b:[
          "W maksymalnym zakresie dozwolonym przez prawo nie ponosimy odpowiedzialności za pośrednie, przypadkowe, szczególne, wynikowe, przykładowe ani karne szkody, ani za utratę danych, utratę dokumentów, utratę zysków, przerwanie działalności, problemy z urządzeniem, niedokładne wyniki skanowania, nieudane eksporty lub poleganie na wygenerowanych lub zeskanowanych treściach."
        ]},
        {h:"12. Warunki Apple i Google",b:[
          "Jeśli pobrałeś Aplikację z Apple App Store lub Google Play, Twoje korzystanie podlega również obowiązującym warunkom marketplace, zasadom subskrypcji, płatności, zwrotów i politykom platformy."
        ]},
        {h:"13. Kontakt",b:["Jeśli masz pytania dotyczące tych Warunków, skontaktuj się z nami pod adresem {{email}}."]}
      ],
      ru: [
        {h:"1. Соглашение",b:[
          'Настоящие Условия использования («Условия») регулируют ваш доступ к ScanSpace («Приложение») и его использование. Загружая, открывая или используя Приложение, вы принимаете настоящие Условия. Если вы не согласны, не используйте Приложение.'

        {h:"10. Garanti yok",b:[

        {h:"11. Sorumluluk sınırlaması",b:[

      ar: [
        {h:"1. الاتفاقية",b:[
          'تحكم شروط الخدمة هذه ("الشروط") وصولك إلى ScanSpace ("التطبيق") واستخدامك له. بتنزيل التطبيق أو الوصول إليه أو استخدامه، فأنت توافق على هذه الشروط. إذا لم تكن موافقًا، فلا تستخدم التطبيق.'
        ]},
        {h:"2. ما يفعله التطبيق",b:[
          "ScanSpace تطبيق أداة مساعدة للجوال لمسح رموز QR وإنشائها، ومسح المستندات، وتحرير ملفات PDF وتنظيمها، وميزات QR الآمن، واسترداد المسودات، وأدوات الإنتاجية ذات الصلة.",
          "بعض الميزات قد تكون مجانية. وقد تتطلب ميزات أخرى اشتراكًا Pro أو فترة تجريبية مجانية أو شراءً مدى الحياة أو فتحًا مكافأةً أو استحقاقًا آخر يظهر في التطبيق."
        ]},
        {h:"3. محتواك ومسؤوليتك",b:[
          "أنت مسؤول عن رموز QR وملفات PDF والمستندات والصور والنصوص والروابط وبيانات Wi-Fi وبيانات جهات الاتصال ومحتوى QR الآمن وكلمات المرور والتوقيعات والتعليقات التوضيحية وغيرها من المحتوى الذي تمسحه أو تنشئه أو تعدله أو تخزنه أو تشاركه أو تصدره.",
          "توافق على عدم استخدام التطبيق لإنشاء أو تخزين أو توزيع أو مشاركة محتوى:",
          ["ينتهك أي قانون أو لائحة أو حق لطرف ثالث؛","يحتوي على برامج ضارة أو روابط تصيد أو عمليات احتيال أو تعليمات مضللة أو حمولات ضارة؛","ينتهك حقوق الطبع والنشر أو العلامات التجارية أو الخصوصية أو حقوق الملكية الفكرية الأخرى؛","يكون مسيئًا أو احتياليًا أو يقصد الإضرار بشخص آخر أو جهاز أو خدمة أو شبكة."]
        ]},
        {h:"4. الملفات المحلية والمسودات وفقدان البيانات",b:[
          "صُمِّم ScanSpace لتخزين عمليات المسح والمسودات وملفات PDF وعناصر السجل محليًا على جهازك. أنت مسؤول عن الاحتفاظ بنسخ احتياطية من المستندات وكلمات المرور المهمة. قد تُفقد الملفات المحلية إذا حذفتها أو مسحت بيانات التطبيق أو أزلت التطبيق أو غيّرت مساحة التخزين أو إذا أزال نظام التشغيل الملفات المؤقتة."
        ]},
        {h:"5. دقة المسح والتعرف الضوئي على الحروف وأدوات PDF ومخرجات QR",b:[
          "نعمل على جعل مسح QR ومسح المستندات والتعرف الضوئي على الحروف وتحرير PDF وتحويله وQR الآمن وإنشاء QR موثوقين، إلا أنه لا يمكن لأي تطبيق ضمان نتائج مثالية في كل الظروف. قد تؤثر الإضاءة وجودة الكاميرا وتلف الملفات وبنية PDF وترميز الخطوط وجودة الصورة والتنسيقات غير المدعومة وتلف رمز QR وسلوك تطبيقات الطرف الثالث على النتائج.",
          "يجب عليك مراجعة نتائج المسح المهمة وحمولات QR ونص التعرف الضوئي وكلمات المرور وملفات PDF المُصدَّرة وملفات DOCX والتوقيعات والعلامات المائية والتعليقات التوضيحية والمستندات المحررة قبل الاعتماد عليها أو مشاركتها."
        ]},
        {h:"6. QR الآمن وملفات PDF المحمية بكلمة مرور",b:[
          "تهدف ميزات QR الآمن وكلمة مرور PDF إلى إضافة حماية للمحتوى. وهي لا تُغني عن أنظمة الأمن المؤسسي أو أنظمة الامتثال القانوني أو المشورة المتخصصة في أمن المستندات. أنت مسؤول عن اختيار كلمات مرور قوية والحفاظ على سريتها وتذكّرها. قد لا نتمكن من استرداد المحتوى المشفر أو ملفات PDF المحمية بكلمة مرور."
        ]},
        {h:"7. الاشتراكات والتجارب والمشتريات",b:[
          "قد يقدم ScanSpace خيارات شهرية أو سنوية أو مدى الحياة أو تجريبية أو ترويجية أو وصولًا مكافأةً. قد تختلف الأسعار ومدة التجربة والميزات والتوفر حسب الدولة والمنصة والحملة والوقت.",
          ["تُجدَّد الاشتراكات تلقائيًا ما لم يتم إلغاؤها وفقًا لقواعد Apple App Store أو Google Play.","قد تتحول التجارب المجانية إلى اشتراكات مدفوعة ما لم يتم إلغاؤها قبل انتهاء التجربة.","يمكنك إدارة الاشتراكات أو إلغاؤها من خلال إعدادات حساب Apple App Store أو Google Play.","تُعالَج المبالغ المستردة من قِبل Apple أو Google أو المتجر المعمول به وفقًا لسياساتهم."],
          "قد نغيّر توفر الميزات المجانية والمدفوعة بمرور الوقت، لكن التغييرات لن تُزيل عن قصد الاستحقاقات المدفوعة النشطة دون استبدال معقول."
        ]},
        {h:"8. خدمات الطرف الثالث",b:[
          "قد يتفاعل التطبيق مع خدمات طرف ثالث بما فيها Apple App Store وGoogle Play وFirebase وتطبيقات البريد الإلكتروني ومزودي الملفات والمتصفحات وتطبيقات التخزين السحابي وتطبيقات المراسلة وغيرها من التطبيقات التي تختارها لمشاركة المحتوى أو فتحه. تخضع خدمات الطرف الثالث لشروطها وسياسات الخصوصية الخاصة بها."
        ]},
        {h:"9. التحديثات والتغييرات",b:[
          'قد نحدّث التطبيق أو نضيف ميزات أو نزيلها أو نصلح أخطاء أو نغيّر الأسعار أو نعدّل الحملات أو نحدّث هذه الشروط. إذا أجرينا تغييرات جوهرية، سنحدّث تاريخ "آخر تحديث" وقد نقدم إشعارًا إضافيًا حيثما كان ذلك مناسبًا.'
        ]},
        {h:"10. لا ضمانات",b:[
          'يُقدَّم التطبيق "كما هو" و"حسب التوفر". بالقدر الأقصى المسموح به قانونًا، نتنصل من ضمانات الصلاحية للتسويق والملاءمة لغرض معين وعدم الانتهاك والتوفر والدقة والتشغيل الخالي من الأخطاء.'
        ]},
        {h:"11. تحديد المسؤولية",b:[
          "بالقدر الأقصى المسموح به قانونًا، لن نكون مسؤولين عن الأضرار غير المباشرة أو العرضية أو الخاصة أو التبعية أو النموذجية أو العقابية، ولا عن فقدان البيانات أو المستندات أو الأرباح أو انقطاع الأعمال أو مشاكل الأجهزة أو نتائج المسح غير الدقيقة أو الصادرات الفاشلة أو الاعتماد على المحتوى المُولَّد أو الممسوح."
        ]},
        {h:"12. شروط Apple وGoogle",b:[
          "إذا قمت بتنزيل التطبيق من Apple App Store أو Google Play، فإن استخدامك يخضع أيضًا لشروط المتجر المعمول بها وقواعد الاشتراك والدفع والاسترداد وسياسات المنصة."
        ]},
        {h:"13. التواصل",b:["إذا كان لديك أسئلة حول هذه الشروط، تواصل معنا على {{email}}."]}

      hi: [
        {h:"1. समझौता",b:[
          'ये सेवा की शर्तें ("शर्तें") ScanSpace ("App") तक आपकी पहुंच और उपयोग को नियंत्रित करती हैं। App को डाउनलोड करके, एक्सेस करके या उपयोग करके आप इन शर्तों से सहमत होते हैं। यदि आप सहमत नहीं हैं, तो App का उपयोग न करें।'
        ]},
        {h:"2. App क्या करता है",b:[
          "ScanSpace एक मोबाइल यूटिलिटी App है जो QR स्कैनिंग, QR जनरेशन, डॉक्यूमेंट स्कैनिंग, PDF एडिटिंग, PDF ऑर्गनाइज़ेशन, Secure QR फीचर्स, ड्राफ्ट रिकवरी और संबंधित प्रोडक्टिविटी टूल्स के लिए है।",
          "कुछ फीचर्स मुफ्त हो सकते हैं। कुछ के लिए Pro सब्सक्रिप्शन, फ्री ट्रायल, लाइफटाइम परचेज, रिवार्डेड अनलॉक या App में दिखाए गए किसी अन्य एंटाइटेलमेंट की आवश्यकता हो सकती है।"
        ]},
        {h:"3. आपका कंटेंट और जिम्मेदारी",b:[
          "आप उन QR कोड, PDF, दस्तावेज़, छवियों, टेक्स्ट, लिंक, Wi-Fi विवरण, संपर्क विवरण, Secure QR कंटेंट, पासवर्ड, हस्ताक्षर, एनोटेशन और अन्य कंटेंट के लिए जिम्मेदार हैं जिन्हें आप स्कैन, बनाते, एडिट, स्टोर, शेयर या एक्सपोर्ट करते हैं।",
          "आप सहमत होते हैं कि App का उपयोग ऐसे कंटेंट बनाने, स्टोर करने, वितरित करने या शेयर करने के लिए नहीं करेंगे जो:",
          ["किसी कानून, नियम या तृतीय पक्ष के अधिकार का उल्लंघन करे;","मैलवेयर, फिशिंग लिंक, स्कैम, भ्रामक निर्देश या हानिकारक पेलोड हों;","कॉपीराइट, ट्रेडमार्क, गोपनीयता या अन्य बौद्धिक संपदा अधिकारों का उल्लंघन करे;","दूसरे व्यक्ति, डिवाइस, सेवा या नेटवर्क को नुकसान पहुंचाने के लिए अपमानजनक, धोखाधड़ीपूर्ण या इरादतन हो।"]
        ]},
        {h:"4. लोकल फाइलें, ड्राफ्ट और डेटा लॉस",b:[
          "ScanSpace को डिवाइस पर लोकल रूप से स्कैन, ड्राफ्ट, PDF फाइलें और हिस्ट्री आइटम स्टोर करने के लिए डिज़ाइन किया गया है। महत्वपूर्ण दस्तावेज़ों और पासवर्ड की बैकअप कॉपी रखना आपकी जिम्मेदारी है। लोकल फाइलें खो सकती हैं यदि आप उन्हें डिलीट करें, App डेटा क्लियर करें, App अनइंस्टॉल करें, डिवाइस स्टोरेज बदलें या ऑपरेटिंग सिस्टम अस्थायी फाइलें हटा दे।"
        ]},
        {h:"5. स्कैनिंग, OCR, PDF टूल्स और QR आउटपुट की सटीकता",b:[
          "हम QR स्कैनिंग, डॉक्यूमेंट स्कैनिंग, OCR, PDF एडिटिंग, PDF कन्वर्जन, Secure QR और QR जनरेशन को विश्वसनीय बनाने की कोशिश करते हैं, लेकिन कोई भी App हर स्थिति में परफेक्ट रिजल्ट की गारंटी नहीं दे सकता। रोशनी, कैमरा क्वालिटी, फाइल करप्शन, PDF स्ट्रक्चर, फॉन्ट एनकोडिंग, इमेज क्वालिटी, असमर्थित फॉर्मेट, QR डैमेज और थर्ड-पार्टी App का व्यवहार रिजल्ट को प्रभावित कर सकते हैं।",
          "महत्वपूर्ण स्कैन रिजल्ट, QR पेलोड, OCR टेक्स्ट, पासवर्ड, एक्सपोर्ट किए गए PDF, DOCX फाइलें, सिग्नेचर, वॉटरमार्क, एनोटेशन और एडिटेड दस्तावेज़ों को उन पर भरोसा करने या शेयर करने से पहले जांच लें।"
        ]},
        {h:"6. Secure QR और पासवर्ड-प्रोटेक्टेड PDF",b:[
          "Secure QR और PDF पासवर्ड फीचर कंटेंट को सुरक्षा जोड़ने के लिए हैं। ये एंटरप्राइज़ सिक्योरिटी सिस्टम, लीगल कंप्लायंस सिस्टम या प्रोफेशनल डॉक्यूमेंट सिक्योरिटी सलाह का विकल्प नहीं हैं। मजबूत पासवर्ड चुनना, उन्हें प्राइवेट रखना और याद रखना आपकी जिम्मेदारी है। हम एन्क्रिप्टेड कंटेंट या पासवर्ड-प्रोटेक्टेड PDF रिकवर करने में सक्षम नहीं हो सकते।"
        ]},
        {h:"7. सब्सक्रिप्शन, ट्रायल और परचेज",b:[
          "ScanSpace मासिक, वार्षिक, लाइफटाइम, ट्रायल, प्रमोशनल या रिवार्डेड-एक्सेस विकल्प ऑफर कर सकता है। कीमतें, ट्रायल लेंथ, फीचर्स और उपलब्धता देश, प्लेटफॉर्म, कैंपेन और समय के अनुसार अलग हो सकती हैं।",
          ["सब्सक्रिप्शन Apple App Store या Google Play के नियमों के अनुसार रद्द न किए जाने पर अपने-आप रिन्यू होते हैं।","फ्री ट्रायल, ट्रायल समाप्त होने से पहले रद्द न किए जाने पर पेड सब्सक्रिप्शन में बदल सकते हैं।","आप Apple App Store या Google Play अकाउंट सेटिंग्स से सब्सक्रिप्शन मैनेज या रद्द कर सकते हैं।","रिफंड Apple, Google या लागू App मार्केटप्लेस द्वारा उनकी पॉलिसी के अनुसार हैंडल किए जाते हैं।"],
          "हम समय-समय पर फ्री और पेड फीचर्स की उपलब्धता बदल सकते हैं, लेकिन बदलाव जानबूझकर उचित विकल्प के बिना सक्रिय पेड एंटाइटेलमेंट नहीं हटाएंगे।"
        ]},
        {h:"8. थर्ड-पार्टी सेवाएं",b:[
          "App Apple App Store, Google Play, Firebase, ईमेल App, फाइल प्रोवाइडर, ब्राउज़र, क्लाउड स्टोरेज App, मैसेजिंग App और आपके द्वारा कंटेंट शेयर या खोलने के लिए चुने गए अन्य App सहित थर्ड-पार्टी सेवाओं के साथ इंटरेक्ट कर सकता है। थर्ड-पार्टी सेवाएं उनके अपने नियमों और गोपनीयता नीतियों द्वारा शासित होती हैं।"
        ]},
        {h:"9. अपडेट और बदलाव",b:[
          'हम App को अपडेट कर सकते हैं, फीचर्स जोड़ या हटा सकते हैं, बग ठीक कर सकते हैं, कीमतें बदल सकते हैं, कैंपेन बदल सकते हैं या इन शर्तों को अपडेट कर सकते हैं। महत्वपूर्ण बदलाव करने पर हम "अंतिम अपडेट" तारीख को अपडेट करेंगे और उचित होने पर अतिरिक्त सूचना दे सकते हैं।'
        ]},
        {h:"10. कोई वारंटी नहीं",b:[
          'App "जैसा है" और "उपलब्धता के अनुसार" प्रदान किया जाता है। कानून द्वारा अनुमत अधिकतम सीमा तक, हम व्यापारिकता, किसी विशेष उद्देश्य के लिए उपयुक्तता, गैर-उल्लंघन, उपलब्धता, सटीकता और त्रुटि-मुक्त संचालन की वारंटी को अस्वीकार करते हैं।'

        {h:"12. Apple और Google की शर्तें",b:[
          "यदि आपने Apple App Store या Google Play से App डाउनलोड किया है, तो आपका उपयोग लागू मार्केटप्लेस शर्तों, सब्सक्रिप्शन नियमों, पेमेंट नियमों, रिफंड नियमों और प्लेटफॉर्म पॉलिसी के अधीन भी है।"

      bn: [
        {h:"1. চুক্তি",b:[
          'এই পরিষেবার শর্তাবলী ("শর্তাবলী") ScanSpace ("অ্যাপ") এ আপনার অ্যাক্সেস এবং ব্যবহার পরিচালনা করে। অ্যাপটি ডাউনলোড, অ্যাক্সেস বা ব্যবহার করে আপনি এই শর্তাবলীতে সম্মত হন। যদি সম্মত না হন, অ্যাপটি ব্যবহার করবেন না।'
        ]},
        {h:"2. অ্যাপটি কী করে",b:[
          "ScanSpace হল QR স্ক্যানিং, QR জেনারেশন, ডকুমেন্ট স্ক্যানিং, PDF এডিটিং, PDF অর্গানাইজেশন, Secure QR ফিচার, ড্রাফট রিকভারি এবং সংশ্লিষ্ট প্রোডাক্টিভিটি টুলসের জন্য একটি মোবাইল ইউটিলিটি অ্যাপ।",
          "কিছু ফিচার বিনামূল্যে হতে পারে। কিছু ফিচারের জন্য Pro সাবস্ক্রিপশন, ফ্রি ট্রায়াল, লাইফটাইম পার্চেজ, রিওয়ার্ডেড আনলক বা অ্যাপে দেখানো অন্য কোনো এনটাইটেলমেন্টের প্রয়োজন হতে পারে।"
        ]},
        {h:"3. আপনার কন্টেন্ট এবং দায়িত্ব",b:[
          "আপনি যে QR কোড, PDF, ডকুমেন্ট, ছবি, টেক্সট, লিংক, Wi-Fi বিবরণ, যোগাযোগের তথ্য, Secure QR কন্টেন্ট, পাসওয়ার্ড, সিগনেচার, অ্যানোটেশন এবং অন্যান্য কন্টেন্ট স্ক্যান, তৈরি, এডিট, স্টোর, শেয়ার বা এক্সপোর্ট করেন সেগুলোর জন্য আপনি দায়ী।",
          "আপনি সম্মত হন যে অ্যাপটি এমন কন্টেন্ট তৈরি, স্টোর, বিতরণ বা শেয়ার করতে ব্যবহার করবেন না যা:",
          ["কোনো আইন, বিধিমালা বা তৃতীয় পক্ষের অধিকার লঙ্ঘন করে;","ম্যালওয়্যার, ফিশিং লিংক, স্ক্যাম, প্রতারণামূলক নির্দেশনা বা ক্ষতিকর পেলোড ধারণ করে;","কপিরাইট, ট্রেডমার্ক, গোপনীয়তা বা অন্যান্য মেধাস্বত্ব অধিকার লঙ্ঘন করে;","অপমানজনক, প্রতারণামূলক বা অন্য কোনো ব্যক্তি, ডিভাইস, সেবা বা নেটওয়ার্কের ক্ষতি করার উদ্দেশ্যে।"]
        ]},
        {h:"4. লোকাল ফাইল, ড্রাফট এবং ডেটা লস",b:[
          "ScanSpace আপনার ডিভাইসে স্থানীয়ভাবে অনেক স্ক্যান, ড্রাফট, PDF ফাইল এবং হিস্ট্রি আইটেম সংরক্ষণ করতে ডিজাইন করা হয়েছে। গুরুত্বপূর্ণ ডকুমেন্ট ও পাসওয়ার্ডের ব্যাকআপ কপি রাখা আপনার দায়িত্ব। লোকাল ফাইল হারিয়ে যেতে পারে যদি আপনি সেগুলো মুছে ফেলেন, অ্যাপ ডেটা ক্লিয়ার করেন, অ্যাপ আনইনস্টল করেন, ডিভাইস স্টোরেজ পরিবর্তন করেন বা অপারেটিং সিস্টেম অস্থায়ী ফাইল মুছে ফেলে।"
        ]},
        {h:"5. স্ক্যানিং, OCR, PDF টুলস এবং QR আউটপুটের নির্ভুলতা",b:[
          "আমরা QR স্ক্যানিং, ডকুমেন্ট স্ক্যানিং, OCR, PDF এডিটিং, PDF কনভার্সন, Secure QR এবং QR জেনারেশন নির্ভরযোগ্য করতে কাজ করি, তবে কোনো অ্যাপই সব পরিস্থিতিতে নিখুঁত ফলাফলের নিশ্চয়তা দিতে পারে না। আলো, ক্যামেরার মান, ফাইল দুর্নীতি, PDF কাঠামো, ফন্ট এনকোডিং, ছবির মান, অসমর্থিত ফরম্যাট, QR ক্ষতি এবং তৃতীয় পক্ষের অ্যাপের আচরণ ফলাফল প্রভাবিত করতে পারে।",
          "গুরুত্বপূর্ণ স্ক্যান ফলাফল, QR পেলোড, OCR টেক্সট, পাসওয়ার্ড, এক্সপোর্ট করা PDF ও DOCX ফাইল, সিগনেচার, ওয়াটারমার্ক, অ্যানোটেশন এবং এডিটেড ডকুমেন্ট ব্যবহার বা শেয়ার করার আগে পর্যালোচনা করুন।"
        ]},
        {h:"6. Secure QR এবং পাসওয়ার্ড-সুরক্ষিত PDF",b:[
          "Secure QR এবং PDF পাসওয়ার্ড ফিচারগুলো কন্টেন্টে সুরক্ষা যোগ করার জন্য। এগুলো এন্টারপ্রাইজ সিকিউরিটি সিস্টেম, আইনি সম্মতি সিস্টেম বা পেশাদার ডকুমেন্ট সিকিউরিটি পরামর্শের বিকল্প নয়। শক্তিশালী পাসওয়ার্ড নির্বাচন, সেগুলো গোপন রাখা এবং মনে রাখা আপনার দায়িত্ব। আমরা এনক্রিপ্টেড কন্টেন্ট বা পাসওয়ার্ড-সুরক্ষিত PDF পুনরুদ্ধার করতে সক্ষম নাও হতে পারি।"
        ]},
        {h:"7. সাবস্ক্রিপশন, ট্রায়াল এবং পার্চেজ",b:[
          "ScanSpace মাসিক, বার্ষিক, লাইফটাইম, ট্রায়াল, প্রমোশনাল বা রিওয়ার্ডেড-অ্যাক্সেস বিকল্প অফার করতে পারে। মূল্য, ট্রায়ালের দৈর্ঘ্য, ফিচার এবং প্রাপ্যতা দেশ, প্ল্যাটফর্ম, ক্যাম্পেইন এবং সময় অনুযায়ী পরিবর্তিত হতে পারে।",
          ["Apple App Store বা Google Play নিয়ম অনুযায়ী বাতিল না করলে সাবস্ক্রিপশন স্বয়ংক্রিয়ভাবে নবায়ন হয়।","ট্রায়াল শেষ হওয়ার আগে বাতিল না করলে ফ্রি ট্রায়াল পেইড সাবস্ক্রিপশনে রূপান্তরিত হতে পারে।","Apple App Store বা Google Play অ্যাকাউন্ট সেটিংস থেকে সাবস্ক্রিপশন পরিচালনা বা বাতিল করতে পারবেন।","Apple, Google বা প্রযোজ্য অ্যাপ মার্কেটপ্লেস তাদের নীতি অনুযায়ী রিফান্ড পরিচালনা করে।"],
          "আমরা সময়ের সাথে বিনামূল্যে ও পেইড ফিচারের প্রাপ্যতা পরিবর্তন করতে পারি, তবে পরিবর্তনগুলো যুক্তিসংগত বিকল্প ছাড়া সক্রিয় পেইড এনটাইটেলমেন্ট ইচ্ছাকৃতভাবে সরাবে না।"
        ]},
        {h:"8. তৃতীয় পক্ষের সেবা",b:[
          "অ্যাপটি Apple App Store, Google Play, Firebase, ইমেইল অ্যাপ, ফাইল প্রোভাইডার, ব্রাউজার, ক্লাউড স্টোরেজ অ্যাপ, মেসেজিং অ্যাপ এবং কন্টেন্ট শেয়ার বা খোলার জন্য আপনার নির্বাচিত অন্যান্য অ্যাপ সহ তৃতীয় পক্ষের সেবার সাথে যোগাযোগ করতে পারে। তৃতীয় পক্ষের সেবাগুলো তাদের নিজস্ব শর্তাবলী ও গোপনীয়তা নীতি দ্বারা পরিচালিত।"
        ]},
        {h:"9. আপডেট এবং পরিবর্তন",b:[
          'আমরা অ্যাপ আপডেট করতে, ফিচার যোগ বা সরাতে, বাগ ঠিক করতে, মূল্য পরিবর্তন করতে, ক্যাম্পেইন সংশোধন করতে বা এই শর্তাবলী আপডেট করতে পারি। গুরুত্বপূর্ণ পরিবর্তন করলে আমরা "সর্বশেষ আপডেট" তারিখ আপডেট করব এবং প্রযোজ্য ক্ষেত্রে অতিরিক্ত নোটিশ দিতে পারি।'
        ]},
        {h:"10. কোনো ওয়ারেন্টি নেই",b:[
          'অ্যাপটি "যেমন আছে" এবং "উপলব্ধ অনুযায়ী" প্রদান করা হয়। আইন দ্বারা অনুমোদিত সর্বোচ্চ পরিমাণে, আমরা বাণিজ্যিকতা, নির্দিষ্ট উদ্দেশ্যে উপযুক্ততা, অ-লঙ্ঘন, প্রাপ্যতা, নির্ভুলতা এবং ত্রুটিমুক্ত পরিচালনার ওয়ারেন্টি অস্বীকার করি।'
        ]},
        {h:"11. দায়বদ্ধতার সীমাবদ্ধতা",b:[
          "আইন দ্বারা অনুমোদিত সর্বোচ্চ পরিমাণে, আমরা পরোক্ষ, আনুষঙ্গিক, বিশেষ, পরিণামী, উদাহরণমূলক বা শাস্তিমূলক ক্ষতি, বা ডেটা লস, ডকুমেন্ট লস, মুনাফা লস, ব্যবসায়িক বিঘ্ন, ডিভাইস সমস্যা, ভুল স্ক্যান ফলাফল, ব্যর্থ এক্সপোর্ট বা জেনারেটেড বা স্ক্যান করা কন্টেন্টের উপর নির্ভরতার জন্য দায়ী নই।"
        ]},
        {h:"12. Apple এবং Google শর্তাবলী",b:[
          "আপনি যদি Apple App Store বা Google Play থেকে অ্যাপটি ডাউনলোড করে থাকেন, তাহলে আপনার ব্যবহার প্রযোজ্য মার্কেটপ্লেস শর্তাবলী, সাবস্ক্রিপশন নিয়ম, পেমেন্ট নিয়ম, রিফান্ড নিয়ম এবং প্ল্যাটফর্ম নীতির অধীনেও।"
        ]},
        {h:"13. যোগাযোগ",b:["এই শর্তাবলী সম্পর্কে প্রশ্নের জন্য, {{email}} এ আমাদের সাথে যোগাযোগ করুন।"]}
      ],
      id: [
        {h:"1. Perjanjian",b:[

        {h:"2. Apa yang dilakukan App",b:[

          "Beberapa fitur mungkin gratis. Beberapa fitur mungkin memerlukan langganan Pro, uji coba gratis, pembelian seumur hidup, buka kunci berhadiah, atau hak lain yang ditampilkan di App."

        {h:"3. Konten dan tanggung jawab Anda",b:[

          "Anda setuju untuk tidak menggunakan App untuk membuat, menyimpan, mendistribusikan, atau membagikan konten yang:",
          ["melanggar hukum, peraturan, atau hak pihak ketiga mana pun;","mengandung malware, tautan phishing, penipuan, instruksi menyesatkan, atau muatan berbahaya;","melanggar hak cipta, merek dagang, privasi, publisitas, atau hak kekayaan intelektual lainnya;","bersifat kasar, curang, atau dimaksudkan untuk merugikan orang lain, perangkat, layanan, atau jaringan."]
        ]},
        {h:"4. File lokal, draf, dan kehilangan data",b:[
          "ScanSpace dirancang untuk menyimpan banyak pemindaian, draf, file PDF, dan item riwayat secara lokal di perangkat Anda. Anda bertanggung jawab untuk menyimpan salinan cadangan dokumen dan kata sandi penting. File lokal dapat hilang jika Anda menghapusnya, menghapus data app, menghapus instalan App, mengubah penyimpanan perangkat, atau jika sistem operasi menghapus file sementara."
        ]},
        {h:"5. Akurasi pemindaian, OCR, alat PDF, dan output QR",b:[
          "Kami berupaya membuat pemindaian QR, pemindaian dokumen, OCR, pengeditan PDF, konversi PDF, Secure QR, dan pembuatan QR menjadi andal, tetapi tidak ada app yang dapat menjamin hasil sempurna dalam setiap kondisi. Pencahayaan, kualitas kamera, kerusakan file, struktur PDF, pengkodean font, kualitas gambar, format yang tidak didukung, kerusakan QR, dan perilaku app pihak ketiga dapat memengaruhi hasil.",
          "Anda harus meninjau hasil pemindaian penting, muatan QR, teks OCR, kata sandi, PDF yang diekspor, file DOCX yang diekspor, tanda tangan, tanda air, anotasi, dan dokumen yang diedit sebelum mengandalkan atau membagikannya."
        ]},
        {h:"6. Secure QR dan PDF yang dilindungi kata sandi",b:[
          "Fitur Secure QR dan kata sandi PDF dimaksudkan untuk menambahkan perlindungan pada konten. Fitur ini bukan pengganti sistem keamanan perusahaan, sistem kepatuhan hukum, atau saran keamanan dokumen profesional. Anda bertanggung jawab memilih kata sandi yang kuat, menjaganya tetap pribadi, dan mengingatnya. Kami mungkin tidak dapat memulihkan konten terenkripsi atau PDF yang dilindungi kata sandi."
        ]},
        {h:"7. Langganan, percobaan, dan pembelian",b:[
          "ScanSpace dapat menawarkan opsi bulanan, tahunan, seumur hidup, percobaan, promosi, atau akses berhadiah. Harga, durasi percobaan, fitur, dan ketersediaan dapat bervariasi berdasarkan negara, platform, kampanye, dan waktu.",
          ["Langganan diperbarui secara otomatis kecuali dibatalkan sesuai aturan Apple App Store atau Google Play.","Uji coba gratis dapat berubah menjadi langganan berbayar kecuali dibatalkan sebelum uji coba berakhir.","Anda dapat mengelola atau membatalkan langganan melalui pengaturan akun Apple App Store atau Google Play.","Pengembalian dana ditangani oleh Apple, Google, atau marketplace app yang berlaku sesuai kebijakan mereka."],
          "Kami dapat mengubah ketersediaan fitur gratis dan berbayar dari waktu ke waktu, tetapi perubahan tidak akan secara sengaja menghapus hak berbayar aktif tanpa pengganti yang wajar."
        ]},
        {h:"8. Layanan pihak ketiga",b:[
          "App dapat berinteraksi dengan layanan pihak ketiga, termasuk Apple App Store, Google Play, Firebase, app email, penyedia file, browser, app penyimpanan cloud, app pesan, dan app lain yang Anda pilih untuk berbagi atau membuka konten. Layanan pihak ketiga diatur oleh syarat dan kebijakan privasi mereka sendiri."
        ]},
        {h:"9. Pembaruan dan perubahan",b:[
          'Kami dapat memperbarui App, menambah atau menghapus fitur, memperbaiki bug, mengubah harga, memodifikasi kampanye, atau memperbarui Syarat ini. Jika kami membuat perubahan material, kami akan memperbarui tanggal "Terakhir diperbarui" dan dapat memberikan pemberitahuan tambahan jika diperlukan.'
        ]},
        {h:"10. Tanpa garansi",b:[
          'App disediakan "sebagaimana adanya" dan "sebagaimana tersedia". Sejauh diizinkan oleh hukum, kami menyangkal garansi kelayakan jual, kesesuaian untuk tujuan tertentu, non-pelanggaran, ketersediaan, akurasi, dan operasi bebas kesalahan.'
        ]},
        {h:"11. Batasan tanggung jawab",b:[
          "Sejauh diizinkan oleh hukum, kami tidak bertanggung jawab atas kerusakan tidak langsung, insidental, khusus, konsekuensial, teladan, atau hukuman, atau atas kehilangan data, kehilangan dokumen, kehilangan keuntungan, gangguan bisnis, masalah perangkat, hasil pemindaian yang tidak akurat, ekspor yang gagal, atau ketergantungan pada konten yang dihasilkan atau dipindai."
        ]},
        {h:"12. Syarat Apple dan Google",b:[
          "Jika Anda mengunduh App dari Apple App Store atau Google Play, penggunaan Anda juga tunduk pada syarat marketplace yang berlaku, aturan langganan, aturan pembayaran, aturan pengembalian dana, dan kebijakan platform."
        ]},

      ms: [
        {h:"1. Perjanjian",b:[
          'Terma Perkhidmatan ini ("Terma") mengawal akses dan penggunaan ScanSpace ("App") oleh anda. Dengan memuat turun, mengakses, atau menggunakan App, anda bersetuju dengan Terma ini. Jika tidak bersetuju, jangan gunakan App.'
        ]},
        {h:"2. Apa yang App lakukan",b:[
          "ScanSpace ialah app utiliti mudah alih untuk pengimbasan QR, penjanaan QR, pengimbasan dokumen, penyuntingan PDF, pengorganisasian PDF, ciri Secure QR, pemulihan draf, dan alat produktiviti berkaitan.",
          "Sesetengah ciri mungkin percuma. Sesetengah ciri mungkin memerlukan langganan Pro, percubaan percuma, pembelian seumur hidup, buka kunci ganjaran, atau hak lain yang ditunjukkan dalam App."
        ]},
        {h:"3. Kandungan dan tanggungjawab anda",b:[
          "Anda bertanggungjawab atas kod QR, PDF, dokumen, imej, teks, pautan, butiran Wi-Fi, butiran kenalan, kandungan Secure QR, kata laluan, tandatangan, anotasi, dan kandungan lain yang anda imbas, cipta, sunting, simpan, kongsi, atau eksport.",
          "Anda bersetuju untuk tidak menggunakan App bagi mencipta, menyimpan, mengedarkan, atau berkongsi kandungan yang:",
          ["melanggar mana-mana undang-undang, peraturan, atau hak pihak ketiga;","mengandungi perisian hasad, pautan pancingan data, penipuan, arahan mengelirukan, atau muatan berbahaya;","melanggar hak cipta, cap dagangan, privasi, publisiti, atau hak harta intelek lain;","bersifat kasar, penipuan, atau bertujuan untuk membahayakan orang lain, peranti, perkhidmatan, atau rangkaian."]
        ]},
        {h:"4. Fail tempatan, draf, dan kehilangan data",b:[
          "ScanSpace direka untuk menyimpan banyak imbasan, draf, fail PDF, dan item sejarah secara tempatan pada peranti anda. Anda bertanggungjawab untuk menyimpan salinan sandaran dokumen dan kata laluan penting. Fail tempatan boleh hilang jika anda memadamnya, mengosongkan data app, menyahpasang App, menukar storan peranti, atau jika sistem pengendalian membuang fail sementara."
        ]},
        {h:"5. Ketepatan pengimbasan, OCR, alat PDF, dan output QR",b:[
          "Kami berusaha menjadikan pengimbasan QR, pengimbasan dokumen, OCR, penyuntingan PDF, penukaran PDF, Secure QR, dan penjanaan QR boleh dipercayai, tetapi tiada app yang boleh menjamin keputusan sempurna dalam setiap keadaan. Pencahayaan, kualiti kamera, kerosakan fail, struktur PDF, pengekodan fon, kualiti imej, format tidak disokong, kerosakan QR, dan kelakuan app pihak ketiga boleh mempengaruhi keputusan.",
          "Anda harus menyemak keputusan imbasan penting, muatan QR, teks OCR, kata laluan, PDF yang dieksport, fail DOCX yang dieksport, tandatangan, tera air, anotasi, dan dokumen yang disunting sebelum bergantung atau berkongsinya."
        ]},
        {h:"6. Secure QR dan PDF yang dilindungi kata laluan",b:[
          "Ciri Secure QR dan kata laluan PDF bertujuan untuk menambah perlindungan pada kandungan. Ciri ini bukan pengganti sistem keselamatan perusahaan, sistem pematuhan undang-undang, atau nasihat keselamatan dokumen profesional. Anda bertanggungjawab memilih kata laluan yang kukuh, menjaganya sulit, dan mengingatnya. Kami mungkin tidak dapat memulihkan kandungan yang disulitkan atau PDF yang dilindungi kata laluan."
        ]},
        {h:"7. Langganan, percubaan, dan pembelian",b:[
          "ScanSpace boleh menawarkan pilihan bulanan, tahunan, seumur hidup, percubaan, promosi, atau akses berdasarkan ganjaran. Harga, tempoh percubaan, ciri, dan ketersediaan boleh berbeza mengikut negara, platform, kempen, dan masa.",
          ["Langganan diperbaharui secara automatik melainkan dibatalkan mengikut peraturan Apple App Store atau Google Play.","Percubaan percuma boleh bertukar kepada langganan berbayar melainkan dibatalkan sebelum percubaan tamat.","Anda boleh mengurus atau membatalkan langganan melalui tetapan akaun Apple App Store atau Google Play anda.","Bayaran balik dikendalikan oleh Apple, Google, atau marketplace app yang berkenaan mengikut polisi mereka."],
          "Kami boleh menukar ketersediaan ciri percuma dan berbayar dari semasa ke semasa, tetapi perubahan tidak akan dengan sengaja mengalih keluar hak berbayar aktif tanpa penggantian yang munasabah."
        ]},
        {h:"8. Perkhidmatan pihak ketiga",b:[
          "App boleh berinteraksi dengan perkhidmatan pihak ketiga, termasuk Apple App Store, Google Play, Firebase, app e-mel, pembekal fail, pelayar, app storan awan, app pemesejan, dan app lain yang anda pilih untuk berkongsi atau membuka kandungan. Perkhidmatan pihak ketiga dikawal oleh terma dan polisi privasi mereka sendiri."
        ]},
        {h:"9. Kemas kini dan perubahan",b:[
          'Kami boleh mengemas kini App, menambah atau mengalih keluar ciri, membaiki pepijat, mengubah harga, mengubah suai kempen, atau mengemas kini Terma ini. Jika kami membuat perubahan material, kami akan mengemas kini tarikh "Terakhir dikemas kini" dan boleh memberikan notis tambahan jika sesuai.'
        ]},
        {h:"10. Tiada waranti",b:[
          'App disediakan atas asas "seadanya" dan "mengikut ketersediaan". Setakat yang dibenarkan oleh undang-undang, kami menafikan waranti kebolehdagangan, kesesuaian untuk tujuan tertentu, bukan pelanggaran, ketersediaan, ketepatan, dan operasi bebas ralat.'
        ]},
        {h:"11. Had liabiliti",b:[
          "Setakat yang dibenarkan oleh undang-undang, kami tidak akan bertanggungjawab atas kerosakan tidak langsung, insidental, khas, berbangkit, teladan, atau punitif, atau atas kehilangan data, kehilangan dokumen, kehilangan keuntungan, gangguan perniagaan, masalah peranti, keputusan imbasan yang tidak tepat, eksport yang gagal, atau pergantungan pada kandungan yang dijana atau diimbas."
        ]},
        {h:"12. Terma Apple dan Google",b:[
          "Jika anda memuat turun App daripada Apple App Store atau Google Play, penggunaan anda juga tertakluk kepada terma marketplace yang berkenaan, peraturan langganan, peraturan pembayaran, peraturan bayaran balik, dan polisi platform."
        ]},
        {h:"13. Hubungi",b:["Jika anda mempunyai soalan tentang Terma ini, hubungi kami di {{email}}."]}

      vi: [
        {h:"1. Thỏa thuận",b:[
          'Điều khoản Dịch vụ này ("Điều khoản") điều chỉnh việc bạn truy cập và sử dụng ScanSpace ("App"). Khi tải xuống, truy cập hoặc sử dụng App, bạn đồng ý với các Điều khoản này. Nếu không đồng ý, đừng sử dụng App.'
        ]},
        {h:"2. App làm gì",b:[
          "ScanSpace là ứng dụng tiện ích di động dùng để quét QR, tạo QR, quét tài liệu, chỉnh sửa PDF, tổ chức PDF, tính năng Secure QR, khôi phục bản nháp và các công cụ năng suất liên quan.",
          "Một số tính năng có thể miễn phí. Một số có thể yêu cầu đăng ký Pro, dùng thử miễn phí, mua trọn đời, mở khóa thưởng hoặc quyền sử dụng khác được hiển thị trong App."
        ]},
        {h:"3. Nội dung và trách nhiệm của bạn",b:[
          "Bạn chịu trách nhiệm với các mã QR, PDF, tài liệu, hình ảnh, văn bản, liên kết, thông tin Wi-Fi, thông tin liên hệ, nội dung Secure QR, mật khẩu, chữ ký, chú thích và nội dung khác mà bạn quét, tạo, chỉnh sửa, lưu trữ, chia sẻ hoặc xuất.",
          "Bạn đồng ý không sử dụng App để tạo, lưu trữ, phân phối hoặc chia sẻ nội dung:",
          ["vi phạm bất kỳ luật, quy định hoặc quyền của bên thứ ba nào;","chứa phần mềm độc hại, liên kết lừa đảo, scam, hướng dẫn gian lận hoặc tải trọng có hại;","xâm phạm bản quyền, nhãn hiệu, quyền riêng tư, quyền công khai hoặc quyền sở hữu trí tuệ khác;","mang tính xúc phạm, gian lận hoặc nhằm gây hại cho người khác, thiết bị, dịch vụ hoặc mạng lưới."]
        ]},
        {h:"4. Tệp cục bộ, bản nháp và mất dữ liệu",b:[
          "ScanSpace được thiết kế để lưu trữ nhiều bản quét, bản nháp, tệp PDF và mục lịch sử cục bộ trên thiết bị của bạn. Bạn chịu trách nhiệm giữ bản sao lưu của các tài liệu và mật khẩu quan trọng. Tệp cục bộ có thể bị mất nếu bạn xóa chúng, xóa dữ liệu App, gỡ cài đặt App, thay đổi bộ nhớ thiết bị hoặc nếu hệ điều hành xóa tệp tạm thời."
        ]},
        {h:"5. Độ chính xác của quét, OCR, công cụ PDF và đầu ra QR",b:[
          "Chúng tôi nỗ lực làm cho việc quét QR, quét tài liệu, OCR, chỉnh sửa PDF, chuyển đổi PDF, Secure QR và tạo QR trở nên đáng tin cậy, nhưng không có App nào có thể đảm bảo kết quả hoàn hảo trong mọi điều kiện. Ánh sáng, chất lượng camera, lỗi tệp, cấu trúc PDF, mã hóa font, chất lượng hình ảnh, định dạng không được hỗ trợ, hỏng QR và hành vi App của bên thứ ba có thể ảnh hưởng đến kết quả.",
          "Bạn nên xem xét kết quả quét quan trọng, payload QR, văn bản OCR, mật khẩu, PDF đã xuất, tệp DOCX đã xuất, chữ ký, hình mờ, chú thích và tài liệu đã chỉnh sửa trước khi sử dụng hoặc chia sẻ."
        ]},
        {h:"6. Secure QR và PDF được bảo vệ bằng mật khẩu",b:[
          "Tính năng Secure QR và mật khẩu PDF nhằm mục đích bảo vệ thêm cho nội dung. Chúng không thay thế hệ thống bảo mật doanh nghiệp, hệ thống tuân thủ pháp lý hoặc tư vấn bảo mật tài liệu chuyên nghiệp. Bạn chịu trách nhiệm chọn mật khẩu mạnh, giữ bí mật và ghi nhớ chúng. Chúng tôi có thể không thể khôi phục nội dung được mã hóa hoặc PDF được bảo vệ bằng mật khẩu."
        ]},
        {h:"7. Đăng ký, dùng thử và mua hàng",b:[
          "ScanSpace có thể cung cấp các tùy chọn hàng tháng, hàng năm, trọn đời, dùng thử, khuyến mại hoặc truy cập dựa trên phần thưởng. Giá cả, thời gian dùng thử, tính năng và tính khả dụng có thể khác nhau theo quốc gia, nền tảng, chiến dịch và thời gian.",
          ["Đăng ký tự động gia hạn trừ khi bị hủy theo quy tắc của Apple App Store hoặc Google Play.","Dùng thử miễn phí có thể chuyển thành đăng ký trả phí nếu không hủy trước khi kết thúc thời gian dùng thử.","Bạn có thể quản lý hoặc hủy đăng ký qua cài đặt tài khoản Apple App Store hoặc Google Play của mình.","Hoàn tiền được xử lý bởi Apple, Google hoặc marketplace ứng dụng áp dụng theo chính sách của họ."],
          "Chúng tôi có thể thay đổi tính khả dụng của các tính năng miễn phí và trả phí theo thời gian, nhưng các thay đổi sẽ không cố ý xóa quyền đã trả phí đang hoạt động mà không có sự thay thế hợp lý."
        ]},
        {h:"8. Dịch vụ của bên thứ ba",b:[
          "App có thể tương tác với các dịch vụ của bên thứ ba, bao gồm Apple App Store, Google Play, Firebase, ứng dụng email, nhà cung cấp tệp, trình duyệt, ứng dụng lưu trữ đám mây, ứng dụng nhắn tin và các ứng dụng khác mà bạn chọn để chia sẻ hoặc mở nội dung. Dịch vụ của bên thứ ba được điều chỉnh bởi điều khoản và chính sách quyền riêng tư riêng của họ."
        ]},
        {h:"9. Cập nhật và thay đổi",b:[
          'Chúng tôi có thể cập nhật App, thêm hoặc xóa tính năng, sửa lỗi, thay đổi giá, điều chỉnh chiến dịch hoặc cập nhật Điều khoản này. Nếu thực hiện thay đổi quan trọng, chúng tôi sẽ cập nhật ngày "Cập nhật lần cuối" và có thể cung cấp thông báo bổ sung khi thích hợp.'
        ]},
        {h:"10. Không có bảo đảm",b:[
          'App được cung cấp trên cơ sở "nguyên trạng" và "theo khả năng có sẵn". Ở mức tối đa được pháp luật cho phép, chúng tôi từ chối bảo đảm về tính thương mại, sự phù hợp cho mục đích cụ thể, không vi phạm, tính khả dụng, độ chính xác và vận hành không lỗi.'
        ]},
        {h:"11. Giới hạn trách nhiệm",b:[
          "Ở mức tối đa được pháp luật cho phép, chúng tôi sẽ không chịu trách nhiệm về thiệt hại gián tiếp, ngẫu nhiên, đặc biệt, hậu quả, điển hình hoặc trừng phạt, hay về mất dữ liệu, mất tài liệu, mất lợi nhuận, gián đoạn kinh doanh, sự cố thiết bị, kết quả quét không chính xác, xuất thất bại hoặc phụ thuộc vào nội dung được tạo hoặc quét."
        ]},
        {h:"12. Điều khoản Apple và Google",b:[
          "Nếu bạn tải xuống App từ Apple App Store hoặc Google Play, việc sử dụng của bạn cũng chịu sự điều chỉnh của các điều khoản marketplace áp dụng, quy tắc đăng ký, quy tắc thanh toán, quy tắc hoàn tiền và chính sách nền tảng."
        ]},
        {h:"13. Liên hệ",b:["Nếu bạn có câu hỏi về Điều khoản này, hãy liên hệ với chúng tôi tại {{email}}."]}

      th: [
        {h:"1. ข้อตกลง",b:[
          'ข้อกำหนดการให้บริการ ("ข้อกำหนด") เหล่านี้ควบคุมการเข้าถึงและการใช้งาน ScanSpace ("แอป") ของคุณ การดาวน์โหลด เข้าถึง หรือใช้งานแอป ถือว่าคุณยอมรับข้อกำหนดเหล่านี้ หากไม่ยอมรับ กรุณาอย่าใช้แอป'

        {h:"2. แอปทำอะไร",b:[

          "บางฟีเจอร์อาจฟรี บางฟีเจอร์อาจต้องใช้ subscription Pro ทดลองใช้ฟรี การซื้อแบบตลอดชีพ การปลดล็อกแบบได้รางวัล หรือสิทธิ์อื่นที่แสดงในแอป"

    function renderSections(code) {
      const s = sections[code] || sections.en;
      const EMAIL = '<a href="mailto:khanhquang15@gmail.com">khanhquang15@gmail.com</a>';
      document.getElementById("sc").innerHTML = s.map(sec =>
        `<section><h2>${sec.h}</h2>${sec.b.map(n =>
          Array.isArray(n)
            ? `<ul>${n.map(i => `<li>${i}</li>`).join("")}</ul>`
            : `<p>${n.replace("{{email}}", EMAIL)}</p>`
        ).join("")}</section>`
      ).join("");
    }

    const select = document.getElementById("languageSelect");
    const browserLanguage = (navigator.language || "en").slice(0, 2).toLowerCase();
    const initialLanguage = copy[browserLanguage] ? browserLanguage : "en";

    for (const [code, label] of languages) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = label;
      select.appendChild(option);
    }

    function renderLanguage(code) {
      const item = copy[code] || copy.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("languageTitle").textContent = item.title;
      document.getElementById("languageSubtitle").textContent = item.subtitle;
      document.getElementById("localizedSummary").textContent = item.summary;
      document.getElementById("legalNote").textContent = item.note;
      select.value = code;
      renderSections(code);
    }

    select.addEventListener("change", (event) => renderLanguage(event.target.value));
    renderLanguage(initialLanguage);
  </script>
