  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --card: #151517;
      --elevated: #1c1c1f;
      --text: #ffffff;
      --muted: #a2a2aa;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #7c5cff;
      --success: #3ddc97;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(61, 220, 151, 0.08), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      color: var(--success);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    h2 {
      margin: 34px 0 10px;
      font-size: 22px;
      line-height: 1.25;
    }

    p, li {
      color: var(--muted);
      font-size: 16px;
    }

    strong {
      color: var(--text);
    }

    a {
      color: #b9a8ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    section {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(21, 21, 23, 0.72);
    }

    .language-card {
      background: linear-gradient(145deg, rgba(124, 92, 255, 0.12), rgba(21, 21, 23, 0.72));
    }

    .language-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    select {
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--elevated);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
    }

    .localized-summary {
      margin: 16px 0 0;
      color: var(--text);
    }

    .legal-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    ul {
      padding-left: 22px;
    }

    .meta {
      margin: 0;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

          <p class="meta" id="languageSubtitle">The English version below is the official legal text.</p>
        </div>
        <label>
          <span class="eyebrow">Language</span><br>
          <select id="languageSelect" aria-label="Select language"></select>
        </label>
      </div>
      <p class="localized-summary" id="localizedSummary"></p>
      <p class="legal-note" id="legalNote"></p>
    </section>

    <div id="sc"></div>

    <footer>
      <p><a href="./terms.html">Terms of Service</a> · ScanSpace</p>
    </footer>
  </main>

          ["<strong>QR scan results:</strong> URLs, Wi-Fi details, text, phone numbers, email links, Secure QR payloads, or PDF QR payloads that you scan.","<strong>QR content you create:</strong> URLs, Wi-Fi details, contacts, text, emails, event details, social usernames, Secure QR content, and other QR payload data entered by you.","<strong>Documents and PDFs:</strong> images, imported files, scanned document pages, edited PDF files, annotations, stamps, signatures, watermarks, passwords, OCR text, and exported files.","<strong>History, folders, and drafts:</strong> saved scan items, created QR items, PDF edit drafts, document scan drafts, favorite markers, folders, and usage organization data.","<strong>Feedback:</strong> if you submit feedback by email, we may receive your email address, message, device-provided email metadata, and any information you choose to include."],
          "This information is generally stored locally on your device. We do not operate a cloud sync service for ScanSpace in version 1 unless a future feature explicitly states otherwise."
        ]},
        {h:"3. Permissions",b:[
          "Depending on the features you use, the App may request access to:",
          ["<strong>Camera:</strong> to scan QR codes and capture document pages.","<strong>Photos or media library:</strong> to import images for QR analysis or document/PDF creation.","<strong>Files and document picker:</strong> to import, edit, export, or share PDFs and related files.","<strong>Notifications:</strong> to receive app messages, campaign alerts, or product updates if enabled."],
          "You can manage these permissions in your device settings."
        ]},
        {h:"4. Analytics, Diagnostics, and Notifications",b:[
          "ScanSpace may use Firebase services to improve reliability and product quality:",
          ["<strong>Firebase Analytics:</strong> helps us understand high-level app usage, such as feature usage and app interactions.","<strong>Firebase Crashlytics:</strong> helps us diagnose crashes, errors, device state, app version, operating system version, and technical logs related to failures.","<strong>Firebase Cloud Messaging:</strong> may process a device push token to deliver notifications or remote campaigns when notifications are enabled.","<strong>Firebase Remote Config:</strong> may be used to control app messages, campaigns, paywall copy, or feature flags."],
          "These services may process device identifiers, app instance identifiers, diagnostics, usage data, and technical metadata. They do not require us to upload your scanned PDFs, created QR content, scan history, or local drafts."
        ]},
        {h:"5. Purchases and Subscriptions",b:[
          "ScanSpace may offer free features, Pro features, subscriptions, free trials, lifetime purchases, or temporary unlocks. Payments are processed by Apple App Store or Google Play. We do not receive or store your full credit card number.",
          "We may receive purchase status information, product identifiers, entitlement status, transaction identifiers, or subscription state from Apple, Google, or in-app purchase SDKs so the App can unlock Pro features."
        ]},
        {h:"6. Sharing and Exporting",b:[
          "When you use actions such as Share, Open link, Copy, Export PDF, Export DOCX, Save to Files, or send feedback, information may be sent to third-party apps or services selected by you, such as email apps, cloud storage, browsers, messaging apps, or file providers. Their handling of data is governed by their own privacy policies."
        ]},
        {h:"7. Secure QR and PDF Passwords",b:[
          "Secure QR features are intended to protect QR content with local encryption. PDF password features are intended to protect PDF files. You are responsible for remembering passwords. We do not operate a password recovery service for local Secure QR or protected PDF files."
        ]},
        {h:"8. Data Retention and Deletion",b:[
          "Local app data remains on your device until you delete it, clear relevant history or drafts, remove files, or uninstall the App. App analytics and diagnostic data may be retained by Firebase or related service providers according to their retention settings and policies.",
          "If you contact us by email, we may retain that conversation for support, product improvement, and abuse prevention."
        ]},
        {h:"9. Children",b:[
          "ScanSpace is not directed to children under 13. We do not knowingly collect personal information from children under 13. If you believe a child has provided personal information, please contact us so we can take appropriate action."
        ]},
        {h:"10. International Users",b:[
          "ScanSpace may be used globally. Service providers such as Firebase, Apple, Google, email providers, and analytics or diagnostic systems may process information in countries other than where you live. We take a data-minimizing approach and avoid uploading your local scan content, PDFs, or drafts unless you choose to share or export them."
        ]},
        {h:"11. Changes to This Policy",b:[
          'We may update this Privacy Policy from time to time. If we make material changes, we will update the "Last updated" date and may provide additional notice in the App where appropriate.'
        ]},
        {h:"12. Contact",b:["If you have questions, requests, or feedback about this Privacy Policy, contact us at {{email}}."]}

      es: [
        {h:"1. Descripción general",b:[
          "Esta Política de Privacidad explica cómo ScanSpace maneja la información cuando usas la App. ScanSpace es una app de utilidades móvil para escanear QR, crear QR, escanear documentos, editar PDFs, organizar historial y usar herramientas PDF relacionadas.",
          "ScanSpace está diseñado con un enfoque local. Los escaneos, contenido QR generado, PDFs, borradores, carpetas e historial se almacenan en tu dispositivo a menos que elijas compartirlos, exportarlos, abrirlos o enviarlos mediante otro servicio."
        ]},
        {h:"2. Información que proporcionas o creas",b:[
          "La App puede procesar la siguiente información para proporcionar sus funciones:",
          ["<strong>Resultados de escaneo QR:</strong> URLs, datos Wi-Fi, texto, números de teléfono, enlaces de correo, payloads QR Seguro o payloads QR de PDF que escaneas.","<strong>Contenido QR que creas:</strong> URLs, datos Wi-Fi, contactos, texto, emails, detalles de eventos, nombres de usuario de redes sociales, contenido QR Seguro y otros datos de payload QR que introduces.","<strong>Documentos y PDFs:</strong> imágenes, archivos importados, páginas de documentos escaneados, PDFs editados, anotaciones, sellos, firmas, marcas de agua, contraseñas, texto OCR y archivos exportados.","<strong>Historial, carpetas y borradores:</strong> elementos de escaneo guardados, QR creados, borradores de edición PDF, borradores de escaneo de documentos, marcadores de favoritos, carpetas y datos de organización.","<strong>Comentarios:</strong> si envías comentarios por correo electrónico, podemos recibir tu dirección de email, mensaje, metadatos de email del dispositivo y cualquier información que decidas incluir."],
          "Esta información generalmente se almacena localmente en tu dispositivo. No operamos un servicio de sincronización en la nube para ScanSpace en la versión 1, salvo que una función futura lo indique expresamente."
        ]},
        {h:"3. Permisos",b:[
          "Según las funciones que uses, la App puede solicitar acceso a:",
          ["<strong>Cámara:</strong> para escanear QR y capturar páginas de documentos.","<strong>Fotos o biblioteca multimedia:</strong> para importar imágenes para análisis QR o creación de documentos/PDFs.","<strong>Archivos y selector de documentos:</strong> para importar, editar, exportar o compartir PDFs y archivos relacionados.","<strong>Notificaciones:</strong> para recibir mensajes de la app, alertas de campaña o actualizaciones de producto si están habilitadas."],
          "Puedes gestionar estos permisos en la configuración de tu dispositivo."
        ]},
        {h:"4. Analíticas, diagnósticos y notificaciones",b:[
          "ScanSpace puede usar servicios de Firebase para mejorar la fiabilidad y la calidad del producto:",
          ["<strong>Firebase Analytics:</strong> nos ayuda a comprender el uso general de la app, como el uso de funciones e interacciones.","<strong>Firebase Crashlytics:</strong> nos ayuda a diagnosticar fallos, errores, estado del dispositivo, versión de la app, versión del sistema operativo y registros técnicos relacionados con fallos.","<strong>Firebase Cloud Messaging:</strong> puede procesar un token push del dispositivo para enviar notificaciones o campañas remotas cuando las notificaciones están habilitadas.","<strong>Firebase Remote Config:</strong> puede usarse para controlar mensajes de la app, campañas, textos de paywall o indicadores de funciones."],
          "Estos servicios pueden procesar identificadores de dispositivo, identificadores de instancia de la app, diagnósticos, datos de uso y metadatos técnicos. No requieren que subamos tus PDFs escaneados, contenido QR creado, historial de escaneos ni borradores locales."
        ]},
        {h:"5. Compras y suscripciones",b:[
          "ScanSpace puede ofrecer funciones gratuitas, funciones Pro, suscripciones, pruebas gratuitas, compras de por vida o desbloqueos temporales. Los pagos se procesan a través de Apple App Store o Google Play. No recibimos ni almacenamos tu número completo de tarjeta de crédito.",
          "Podemos recibir información sobre el estado de compra, identificadores de producto, estado de derechos, identificadores de transacción o estado de suscripción de Apple, Google o SDKs de compra dentro de la app para que la App pueda desbloquear funciones Pro."
        ]},
        {h:"6. Compartir y exportar",b:[
          "Cuando usas acciones como Compartir, Abrir enlace, Copiar, Exportar PDF, Exportar DOCX, Guardar en archivos o enviar comentarios, la información puede enviarse a apps o servicios de terceros seleccionados por ti, como apps de correo, almacenamiento en la nube, navegadores, apps de mensajería o proveedores de archivos. El manejo de datos por su parte se rige por sus propias políticas de privacidad."
        ]},
        {h:"7. QR Seguro y contraseñas de PDF",b:[
          "Las funciones de QR Seguro están destinadas a proteger el contenido QR con cifrado local. Las funciones de contraseña de PDF están destinadas a proteger archivos PDF. Eres responsable de recordar las contraseñas. No operamos un servicio de recuperación de contraseñas para QR Seguro local ni para PDFs protegidos."
        ]},
        {h:"8. Retención y eliminación de datos",b:[
          "Los datos locales de la app permanecen en tu dispositivo hasta que los elimines, borres el historial o borradores relevantes, elimines archivos o desinstales la App. Los datos de analíticas y diagnóstico pueden ser retenidos por Firebase o proveedores de servicios relacionados según sus configuraciones y políticas de retención.",
          "Si nos contactas por correo electrónico, podemos conservar esa conversación para soporte, mejora del producto y prevención de abusos."
        ]},
        {h:"9. Menores",b:[
          "ScanSpace no está dirigida a menores de 13 años. No recopilamos intencionalmente información personal de menores de 13 años. Si crees que un menor ha proporcionado información personal, contáctanos para que podamos tomar las medidas adecuadas."
        ]},
        {h:"10. Usuarios internacionales",b:[
          "ScanSpace puede usarse globalmente. Proveedores de servicios como Firebase, Apple, Google, proveedores de correo y sistemas de analítica o diagnóstico pueden procesar información en países distintos al tuyo. Adoptamos un enfoque de minimización de datos y evitamos subir tu contenido de escaneo local, PDFs o borradores a menos que elijas compartirlos o exportarlos."
        ]},
        {h:"11. Cambios en esta política",b:[
          'Podemos actualizar esta Política de Privacidad periódicamente. Si realizamos cambios importantes, actualizaremos la fecha de "Última actualización" y podremos proporcionar avisos adicionales en la App donde sea apropiado.'
        ]},
        {h:"12. Contacto",b:["Si tienes preguntas, solicitudes o comentarios sobre esta Política de Privacidad, contáctanos en {{email}}."]}

      pt: [
        {h:"1. Visão geral",b:[
          "Esta Política de Privacidade explica como o ScanSpace trata as informações quando você usa o App. ScanSpace é um app de utilidades móvel para escanear QR codes, criar QR codes, escanear documentos, editar PDFs, organizar histórico e usar ferramentas PDF relacionadas.",
          "Projetamos o ScanSpace para ser local-first. Scans, conteúdo QR gerado, PDFs, rascunhos, pastas e histórico são armazenados no seu dispositivo, a menos que você escolha compartilhá-los, exportá-los, abri-los ou enviá-los usando outro serviço."
        ]},
        {h:"2. Informações que você fornece ou cria",b:[
          "O App pode processar as seguintes informações para fornecer seus recursos:",
          ["<strong>Resultados de scan QR:</strong> URLs, dados de Wi-Fi, texto, números de telefone, links de email, payloads de QR Seguro ou payloads de PDF QR que você escaneia.","<strong>Conteúdo QR que você cria:</strong> URLs, dados de Wi-Fi, contatos, texto, emails, detalhes de eventos, nomes de usuário de redes sociais, conteúdo QR Seguro e outros dados de payload QR inseridos por você.","<strong>Documentos e PDFs:</strong> imagens, arquivos importados, páginas de documentos escaneados, PDFs editados, anotações, carimbos, assinaturas, marcas d'água, senhas, texto OCR e arquivos exportados.","<strong>Histórico, pastas e rascunhos:</strong> itens de scan salvos, QR codes criados, rascunhos de edição de PDF, rascunhos de scan de documentos, marcadores de favoritos, pastas e dados de organização.","<strong>Feedback:</strong> se você enviar feedback por email, podemos receber seu endereço de email, mensagem, metadados de email do dispositivo e qualquer informação que você escolher incluir."],
          "Essas informações geralmente são armazenadas localmente no seu dispositivo. Não operamos um serviço de sincronização em nuvem para o ScanSpace na versão 1, a menos que um recurso futuro declare explicitamente o contrário."
        ]},
        {h:"3. Permissões",b:[
          "Dependendo dos recursos que você usa, o App pode solicitar acesso a:",
          ["<strong>Câmera:</strong> para escanear QR codes e capturar páginas de documentos.","<strong>Fotos ou biblioteca de mídia:</strong> para importar imagens para análise QR ou criação de documentos/PDFs.","<strong>Arquivos e seletor de documentos:</strong> para importar, editar, exportar ou compartilhar PDFs e arquivos relacionados.","<strong>Notificações:</strong> para receber mensagens do app, alertas de campanha ou atualizações de produto se ativadas."],
          "Você pode gerenciar essas permissões nas configurações do seu dispositivo."
        ]},
        {h:"4. Analytics, diagnósticos e notificações",b:[
          "O ScanSpace pode usar serviços do Firebase para melhorar a confiabilidade e a qualidade do produto:",
          ["<strong>Firebase Analytics:</strong> nos ajuda a entender o uso geral do app, como uso de recursos e interações.","<strong>Firebase Crashlytics:</strong> nos ajuda a diagnosticar falhas, erros, estado do dispositivo, versão do app, versão do sistema operacional e logs técnicos relacionados a falhas.","<strong>Firebase Cloud Messaging:</strong> pode processar um token push do dispositivo para entregar notificações ou campanhas remotas quando as notificações estão ativadas.","<strong>Firebase Remote Config:</strong> pode ser usado para controlar mensagens do app, campanhas, textos de paywall ou flags de recursos."],
          "Esses serviços podem processar identificadores de dispositivo, identificadores de instância do app, diagnósticos, dados de uso e metadados técnicos. Eles não exigem que façamos upload dos seus PDFs escaneados, conteúdo QR criado, histórico de scans ou rascunhos locais."
        ]},
        {h:"5. Compras e assinaturas",b:[
          "O ScanSpace pode oferecer recursos gratuitos, recursos Pro, assinaturas, testes gratuitos, compras vitalícias ou desbloqueios temporários. Os pagamentos são processados pela Apple App Store ou Google Play. Não recebemos nem armazenamos seu número completo de cartão de crédito.",
          "Podemos receber informações sobre status de compra, identificadores de produto, status de habilitação, identificadores de transação ou estado de assinatura da Apple, Google ou SDKs de compra no app para que o App possa desbloquear recursos Pro."
        ]},
        {h:"6. Compartilhamento e exportação",b:[
          "Quando você usa ações como Compartilhar, Abrir link, Copiar, Exportar PDF, Exportar DOCX, Salvar em Arquivos ou enviar feedback, as informações podem ser enviadas para apps ou serviços de terceiros selecionados por você, como apps de email, armazenamento em nuvem, navegadores, apps de mensagens ou provedores de arquivos. O tratamento de dados por eles é regido por suas próprias políticas de privacidade."
        ]},
        {h:"7. QR Seguro e senhas de PDF",b:[
          "Os recursos de QR Seguro destinam-se a proteger o conteúdo QR com criptografia local. Os recursos de senha de PDF destinam-se a proteger arquivos PDF. Você é responsável por lembrar as senhas. Não operamos um serviço de recuperação de senhas para QR Seguro local ou PDFs protegidos."
        ]},
        {h:"8. Retenção e exclusão de dados",b:[
          "Os dados locais do app permanecem no seu dispositivo até que você os exclua, limpe o histórico ou rascunhos relevantes, remova arquivos ou desinstale o App. Dados de analytics e diagnóstico podem ser retidos pelo Firebase ou provedores de serviços relacionados de acordo com suas configurações e políticas de retenção.",
          "Se você nos contatar por email, podemos reter essa conversa para suporte, melhoria do produto e prevenção de abusos."
        ]},
        {h:"9. Crianças",b:[
          "O ScanSpace não é destinado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de crianças menores de 13 anos. Se você acreditar que uma criança forneceu informações pessoais, entre em contato conosco para que possamos tomar as medidas adequadas."
        ]},
        {h:"10. Usuários internacionais",b:[
          "O ScanSpace pode ser usado globalmente. Provedores de serviços como Firebase, Apple, Google, provedores de email e sistemas de analytics ou diagnóstico podem processar informações em países diferentes de onde você mora. Adotamos uma abordagem de minimização de dados e evitamos fazer upload do seu conteúdo de scan local, PDFs ou rascunhos, a menos que você escolha compartilhá-los ou exportá-los."
        ]},
        {h:"11. Alterações nesta política",b:[
          'Podemos atualizar esta Política de Privacidade periodicamente. Se fizermos alterações importantes, atualizaremos a data de "Última atualização" e poderemos fornecer aviso adicional no App onde for apropriado.'
        ]},
        {h:"12. Contato",b:["Se você tiver perguntas, solicitações ou feedback sobre esta Política de Privacidade, entre em contato pelo {{email}}."]}

      fr: [
        {h:"1. Présentation",b:[
          "Cette Politique de Confidentialité explique comment ScanSpace traite les informations lorsque vous utilisez l'App. ScanSpace est une application utilitaire mobile pour numériser des QR codes, créer des QR codes, numériser des documents, éditer des PDFs, organiser l'historique et utiliser des outils PDF associés.",
          "ScanSpace est conçu pour être local en priorité. Les scans, le contenu QR généré, les PDFs, les brouillons, les dossiers et l'historique sont stockés sur votre appareil, sauf si vous choisissez de les partager, exporter, ouvrir ou envoyer via un autre service."
        ]},
        {h:"2. Informations que vous fournissez ou créez",b:[
          "L'App peut traiter les informations suivantes pour fournir ses fonctionnalités :",
          ["<strong>Résultats de scan QR :</strong> URLs, données Wi-Fi, texte, numéros de téléphone, liens email, payloads QR Sécurisé ou payloads QR PDF que vous numérisez.","<strong>Contenu QR que vous créez :</strong> URLs, données Wi-Fi, contacts, texte, emails, détails d'événements, noms d'utilisateur de réseaux sociaux, contenu QR Sécurisé et autres données de payload QR saisies par vous.","<strong>Documents et PDFs :</strong> images, fichiers importés, pages de documents numérisés, fichiers PDF édités, annotations, tampons, signatures, filigranes, mots de passe, texte OCR et fichiers exportés.","<strong>Historique, dossiers et brouillons :</strong> éléments de scan sauvegardés, QR créés, brouillons d'édition PDF, brouillons de scan de documents, marqueurs de favoris, dossiers et données d'organisation.","<strong>Retours :</strong> si vous envoyez des retours par email, nous pouvons recevoir votre adresse email, votre message, les métadonnées email du dispositif et toute information que vous choisissez d'inclure."],
          "Ces informations sont généralement stockées localement sur votre appareil. Nous n'opérons pas de service de synchronisation cloud pour ScanSpace en version 1, sauf indication contraire d'une future fonctionnalité."
        ]},
        {h:"3. Autorisations",b:[
          "Selon les fonctionnalités que vous utilisez, l'App peut demander l'accès à :",
          ["<strong>Caméra :</strong> pour numériser des QR codes et capturer des pages de documents.","<strong>Photos ou bibliothèque multimédia :</strong> pour importer des images pour l'analyse QR ou la création de documents/PDFs.","<strong>Fichiers et sélecteur de documents :</strong> pour importer, éditer, exporter ou partager des PDFs et fichiers associés.","<strong>Notifications :</strong> pour recevoir des messages de l'app, des alertes de campagne ou des mises à jour produit si activées."],
          "Vous pouvez gérer ces autorisations dans les paramètres de votre appareil."
        ]},
        {h:"4. Analytiques, diagnostics et notifications",b:[
          "ScanSpace peut utiliser les services Firebase pour améliorer la fiabilité et la qualité du produit :",
          ["<strong>Firebase Analytics :</strong> nous aide à comprendre l'utilisation globale de l'app, comme l'utilisation des fonctionnalités et les interactions.","<strong>Firebase Crashlytics :</strong> nous aide à diagnostiquer les plantages, erreurs, état de l'appareil, version de l'app, version du système d'exploitation et journaux techniques liés aux défaillances.","<strong>Firebase Cloud Messaging :</strong> peut traiter un jeton push d'appareil pour délivrer des notifications ou des campagnes distantes lorsque les notifications sont activées.","<strong>Firebase Remote Config :</strong> peut être utilisé pour contrôler les messages de l'app, les campagnes, le contenu du paywall ou les indicateurs de fonctionnalités."],
          "Ces services peuvent traiter des identifiants d'appareils, des identifiants d'instance d'app, des diagnostics, des données d'utilisation et des métadonnées techniques. Ils ne nécessitent pas que nous téléchargions vos PDFs numérisés, votre contenu QR créé, votre historique de scans ou vos brouillons locaux."
        ]},
        {h:"5. Achats et abonnements",b:[
          "ScanSpace peut proposer des fonctionnalités gratuites, des fonctionnalités Pro, des abonnements, des essais gratuits, des achats à vie ou des déblocages temporaires. Les paiements sont traités par Apple App Store ou Google Play. Nous ne recevons ni ne stockons votre numéro de carte de crédit complet.",
          "Nous pouvons recevoir des informations sur le statut d'achat, les identifiants de produits, le statut d'habilitation, les identifiants de transaction ou l'état d'abonnement de la part d'Apple, Google ou des SDKs d'achat intégré à l'app afin que l'App puisse déverrouiller les fonctionnalités Pro."
        ]},
        {h:"6. Partage et exportation",b:[
          "Lorsque vous utilisez des actions telles que Partager, Ouvrir le lien, Copier, Exporter PDF, Exporter DOCX, Enregistrer dans les fichiers ou envoyer des retours, des informations peuvent être envoyées à des applications ou services tiers sélectionnés par vous, tels que des applications de messagerie, de stockage cloud, des navigateurs, des applications de messagerie instantanée ou des fournisseurs de fichiers. Leur traitement des données est régi par leurs propres politiques de confidentialité."
        ]},
        {h:"7. QR Sécurisé et mots de passe PDF",b:[
          "Les fonctionnalités QR Sécurisé visent à protéger le contenu QR par chiffrement local. Les fonctionnalités de mot de passe PDF visent à protéger les fichiers PDF. Vous êtes responsable de mémoriser les mots de passe. Nous n'opérons pas de service de récupération de mots de passe pour les QR Sécurisé locaux ou les PDFs protégés."
        ]},
        {h:"8. Conservation et suppression des données",b:[
          "Les données locales de l'app restent sur votre appareil jusqu'à ce que vous les supprimiez, effaciez l'historique ou les brouillons pertinents, supprimiez des fichiers ou désinstalliez l'App. Les données analytiques et de diagnostic peuvent être conservées par Firebase ou des prestataires de services associés selon leurs paramètres et politiques de conservation.",
          "Si vous nous contactez par email, nous pouvons conserver cette conversation à des fins de support, d'amélioration du produit et de prévention des abus."
        ]},
        {h:"9. Enfants",b:[
          "ScanSpace n'est pas destiné aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d'informations personnelles auprès d'enfants de moins de 13 ans. Si vous pensez qu'un enfant a fourni des informations personnelles, veuillez nous contacter afin que nous puissions prendre les mesures appropriées."
        ]},
        {h:"10. Utilisateurs internationaux",b:[
          "ScanSpace peut être utilisé mondialement. Des prestataires de services tels que Firebase, Apple, Google, des fournisseurs d'email et des systèmes d'analyse ou de diagnostic peuvent traiter des informations dans des pays autres que le vôtre. Nous adoptons une approche de minimisation des données et évitons de télécharger votre contenu de scan local, vos PDFs ou vos brouillons, sauf si vous choisissez de les partager ou les exporter."
        ]},
        {h:"11. Modifications de cette politique",b:[
          'Nous pouvons mettre à jour cette Politique de Confidentialité de temps en temps. Si nous effectuons des changements importants, nous mettrons à jour la date de "Dernière mise à jour" et pourrons fournir un avis supplémentaire dans l\'App le cas échéant.'
        ]},
        {h:"12. Contact",b:["Pour toute question, demande ou commentaire sur cette Politique de Confidentialité, contactez-nous à {{email}}."]}
      ],
      de: [
        {h:"1. Überblick",b:[
          "Diese Datenschutzrichtlinie erklärt, wie ScanSpace Informationen verarbeitet, wenn du die App verwendest. ScanSpace ist eine mobile Utility-App zum Scannen von QR-Codes, Erstellen von QR-Codes, Scannen von Dokumenten, Bearbeiten von PDFs, Organisieren des Verlaufs und Verwenden verwandter PDF-Tools.",
          "ScanSpace ist lokal ausgerichtet. Scans, erstellte QR-Inhalte, PDFs, Entwürfe, Ordner und Verlauf werden auf deinem Gerät gespeichert, sofern du sie nicht durch einen anderen Dienst teilst, exportierst, öffnest oder sendest."
        ]},
        {h:"2. Von dir bereitgestellte oder erstellte Informationen",b:[
          "Die App kann folgende Informationen verarbeiten, um ihre Funktionen bereitzustellen:",
          ["<strong>QR-Scan-Ergebnisse:</strong> URLs, WLAN-Daten, Text, Telefonnummern, E-Mail-Links, Secure-QR-Nutzlasten oder PDF-QR-Nutzlasten, die du scannst.","<strong>Von dir erstellte QR-Inhalte:</strong> URLs, WLAN-Daten, Kontakte, Text, E-Mails, Veranstaltungsdetails, Social-Media-Nutzernamen, Secure-QR-Inhalte und andere von dir eingegebene QR-Nutzlastdaten.","<strong>Dokumente und PDFs:</strong> Bilder, importierte Dateien, gescannte Dokumentseiten, bearbeitete PDF-Dateien, Anmerkungen, Stempel, Signaturen, Wasserzeichen, Passwörter, OCR-Text und exportierte Dateien.","<strong>Verlauf, Ordner und Entwürfe:</strong> gespeicherte Scan-Elemente, erstellte QR-Elemente, PDF-Bearbeitungsentwürfe, Dokumentenscannentwürfe, Favoritenmarkierungen, Ordner und Nutzungsorganisationsdaten.","<strong>Feedback:</strong> Wenn du Feedback per E-Mail einsendest, können wir deine E-Mail-Adresse, Nachricht, gerätebezogene E-Mail-Metadaten und alle Informationen empfangen, die du einzufügen wählst."],
          "Diese Informationen werden im Allgemeinen lokal auf deinem Gerät gespeichert. Wir betreiben in Version 1 keinen Cloud-Synchronisierungsdienst für ScanSpace, sofern eine zukünftige Funktion nichts anderes angibt."
        ]},
        {h:"3. Berechtigungen",b:[
          "Je nach verwendeten Funktionen kann die App Zugriff auf folgendes anfordern:",
          ["<strong>Kamera:</strong> zum Scannen von QR-Codes und Aufnehmen von Dokumentseiten.","<strong>Fotos oder Medienbibliothek:</strong> zum Importieren von Bildern für die QR-Analyse oder Dokument-/PDF-Erstellung.","<strong>Dateien und Dokument-Picker:</strong> zum Importieren, Bearbeiten, Exportieren oder Teilen von PDFs und zugehörigen Dateien.","<strong>Benachrichtigungen:</strong> zum Empfangen von App-Nachrichten, Kampagnenwarnungen oder Produktupdates, wenn aktiviert."],
          "Du kannst diese Berechtigungen in deinen Geräteeinstellungen verwalten."
        ]},
        {h:"4. Analysen, Diagnosen und Benachrichtigungen",b:[
          "ScanSpace kann Firebase-Dienste nutzen, um Zuverlässigkeit und Produktqualität zu verbessern:",
          ["<strong>Firebase Analytics:</strong> hilft uns, die allgemeine App-Nutzung zu verstehen, wie Funktionsnutzung und App-Interaktionen.","<strong>Firebase Crashlytics:</strong> hilft uns, Abstürze, Fehler, Gerätezustand, App-Version, Betriebssystemversion und technische Protokolle im Zusammenhang mit Fehlern zu diagnostizieren.","<strong>Firebase Cloud Messaging:</strong> kann ein Geräte-Push-Token verarbeiten, um Benachrichtigungen oder Remote-Kampagnen zu liefern, wenn Benachrichtigungen aktiviert sind.","<strong>Firebase Remote Config:</strong> kann verwendet werden, um App-Nachrichten, Kampagnen, Paywall-Texte oder Funktions-Flags zu steuern."],
          "Diese Dienste können Geräte-IDs, App-Instanz-IDs, Diagnosedaten, Nutzungsdaten und technische Metadaten verarbeiten. Sie erfordern nicht, dass wir deine gescannten PDFs, erstellten QR-Inhalte, Scan-Verlauf oder lokalen Entwürfe hochladen."
        ]},
        {h:"5. Käufe und Abonnements",b:[
          "ScanSpace kann kostenlose Funktionen, Pro-Funktionen, Abonnements, kostenlose Tests, Lifetime-Käufe oder temporäre Entsperrungen anbieten. Zahlungen werden über Apple App Store oder Google Play verarbeitet. Wir erhalten oder speichern deine vollständige Kreditkartennummer nicht.",
          "Wir können Kaufstatusinformationen, Produktkennungen, Berechtigungsstatus, Transaktionskennungen oder Abonnementstatus von Apple, Google oder In-App-Kauf-SDKs erhalten, damit die App Pro-Funktionen freischalten kann."
        ]},
        {h:"6. Teilen und Exportieren",b:[
          "Wenn du Aktionen wie Teilen, Link öffnen, Kopieren, PDF exportieren, DOCX exportieren, In Dateien speichern oder Feedback senden verwendest, können Informationen an von dir ausgewählte Drittanbieter-Apps oder -Dienste gesendet werden, wie E-Mail-Apps, Cloud-Speicher, Browser, Messaging-Apps oder Dateianbieter. Deren Datenverarbeitung unterliegt ihren eigenen Datenschutzrichtlinien."
        ]},
        {h:"7. Secure QR und PDF-Passwörter",b:[
          "Secure-QR-Funktionen sollen QR-Inhalte mit lokaler Verschlüsselung schützen. PDF-Passwortfunktionen sollen PDF-Dateien schützen. Du bist dafür verantwortlich, Passwörter zu merken. Wir betreiben keinen Passwort-Wiederherstellungsdienst für lokale Secure-QR- oder geschützte PDF-Dateien."
        ]},
        {h:"8. Datenspeicherung und -löschung",b:[
          "Lokale App-Daten verbleiben auf deinem Gerät, bis du sie löschst, den entsprechenden Verlauf oder Entwürfe bereinigst, Dateien entfernst oder die App deinstallierst. App-Analyse- und Diagnosedaten können von Firebase oder verwandten Dienstanbietern gemäß deren Aufbewahrungseinstellungen und Richtlinien aufbewahrt werden.",
          "Wenn du uns per E-Mail kontaktierst, können wir diese Unterhaltung für Support, Produktverbesserung und Missbrauchsprävention aufbewahren."
        ]},
        {h:"9. Kinder",b:[
          "ScanSpace richtet sich nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn du glaubst, dass ein Kind personenbezogene Daten bereitgestellt hat, kontaktiere uns bitte, damit wir geeignete Maßnahmen ergreifen können."
        ]},
        {h:"10. Internationale Nutzer",b:[
          "ScanSpace kann weltweit genutzt werden. Dienstanbieter wie Firebase, Apple, Google, E-Mail-Anbieter und Analyse- oder Diagnosesysteme können Informationen in anderen Ländern als deinem Wohnsitzland verarbeiten. Wir verfolgen einen datensparenden Ansatz und vermeiden es, deinen lokalen Scan-Inhalt, PDFs oder Entwürfe hochzuladen, es sei denn, du wählst, sie zu teilen oder zu exportieren."
        ]},
        {h:"11. Änderungen dieser Richtlinie",b:[
          'Wir können diese Datenschutzrichtlinie von Zeit zu Zeit aktualisieren. Bei wesentlichen Änderungen werden wir das Datum „Zuletzt aktualisiert" aktualisieren und können bei Bedarf eine zusätzliche Benachrichtigung in der App bereitstellen.'
        ]},
        {h:"12. Kontakt",b:["Bei Fragen, Anfragen oder Feedback zu dieser Datenschutzrichtlinie kontaktiere uns unter {{email}}."]}
      ],
      it: [
        {h:"1. Panoramica",b:[
          "Questa Informativa sulla Privacy spiega come ScanSpace tratta le informazioni quando utilizzi l'App. ScanSpace è un'app di utilità mobile per scansionare QR code, creare QR code, scansionare documenti, modificare PDF, organizzare la cronologia e utilizzare strumenti PDF correlati.",
          "ScanSpace è progettata con un approccio local-first. Scansioni, contenuto QR generato, PDF, bozze, cartelle e cronologia sono memorizzati sul tuo dispositivo, a meno che tu non scelga di condividerli, esportarli, aprirli o inviarli tramite un altro servizio."
        ]},
        {h:"2. Informazioni che fornisci o crei",b:[
          "L'App può elaborare le seguenti informazioni per fornire le sue funzionalità:",
          ["<strong>Risultati di scansione QR:</strong> URL, dati Wi-Fi, testo, numeri di telefono, link email, payload QR Sicuro o payload PDF QR che scansioni.","<strong>Contenuto QR che crei:</strong> URL, dati Wi-Fi, contatti, testo, email, dettagli di eventi, nomi utente di social, contenuto QR Sicuro e altri dati payload QR da te inseriti.","<strong>Documenti e PDF:</strong> immagini, file importati, pagine di documenti scansionati, PDF modificati, annotazioni, timbri, firme, filigrane, password, testo OCR e file esportati.","<strong>Cronologia, cartelle e bozze:</strong> elementi di scansione salvati, QR creati, bozze di modifica PDF, bozze di scansione documenti, marcatori preferiti, cartelle e dati di organizzazione.","<strong>Feedback:</strong> se invii feedback via email, potremmo ricevere il tuo indirizzo email, il messaggio, i metadati email del dispositivo e qualsiasi informazione tu scelga di includere."],
          "Queste informazioni sono generalmente memorizzate localmente sul tuo dispositivo. Non gestiamo un servizio di sincronizzazione cloud per ScanSpace nella versione 1, salvo che una funzionalità futura lo indichi esplicitamente."
        ]},
        {h:"3. Autorizzazioni",b:[
          "A seconda delle funzionalità utilizzate, l'App potrebbe richiedere l'accesso a:",
          ["<strong>Fotocamera:</strong> per scansionare QR code e acquisire pagine di documenti.","<strong>Foto o libreria multimediale:</strong> per importare immagini per l'analisi QR o la creazione di documenti/PDF.","<strong>File e selettore di documenti:</strong> per importare, modificare, esportare o condividere PDF e file correlati.","<strong>Notifiche:</strong> per ricevere messaggi dell'app, avvisi di campagna o aggiornamenti del prodotto se abilitati."],
          "Puoi gestire queste autorizzazioni nelle impostazioni del tuo dispositivo."
        ]},
        {h:"4. Analytics, diagnostica e notifiche",b:[
          "ScanSpace può utilizzare i servizi Firebase per migliorare l'affidabilità e la qualità del prodotto:",
          ["<strong>Firebase Analytics:</strong> ci aiuta a comprendere l'utilizzo generale dell'app, come l'uso delle funzionalità e le interazioni.","<strong>Firebase Crashlytics:</strong> ci aiuta a diagnosticare crash, errori, stato del dispositivo, versione dell'app, versione del sistema operativo e log tecnici relativi ai guasti.","<strong>Firebase Cloud Messaging:</strong> può elaborare un token push del dispositivo per inviare notifiche o campagne remote quando le notifiche sono abilitate.","<strong>Firebase Remote Config:</strong> può essere utilizzato per controllare i messaggi dell'app, le campagne, il testo del paywall o i flag delle funzionalità."],
          "Questi servizi possono elaborare identificatori di dispositivo, identificatori di istanza dell'app, dati diagnostici, dati di utilizzo e metadati tecnici. Non richiedono che carichiamo i tuoi PDF scansionati, il contenuto QR creato, la cronologia delle scansioni o le bozze locali."
        ]},
        {h:"5. Acquisti e abbonamenti",b:[
          "ScanSpace può offrire funzionalità gratuite, funzionalità Pro, abbonamenti, prove gratuite, acquisti a vita o sblocchi temporanei. I pagamenti vengono elaborati da Apple App Store o Google Play. Non riceviamo né memorizziamo il tuo numero completo di carta di credito.",
          "Potremmo ricevere informazioni sullo stato degli acquisti, identificatori di prodotti, stato delle autorizzazioni, identificatori di transazione o stato dell'abbonamento da Apple, Google o SDK di acquisto in-app affinché l'App possa sbloccare le funzionalità Pro."
        ]},
        {h:"6. Condivisione ed esportazione",b:[
          "Quando utilizzi azioni come Condividi, Apri link, Copia, Esporta PDF, Esporta DOCX, Salva su file o invia feedback, le informazioni possono essere inviate ad app o servizi di terze parti da te selezionati, come app di posta elettronica, archiviazione cloud, browser, app di messaggistica o fornitori di file. Il loro trattamento dei dati è regolato dalle loro politiche sulla privacy."
        ]},
        {h:"7. QR Sicuro e password PDF",b:[
          "Le funzionalità QR Sicuro sono destinate a proteggere il contenuto QR con crittografia locale. Le funzionalità di password PDF sono destinate a proteggere i file PDF. Sei responsabile di ricordare le password. Non gestiamo un servizio di recupero password per QR Sicuro locale o file PDF protetti."
        ]},
        {h:"8. Conservazione ed eliminazione dei dati",b:[
          "I dati locali dell'app rimangono sul tuo dispositivo finché non li elimini, non cancelli la cronologia o le bozze pertinenti, non rimuovi i file o non disinstalli l'App. I dati analitici e diagnostici possono essere conservati da Firebase o fornitori di servizi correlati in base alle loro impostazioni e politiche di conservazione.",
          "Se ci contatti via email, potremmo conservare quella conversazione per supporto, miglioramento del prodotto e prevenzione degli abusi."
        ]},
        {h:"9. Minori",b:[
          "ScanSpace non è destinata ai minori di 13 anni. Non raccogliamo consapevolmente informazioni personali da minori di 13 anni. Se ritieni che un minore abbia fornito informazioni personali, contattaci affinché possiamo adottare le misure appropriate."
        ]},
        {h:"10. Utenti internazionali",b:[
          "ScanSpace può essere utilizzata a livello globale. Fornitori di servizi come Firebase, Apple, Google, fornitori di email e sistemi di analisi o diagnostica possono elaborare informazioni in paesi diversi da quello in cui vivi. Adottiamo un approccio di minimizzazione dei dati ed evitiamo di caricare il tuo contenuto di scansione locale, i PDF o le bozze, a meno che tu non scelga di condividerli o esportarli."
        ]},
        {h:"11. Modifiche a questa informativa",b:[
          'Potremmo aggiornare questa Informativa sulla Privacy periodicamente. Se apportiamo modifiche sostanziali, aggiorneremo la data di "Ultimo aggiornamento" e potremo fornire ulteriore comunicazione nell\'App dove appropriato.'
        ]},
        {h:"12. Contatto",b:["Per domande, richieste o feedback su questa Informativa sulla Privacy, contattaci all'indirizzo {{email}}."]}
      ],
      nl: [
        {h:"1. Overzicht",b:[
          "Dit Privacybeleid legt uit hoe ScanSpace informatie verwerkt wanneer je de App gebruikt. ScanSpace is een mobiele hulpapp voor het scannen van QR-codes, maken van QR-codes, scannen van documenten, bewerken van PDF's, organiseren van geschiedenis en gebruik van gerelateerde PDF-tools.",
          "ScanSpace is ontworpen met een local-first aanpak. Scans, gegenereerde QR-inhoud, PDF's, concepten, mappen en geschiedenis worden opgeslagen op je apparaat, tenzij je ervoor kiest ze te delen, exporteren, openen of verzenden via een andere dienst."
        ]},
        {h:"2. Informatie die je verstrekt of aanmaakt",b:[
          "De App kan de volgende informatie verwerken om zijn functies te bieden:",
          ["<strong>QR-scanresultaten:</strong> URL's, Wi-Fi-gegevens, tekst, telefoonnummers, e-maillinks, Secure QR-payloads of PDF QR-payloads die je scant.","<strong>QR-inhoud die je aanmaakt:</strong> URL's, Wi-Fi-gegevens, contacten, tekst, e-mails, evenementdetails, sociale gebruikersnamen, Secure QR-inhoud en andere QR-payloadgegevens die je invoert.","<strong>Documenten en PDF's:</strong> afbeeldingen, geïmporteerde bestanden, gescande documentpagina's, bewerkte PDF-bestanden, annotaties, stempels, handtekeningen, watermerken, wachtwoorden, OCR-tekst en geëxporteerde bestanden.","<strong>Geschiedenis, mappen en concepten:</strong> opgeslagen scanitems, aangemaakte QR-items, PDF-bewerkingsconcepten, documentscantconcepten, favoriettmarkeringen, mappen en gebruiksorganisatiegegevens.","<strong>Feedback:</strong> als je feedback per e-mail indient, ontvangen we mogelijk jouw e-mailadres, bericht, apparaatverstrekte e-mailmetadata en informatie die je kiest op te nemen."],
          "Deze informatie wordt over het algemeen lokaal op je apparaat opgeslagen. We exploiteren geen cloudsynchronisatieservice voor ScanSpace in versie 1, tenzij een toekomstige functie dit expliciet vermeldt."
        ]},
        {h:"3. Machtigingen",b:[
          "Afhankelijk van de functies die je gebruikt, kan de App toegang vragen tot:",
          ["<strong>Camera:</strong> om QR-codes te scannen en documentpagina's vast te leggen.","<strong>Foto's of mediabibliotheek:</strong> om afbeeldingen te importeren voor QR-analyse of document-/PDF-aanmaak.","<strong>Bestanden en documentkiezer:</strong> om PDF's en gerelateerde bestanden te importeren, bewerken, exporteren of delen.","<strong>Meldingen:</strong> om app-berichten, campagnewaarschuwingen of productupdates te ontvangen indien ingeschakeld."],
          "Je kunt deze machtigingen beheren in je apparaatinstellingen."
        ]},
        {h:"4. Analyses, diagnostiek en meldingen",b:[
          "ScanSpace kan Firebase-diensten gebruiken om betrouwbaarheid en productkwaliteit te verbeteren:",
          ["<strong>Firebase Analytics:</strong> helpt ons hoog-niveau app-gebruik te begrijpen, zoals functiegebruik en app-interacties.","<strong>Firebase Crashlytics:</strong> helpt ons crashes, fouten, apparaatstatus, app-versie, besturingssysteemversie en technische logs gerelateerd aan storingen te diagnosticeren.","<strong>Firebase Cloud Messaging:</strong> kan een apparaat-push-token verwerken om meldingen of externe campagnes te leveren wanneer meldingen zijn ingeschakeld.","<strong>Firebase Remote Config:</strong> kan worden gebruikt om app-berichten, campagnes, paywall-tekst of functievlaggen te beheren."],
          "Deze diensten kunnen apparaat-ID's, app-instantie-ID's, diagnostische gegevens, gebruiksgegevens en technische metadata verwerken. Ze vereisen niet dat we jouw gescande PDF's, aangemaakte QR-inhoud, scangeschiedenis of lokale concepten uploaden."
        ]},
        {h:"5. Aankopen en abonnementen",b:[
          "ScanSpace kan gratis functies, Pro-functies, abonnementen, gratis proefperiodes, levenslange aankopen of tijdelijke ontgrendelingen aanbieden. Betalingen worden verwerkt door Apple App Store of Google Play. We ontvangen of slaan je volledige creditcardnummer niet op.",
          "We kunnen aankoopstatusinformatie, productidentificatoren, rechtenstatus, transactieidentificatoren of abonnementstatus ontvangen van Apple, Google of in-app aankoop-SDK's zodat de App Pro-functies kan ontgrendelen."
        ]},
        {h:"6. Delen en exporteren",b:[
          "Wanneer je acties gebruikt zoals Delen, Link openen, Kopiëren, PDF exporteren, DOCX exporteren, Opslaan in bestanden of feedback sturen, kan informatie worden verzonden naar door jou geselecteerde apps of diensten van derden, zoals e-mailapps, cloudopslag, browsers, messaging-apps of bestandsproviders. Hun verwerking van gegevens wordt geregeld door hun eigen privacybeleid."
        ]},
        {h:"7. Secure QR en PDF-wachtwoorden",b:[
          "Secure QR-functies zijn bedoeld om QR-inhoud te beschermen met lokale versleuteling. PDF-wachtwoordfuncties zijn bedoeld om PDF-bestanden te beschermen. Je bent verantwoordelijk voor het onthouden van wachtwoorden. We exploiteren geen wachtwoordhersteldienst voor lokale Secure QR- of beveiligde PDF-bestanden."
        ]},
        {h:"8. Gegevensretentie en verwijdering",b:[
          "Lokale app-gegevens blijven op je apparaat totdat je ze verwijdert, relevante geschiedenis of concepten wist, bestanden verwijdert of de App verwijdert. App-analyse- en diagnostische gegevens kunnen worden bewaard door Firebase of gerelateerde dienstverleners volgens hun retentie-instellingen en beleid.",
          "Als je ons per e-mail contact opneemt, kunnen we dat gesprek bewaren voor support, productverbetering en misbruikpreventie."
        ]},
        {h:"9. Kinderen",b:[
          "ScanSpace is niet gericht op kinderen onder 13 jaar. We verzamelen niet bewust persoonlijke informatie van kinderen onder 13 jaar. Als je denkt dat een kind persoonlijke informatie heeft verstrekt, neem dan contact met ons op zodat we passende actie kunnen ondernemen."
        ]},
        {h:"10. Internationale gebruikers",b:[
          "ScanSpace kan wereldwijd worden gebruikt. Dienstverleners zoals Firebase, Apple, Google, e-mailproviders en analyse- of diagnostische systemen kunnen informatie verwerken in andere landen dan waar je woont. We hanteren een dataminimaliserende aanpak en vermijden het uploaden van jouw lokale scaninhoud, PDF's of concepten, tenzij je ervoor kiest ze te delen of te exporteren."
        ]},
        {h:"11. Wijzigingen in dit beleid",b:[
          'We kunnen dit Privacybeleid van tijd tot tijd bijwerken. Bij wezenlijke wijzigingen werken we de datum "Laatst bijgewerkt" bij en kunnen we indien passend aanvullende kennisgeving in de App geven.'
        ]},
        {h:"12. Contact",b:["Als je vragen, verzoeken of feedback hebt over dit Privacybeleid, neem dan contact met ons op via {{email}}."]}
      ],
      pl: [
        {h:"1. Przegląd",b:[
          "Niniejsza Polityka Prywatności wyjaśnia, jak ScanSpace przetwarza informacje podczas korzystania z Aplikacji. ScanSpace to mobilna aplikacja użytkowa do skanowania QR kodów, tworzenia QR kodów, skanowania dokumentów, edycji PDF, organizacji historii i korzystania z powiązanych narzędzi PDF.",
          "ScanSpace został zaprojektowany z myślą o przechowywaniu danych lokalnie. Skany, wygenerowany kontent QR, pliki PDF, szkice, foldery i historia są przechowywane na Twoim urządzeniu, chyba że zdecydujesz się je udostępnić, wyeksportować, otworzyć lub wysłać za pomocą innej usługi."
        ]},
        {h:"2. Informacje, które podajesz lub tworzysz",b:[
          "Aplikacja może przetwarzać następujące informacje w celu świadczenia swoich funkcji:",
          ["<strong>Wyniki skanowania QR:</strong> URL-e, dane Wi-Fi, tekst, numery telefonów, linki email, ładunki Secure QR lub ładunki PDF QR, które skanujesz.","<strong>Zawartość QR, którą tworzysz:</strong> URL-e, dane Wi-Fi, kontakty, tekst, e-maile, szczegóły wydarzeń, nazwy użytkowników z mediów społecznościowych, zawartość Secure QR i inne dane ładunkowe QR wprowadzone przez Ciebie.","<strong>Dokumenty i pliki PDF:</strong> obrazy, importowane pliki, strony skanowanych dokumentów, edytowane pliki PDF, adnotacje, stemple, podpisy, znaki wodne, hasła, tekst OCR i wyeksportowane pliki.","<strong>Historia, foldery i szkice:</strong> zapisane elementy skanowania, utworzone elementy QR, szkice edycji PDF, szkice skanowania dokumentów, oznaczenia ulubionych, foldery i dane organizacji użytkowania.","<strong>Opinie:</strong> jeśli przesyłasz opinie przez e-mail, możemy otrzymać Twój adres e-mail, wiadomość, metadane e-mail dostarczone przez urządzenie i wszelkie informacje, które zdecydujesz się zawrzeć."],
          "Te informacje są zazwyczaj przechowywane lokalnie na Twoim urządzeniu. Nie prowadzimy usługi synchronizacji w chmurze dla ScanSpace w wersji 1, chyba że przyszła funkcja wyraźnie stwierdza inaczej."
        ]},
        {h:"3. Uprawnienia",b:[
          "W zależności od używanych funkcji, Aplikacja może prosić o dostęp do:",
          ["<strong>Aparat:</strong> do skanowania QR kodów i przechwytywania stron dokumentów.","<strong>Zdjęcia lub biblioteka multimediów:</strong> do importowania obrazów do analizy QR lub tworzenia dokumentów/PDF.","<strong>Pliki i selektor dokumentów:</strong> do importowania, edytowania, eksportowania lub udostępniania plików PDF i powiązanych plików.","<strong>Powiadomienia:</strong> do odbierania wiadomości z aplikacji, alertów kampanii lub aktualizacji produktu, jeśli są włączone."],
          "Możesz zarządzać tymi uprawnieniami w ustawieniach urządzenia."
        ]},
        {h:"4. Analizy, diagnostyka i powiadomienia",b:[
          "ScanSpace może korzystać z usług Firebase w celu poprawy niezawodności i jakości produktu:",
          ["<strong>Firebase Analytics:</strong> pomaga nam zrozumieć ogólne korzystanie z aplikacji, takie jak korzystanie z funkcji i interakcje.","<strong>Firebase Crashlytics:</strong> pomaga nam diagnozować awarie, błędy, stan urządzenia, wersję aplikacji, wersję systemu operacyjnego i techniczne logi związane z awariami.","<strong>Firebase Cloud Messaging:</strong> może przetwarzać token push urządzenia w celu dostarczania powiadomień lub zdalnych kampanii, gdy powiadomienia są włączone.","<strong>Firebase Remote Config:</strong> może być używany do kontrolowania wiadomości aplikacji, kampanii, treści paywall lub flag funkcji."],
          "Te usługi mogą przetwarzać identyfikatory urządzeń, identyfikatory instancji aplikacji, dane diagnostyczne, dane użytkowania i metadane techniczne. Nie wymagają od nas przesyłania Twoich zeskanowanych plików PDF, stworzonej zawartości QR, historii skanów ani lokalnych szkiców."
        ]},
        {h:"5. Zakupy i subskrypcje",b:[

          'Ми можемо час від часу оновлювати цю Політику конфіденційності. При суттєвих змінах ми оновимо дату «Останнього оновлення» та за потреби можемо надати додаткове повідомлення в Додатку.'
        ]},
        {h:"12. Контакти",b:["З питань, запитів або відгуків щодо цієї Політики конфіденційності зв'яжіться з нами за адресою {{email}}."]}

      tr: [
        {h:"1. Genel Bakış",b:[
          "Bu Gizlilik Politikası, Uygulamayı kullandığınızda ScanSpace'in bilgileri nasıl işlediğini açıklar. ScanSpace; QR kodları tarama, QR kodu oluşturma, belge tarama, PDF düzenleme, geçmişi düzenleme ve ilgili PDF araçlarını kullanmak için bir mobil yardımcı uygulamadır.",
          "ScanSpace yerel öncelikli olacak şekilde tasarlanmıştır. Taramalar, oluşturulan QR içeriği, PDF'ler, taslaklar, klasörler ve geçmiş; başka bir hizmet kullanarak paylaşmayı, dışa aktarmayı, açmayı veya göndermeyi seçmediğiniz sürece cihazınızda depolanır."
        ]},
        {h:"2. Sağladığınız veya oluşturduğunuz bilgiler",b:[
          "Uygulama, özelliklerini sunabilmek için aşağıdaki bilgileri işleyebilir:",
          ["<strong>QR tarama sonuçları:</strong> Taradığınız URL'ler, Wi-Fi ayrıntıları, metin, telefon numaraları, e-posta bağlantıları, Güvenli QR yükleri veya PDF QR yükleri.","<strong>Oluşturduğunuz QR içeriği:</strong> Girdiğiniz URL'ler, Wi-Fi ayrıntıları, kişiler, metin, e-postalar, etkinlik ayrıntıları, sosyal kullanıcı adları, Güvenli QR içeriği ve diğer QR yük verileri.","<strong>Belgeler ve PDF'ler:</strong> Görüntüler, içe aktarılan dosyalar, taranmış belge sayfaları, düzenlenen PDF dosyaları, açıklamalar, damgalar, imzalar, filigranlar, şifreler, OCR metni ve dışa aktarılan dosyalar.","<strong>Geçmiş, klasörler ve taslaklar:</strong> Kaydedilen tarama öğeleri, oluşturulan QR öğeleri, PDF düzenleme taslakları, belge tarama taslakları, favori işaretleri, klasörler ve kullanım organizasyon verileri.","<strong>Geri bildirim:</strong> E-posta yoluyla geri bildirim gönderirseniz e-posta adresinizi, mesajınızı, cihaz tarafından sağlanan e-posta meta verilerini ve eklemeyi seçtiğiniz bilgileri alabiliriz."],
          "Bu bilgiler genellikle cihazınızda yerel olarak depolanır. Sürüm 1'de ScanSpace için bir bulut senkronizasyon hizmeti işletmiyoruz; gelecekteki bir özellik aksi belirtmedikçe bu geçerlidir."
        ]},
        {h:"3. İzinler",b:[
          "Kullandığınız özelliklere bağlı olarak Uygulama şunlara erişim isteyebilir:",
          ["<strong>Kamera:</strong> QR kodlarını taramak ve belge sayfalarını yakalamak için.","<strong>Fotoğraflar veya medya kütüphanesi:</strong> QR analizi veya belge/PDF oluşturma için resim içe aktarmak amacıyla.","<strong>Dosyalar ve belge seçici:</strong> PDF'leri ve ilgili dosyaları içe aktarmak, düzenlemek, dışa aktarmak veya paylaşmak için.","<strong>Bildirimler:</strong> Etkinleştirildiğinde uygulama mesajlarını, kampanya uyarılarını veya ürün güncellemelerini almak için."],
          "Bu izinleri cihaz ayarlarınızdan yönetebilirsiniz."
        ]},
        {h:"4. Analitik, Tanılama ve Bildirimler",b:[
          "ScanSpace güvenilirliği ve ürün kalitesini iyileştirmek için Firebase hizmetlerini kullanabilir:",
          ["<strong>Firebase Analytics:</strong> Özellik kullanımı ve uygulama etkileşimleri gibi üst düzey uygulama kullanımını anlamamıza yardımcı olur.","<strong>Firebase Crashlytics:</strong> Çökmeleri, hataları, cihaz durumunu, uygulama sürümünü, işletim sistemi sürümünü ve arızalarla ilgili teknik günlükleri tanılamamıza yardımcı olur.","<strong>Firebase Cloud Messaging:</strong> Bildirimler etkinleştirildiğinde bildirim veya uzak kampanyalar sunmak için bir cihaz push belirtecini işleyebilir.","<strong>Firebase Remote Config:</strong> Uygulama mesajlarını, kampanyaları, ödeme duvarı içeriğini veya özellik bayraklarını kontrol etmek için kullanılabilir."],
          "Bu hizmetler cihaz tanımlayıcılarını, uygulama örneği tanımlayıcılarını, tanılama verilerini, kullanım verilerini ve teknik meta verileri işleyebilir. Taranan PDF'lerinizi, oluşturulan QR içeriğinizi, tarama geçmişinizi veya yerel taslaklarınızı yüklememizi gerektirmezler."
        ]},
        {h:"5. Satın Almalar ve Abonelikler",b:[
          "ScanSpace ücretsiz özellikler, Pro özellikler, abonelikler, ücretsiz denemeler, ömür boyu satın almalar veya geçici kilit açmalar sunabilir. Ödemeler Apple App Store veya Google Play tarafından işlenir. Tam kredi kartı numaranızı almıyor veya saklamıyoruz.",
          "Uygulamanın Pro özelliklerin kilidini açabilmesi için Apple, Google veya uygulama içi satın alma SDK'larından satın alma durumu bilgilerini, ürün tanımlayıcılarını, yetkilendirme durumunu, işlem tanımlayıcılarını veya abonelik durumunu alabiliriz."
        ]},
        {h:"6. Paylaşma ve Dışa Aktarma",b:[
          "Paylaş, Bağlantı aç, Kopyala, PDF dışa aktar, DOCX dışa aktar, Dosyalara kaydet veya geri bildirim gönder gibi eylemleri kullandığınızda bilgiler; e-posta uygulamaları, bulut depolama, tarayıcılar, mesajlaşma uygulamaları veya dosya sağlayıcıları gibi sizin seçtiğiniz üçüncü taraf uygulamalara veya hizmetlere gönderilebilir. Bunların veri işleme yöntemi kendi gizlilik politikalarıyla yönetilir."
        ]},
        {h:"7. Güvenli QR ve PDF Parolaları",b:[
          "Güvenli QR özellikleri, QR içeriğini yerel şifrelemeyle korumaya yöneliktir. PDF parola özellikleri PDF dosyalarını korumaya yöneliktir. Parolaları hatırlamak sizin sorumluluğunuzdadır. Yerel Güvenli QR veya korumalı PDF dosyaları için parola kurtarma hizmeti işletmiyoruz."
        ]},
        {h:"8. Veri Saklama ve Silme",b:[
          "Yerel uygulama verileri, siz silene, ilgili geçmişi veya taslakları temizleyene, dosyaları kaldırana veya Uygulamayı kaldırana kadar cihazınızda kalır. Uygulama analitik ve tanılama verileri, Firebase veya ilgili hizmet sağlayıcıları tarafından saklama ayarları ve politikalarına göre tutulabilir.",
          "E-posta yoluyla bizimle iletişime geçerseniz, destek, ürün iyileştirme ve kötüye kullanımı önleme amacıyla bu konuşmayı saklayabiliriz."
        ]},
        {h:"9. Çocuklar",b:[
          "ScanSpace 13 yaşın altındaki çocuklara yönelik değildir. 13 yaşın altındaki çocuklardan bilerek kişisel bilgi toplamıyoruz. Bir çocuğun kişisel bilgi sağladığını düşünüyorsanız, gerekli önlemleri alabilmemiz için lütfen bizimle iletişime geçin."
        ]},
        {h:"10. Uluslararası Kullanıcılar",b:[
          "ScanSpace küresel olarak kullanılabilir. Firebase, Apple, Google, e-posta sağlayıcıları ve analitik veya tanılama sistemleri gibi hizmet sağlayıcılar, yaşadığınız ülkeden farklı ülkelerde bilgi işleyebilir. Veri minimizasyonu yaklaşımını benimsiyoruz ve yerel tarama içeriğinizi, PDF'lerinizi veya taslaklarınızı paylaşmayı veya dışa aktarmayı seçmediğiniz sürece yüklemekten kaçınıyoruz."
        ]},
        {h:"11. Bu Politikadaki Değişiklikler",b:[
          'Bu Gizlilik Politikasını zaman zaman güncelleyebiliriz. Önemli değişiklikler yapıldığında "Son güncelleme" tarihini güncelleyecek ve uygun durumlarda Uygulamada ek bildirim sağlayabiliriz.'
        ]},
        {h:"12. İletişim",b:["Bu Gizlilik Politikası hakkında sorularınız, talepleriniz veya geri bildiriminiz varsa {{email}} adresinden bizimle iletişime geçin."]}
      ],
      ar: [
        {h:"1. نظرة عامة",b:[
          "توضح سياسة الخصوصية هذه كيفية تعامل ScanSpace مع المعلومات عند استخدامك للتطبيق. ScanSpace تطبيق أداة مساعدة للجوال لمسح رموز QR وإنشائها ومسح المستندات وتحرير ملفات PDF وتنظيم السجل واستخدام أدوات PDF ذات الصلة.",
          "صُمِّم ScanSpace ليعمل محليًا أولًا. تبقى عمليات المسح ومحتوى QR المُنشأ وملفات PDF والمسودات والمجلدات والسجل على جهازك ما لم تختر مشاركتها أو تصديرها أو فتحها أو إرسالها باستخدام خدمة أخرى."
        ]},
        {h:"2. المعلومات التي تقدمها أو تنشئها",b:[
          "قد يعالج التطبيق المعلومات التالية لتقديم ميزاته:",
          ["<strong>نتائج مسح QR:</strong> عناوين URL وبيانات Wi-Fi والنصوص وأرقام الهواتف وروابط البريد الإلكتروني وحمولات QR الآمن أو حمولات PDF QR التي تمسحها.","<strong>محتوى QR الذي تنشئه:</strong> عناوين URL وبيانات Wi-Fi وجهات الاتصال والنصوص والبريد الإلكتروني وتفاصيل الأحداث وأسماء المستخدمين على وسائل التواصل الاجتماعي ومحتوى QR الآمن وبيانات حمولة QR الأخرى التي تدخلها.","<strong>المستندات وملفات PDF:</strong> الصور والملفات المستوردة وصفحات المستندات الممسوحة وملفات PDF المحررة والتعليقات التوضيحية والختوم والتوقيعات والعلامات المائية وكلمات المرور ونص التعرف الضوئي على الحروف والملفات المُصدَّرة.","<strong>السجل والمجلدات والمسودات:</strong> عناصر المسح المحفوظة وعناصر QR المُنشأة ومسودات تحرير PDF ومسودات مسح المستندات وعلامات المفضلة والمجلدات وبيانات تنظيم الاستخدام.","<strong>التعليقات:</strong> إذا أرسلت تعليقات بالبريد الإلكتروني، فقد نتلقى عنوان بريدك الإلكتروني ورسالتك والبيانات الوصفية للبريد الإلكتروني من الجهاز وأي معلومات تختار تضمينها."],
          "تُخزَّن هذه المعلومات عمومًا محليًا على جهازك. لا نقدم خدمة مزامنة سحابية لـ ScanSpace في الإصدار الأول، ما لم تنص ميزة مستقبلية على خلاف ذلك."
        ]},
        {h:"3. الأذونات",b:[
          "بناءً على الميزات التي تستخدمها، قد يطلب التطبيق الوصول إلى:",
          ["<strong>الكاميرا:</strong> لمسح رموز QR والتقاط صفحات المستندات.","<strong>الصور أو مكتبة الوسائط:</strong> لاستيراد الصور لتحليل QR أو إنشاء المستندات/PDF.","<strong>الملفات ومحدد المستندات:</strong> لاستيراد ملفات PDF والملفات ذات الصلة وتحريرها وتصديرها أو مشاركتها.","<strong>الإشعارات:</strong> لتلقي رسائل التطبيق وتنبيهات الحملات أو تحديثات المنتج إذا كانت مفعّلة."],
          "يمكنك إدارة هذه الأذونات في إعدادات جهازك."
        ]},
        {h:"4. التحليلات والتشخيص والإشعارات",b:[
          "قد يستخدم ScanSpace خدمات Firebase لتحسين الموثوقية وجودة المنتج:",
          ["<strong>Firebase Analytics:</strong> يساعدنا على فهم استخدام التطبيق على مستوى عالٍ، مثل استخدام الميزات والتفاعلات.","<strong>Firebase Crashlytics:</strong> يساعدنا على تشخيص الأعطال والأخطاء وحالة الجهاز وإصدار التطبيق وإصدار نظام التشغيل والسجلات التقنية المتعلقة بالإخفاقات.","<strong>Firebase Cloud Messaging:</strong> قد يعالج رمزًا مميزًا لإشعارات الدفع لتسليم الإشعارات أو الحملات البعيدة عند تفعيل الإشعارات.","<strong>Firebase Remote Config:</strong> قد يُستخدم للتحكم في رسائل التطبيق والحملات ونصوص جدار الدفع أو أعلام الميزات."],
          "قد تعالج هذه الخدمات معرّفات الأجهزة ومعرّفات مثيلات التطبيق والبيانات التشخيصية وبيانات الاستخدام والبيانات الوصفية التقنية. لا تشترط منا تحميل ملفات PDF الممسوحة أو محتوى QR المُنشأ أو سجل المسح أو المسودات المحلية."
        ]},
        {h:"5. المشتريات والاشتراكات",b:[
          "قد يقدم ScanSpace ميزات مجانية وميزات Pro واشتراكات وتجارب مجانية وعمليات شراء مدى الحياة أو عمليات فتح مؤقتة. تُعالَج المدفوعات عبر Apple App Store أو Google Play. لا نتلقى رقم بطاقة ائتمانك الكاملة ولا نخزّنه.",
          "قد نتلقى معلومات حالة الشراء ومعرّفات المنتجات وحالة الاستحقاق ومعرّفات المعاملات أو حالة الاشتراك من Apple أو Google أو حزم SDK للشراء داخل التطبيق حتى يتمكن التطبيق من فتح ميزات Pro."
        ]},
        {h:"6. المشاركة والتصدير",b:[
          "عند استخدام إجراءات مثل مشاركة أو فتح رابط أو نسخ أو تصدير PDF أو تصدير DOCX أو الحفظ في الملفات أو إرسال التعليقات، قد تُرسَل المعلومات إلى تطبيقات أو خدمات طرف ثالث تختارها أنت، مثل تطبيقات البريد الإلكتروني أو التخزين السحابي أو المتصفحات أو تطبيقات المراسلة أو موفري الملفات. تخضع معالجتهم للبيانات لسياسات الخصوصية الخاصة بهم."
        ]},
        {h:"7. QR الآمن وكلمات مرور PDF",b:[
          "تهدف ميزات QR الآمن إلى حماية محتوى QR بالتشفير المحلي. تهدف ميزات كلمة مرور PDF إلى حماية ملفات PDF. أنت مسؤول عن تذكر كلمات المرور. لا نقدم خدمة استرداد كلمات المرور لملفات QR الآمن المحلية أو ملفات PDF المحمية."
        ]},
        {h:"8. الاحتفاظ بالبيانات وحذفها",b:[
          "تبقى بيانات التطبيق المحلية على جهازك حتى تحذفها أو تمسح السجل أو المسودات ذات الصلة أو تزيل الملفات أو تزيل التطبيق. قد يتم الاحتفاظ بالبيانات التحليلية والتشخيصية من قِبل Firebase أو موفري الخدمات ذوي الصلة وفقًا لإعدادات الاحتفاظ وسياساتهم.",
          "إذا تواصلت معنا عبر البريد الإلكتروني، فقد نحتفظ بتلك المحادثة لأغراض الدعم وتحسين المنتج ومنع إساءة الاستخدام."
        ]},
        {h:"9. الأطفال",b:[
          "لا يستهدف ScanSpace الأطفال دون سن 13 عامًا. لا نجمع معلومات شخصية من الأطفال دون سن 13 عامًا عن علم. إذا كنت تعتقد أن طفلًا قدّم معلومات شخصية، يُرجى التواصل معنا حتى نتمكن من اتخاذ الإجراء المناسب."
        ]},
        {h:"10. المستخدمون الدوليون",b:[
          "يمكن استخدام ScanSpace على مستوى العالم. قد يعالج موفرو الخدمات مثل Firebase وApple وGoogle وموفري البريد الإلكتروني وأنظمة التحليلات أو التشخيص معلومات في دول غير دولة إقامتك. نتبع نهجًا لتقليل البيانات ونتجنب تحميل محتوى مسحك المحلي أو ملفات PDF أو المسودات ما لم تختر مشاركتها أو تصديرها."
        ]},
        {h:"11. التغييرات على هذه السياسة",b:[
          'قد نحدّث سياسة الخصوصية هذه من وقت لآخر. إذا أجرينا تغييرات جوهرية، سنحدّث تاريخ "آخر تحديث" وقد نقدم إشعارًا إضافيًا في التطبيق حيثما كان ذلك مناسبًا.'
        ]},
        {h:"12. التواصل",b:["إذا كانت لديك أسئلة أو طلبات أو تعليقات حول سياسة الخصوصية هذه، تواصل معنا على {{email}}."]}
      ],
      hi: [
        {h:"1. अवलोकन",b:[
          "यह गोपनीयता नीति बताती है कि जब आप App का उपयोग करते हैं तो ScanSpace जानकारी को कैसे संभालता है। ScanSpace QR कोड स्कैन करने, QR कोड बनाने, दस्तावेज़ स्कैन करने, PDF एडिट करने, हिस्ट्री ऑर्गनाइज़ करने और संबंधित PDF टूल्स उपयोग करने के लिए एक मोबाइल यूटिलिटी App है।",
          "ScanSpace को local-first डिज़ाइन किया गया है। स्कैन, जनरेट किया गया QR कंटेंट, PDF, ड्राफ्ट, फ़ोल्डर और हिस्ट्री आपके डिवाइस पर स्टोर रहते हैं, जब तक कि आप किसी अन्य सेवा के माध्यम से उन्हें शेयर, एक्सपोर्ट, खोलने या भेजने का चुनाव न करें।"
        ]},
        {h:"2. आपके द्वारा प्रदान या बनाई गई जानकारी",b:[
          "App अपनी सुविधाएं प्रदान करने के लिए निम्नलिखित जानकारी प्रोसेस कर सकता है:",

      id: [
        {h:"1. Ikhtisar",b:[
          "Kebijakan Privasi ini menjelaskan bagaimana ScanSpace menangani informasi saat Anda menggunakan App. ScanSpace adalah app utilitas seluler untuk memindai kode QR, membuat kode QR, memindai dokumen, mengedit PDF, mengorganisasi riwayat, dan menggunakan alat PDF terkait.",
          "ScanSpace dirancang untuk menjadi lokal-utama. Pemindaian, konten QR yang dihasilkan, PDF, draf, folder, dan riwayat disimpan di perangkat Anda kecuali Anda memilih untuk membagikan, mengekspor, membuka, atau mengirimnya menggunakan layanan lain."
        ]},
        {h:"2. Informasi yang Anda berikan atau buat",b:[
          "App dapat memproses informasi berikut agar dapat menyediakan fitur-fiturnya:",
          ["<strong>Hasil pemindaian QR:</strong> URL, detail Wi-Fi, teks, nomor telepon, tautan email, muatan Secure QR, atau muatan QR PDF yang Anda pindai.","<strong>Konten QR yang Anda buat:</strong> URL, detail Wi-Fi, kontak, teks, email, detail acara, nama pengguna sosial, konten Secure QR, dan data muatan QR lainnya yang Anda masukkan.","<strong>Dokumen dan PDF:</strong> gambar, file yang diimpor, halaman dokumen yang dipindai, file PDF yang diedit, anotasi, stempel, tanda tangan, tanda air, kata sandi, teks OCR, dan file yang diekspor.","<strong>Riwayat, folder, dan draf:</strong> item pindaian yang disimpan, item QR yang dibuat, draf pengeditan PDF, draf pemindaian dokumen, penanda favorit, folder, dan data organisasi penggunaan.","<strong>Umpan balik:</strong> jika Anda mengirimkan umpan balik melalui email, kami mungkin menerima alamat email, pesan, metadata email yang diberikan perangkat, dan informasi apa pun yang Anda pilih untuk disertakan."],
          "Informasi ini umumnya disimpan secara lokal di perangkat Anda. Kami tidak mengoperasikan layanan sinkronisasi cloud untuk ScanSpace di versi 1 kecuali fitur mendatang menyatakan sebaliknya secara eksplisit."
        ]},
        {h:"3. Izin",b:[
          "Tergantung pada fitur yang Anda gunakan, App mungkin meminta akses ke:",
          ["<strong>Kamera:</strong> untuk memindai kode QR dan mengambil halaman dokumen.","<strong>Foto atau perpustakaan media:</strong> untuk mengimpor gambar untuk analisis QR atau pembuatan dokumen/PDF.","<strong>File dan pemilih dokumen:</strong> untuk mengimpor, mengedit, mengekspor, atau berbagi PDF dan file terkait.","<strong>Notifikasi:</strong> untuk menerima pesan app, peringatan kampanye, atau pembaruan produk jika diaktifkan."],
          "Anda dapat mengelola izin ini di pengaturan perangkat Anda."
        ]},
        {h:"4. Analitik, Diagnostik, dan Notifikasi",b:[
          "ScanSpace mungkin menggunakan layanan Firebase untuk meningkatkan keandalan dan kualitas produk:",
          ["<strong>Firebase Analytics:</strong> membantu kami memahami penggunaan app tingkat tinggi, seperti penggunaan fitur dan interaksi app.","<strong>Firebase Crashlytics:</strong> membantu kami mendiagnosis crash, error, status perangkat, versi app, versi sistem operasi, dan log teknis terkait kegagalan.","<strong>Firebase Cloud Messaging:</strong> dapat memproses token push perangkat untuk mengirimkan notifikasi atau kampanye jarak jauh saat notifikasi diaktifkan.","<strong>Firebase Remote Config:</strong> dapat digunakan untuk mengontrol pesan app, kampanye, salinan paywall, atau flag fitur."],
          "Layanan-layanan ini dapat memproses pengidentifikasi perangkat, pengidentifikasi instans app, diagnostik, data penggunaan, dan metadata teknis. Layanan ini tidak mengharuskan kami mengunggah PDF yang Anda pindai, konten QR yang dibuat, riwayat pemindaian, atau draf lokal."
        ]},
        {h:"5. Pembelian dan Langganan",b:[
          "ScanSpace mungkin menawarkan fitur gratis, fitur Pro, langganan, uji coba gratis, pembelian seumur hidup, atau pembukaan kunci sementara. Pembayaran diproses oleh Apple App Store atau Google Play. Kami tidak menerima atau menyimpan nomor kartu kredit lengkap Anda.",
          "Kami mungkin menerima informasi status pembelian, pengidentifikasi produk, status hak, pengidentifikasi transaksi, atau status langganan dari Apple, Google, atau SDK pembelian dalam app agar App dapat membuka kunci fitur Pro."
        ]},
        {h:"6. Berbagi dan Mengekspor",b:[
          "Saat Anda menggunakan tindakan seperti Bagikan, Buka tautan, Salin, Ekspor PDF, Ekspor DOCX, Simpan ke File, atau kirim umpan balik, informasi dapat dikirim ke app atau layanan pihak ketiga yang Anda pilih, seperti app email, penyimpanan cloud, browser, app pesan, atau penyedia file. Penanganan data mereka diatur oleh kebijakan privasi mereka sendiri."
        ]},
        {h:"7. Secure QR dan Kata Sandi PDF",b:[
          "Fitur Secure QR dimaksudkan untuk melindungi konten QR dengan enkripsi lokal. Fitur kata sandi PDF dimaksudkan untuk melindungi file PDF. Anda bertanggung jawab untuk mengingat kata sandi. Kami tidak mengoperasikan layanan pemulihan kata sandi untuk Secure QR lokal atau file PDF yang dilindungi."
        ]},
        {h:"8. Retensi dan Penghapusan Data",b:[
          "Data app lokal tetap di perangkat Anda sampai Anda menghapusnya, menghapus riwayat atau draf yang relevan, menghapus file, atau menghapus instalan App. Data analitik dan diagnostik app dapat disimpan oleh Firebase atau penyedia layanan terkait sesuai pengaturan dan kebijakan retensi mereka.",
          "Jika Anda menghubungi kami melalui email, kami mungkin menyimpan percakapan tersebut untuk dukungan, peningkatan produk, dan pencegahan penyalahgunaan."
        ]},
        {h:"9. Anak-anak",b:[
          "ScanSpace tidak ditujukan untuk anak-anak di bawah 13 tahun. Kami tidak dengan sengaja mengumpulkan informasi pribadi dari anak-anak di bawah 13 tahun. Jika Anda yakin seorang anak telah memberikan informasi pribadi, harap hubungi kami agar kami dapat mengambil tindakan yang tepat."
        ]},
        {h:"10. Pengguna Internasional",b:[
          "ScanSpace dapat digunakan secara global. Penyedia layanan seperti Firebase, Apple, Google, penyedia email, dan sistem analitik atau diagnostik dapat memproses informasi di negara lain selain tempat tinggal Anda. Kami menggunakan pendekatan minimisasi data dan menghindari mengunggah konten pemindaian lokal, PDF, atau draf Anda kecuali Anda memilih untuk membagikan atau mengekspornya."
        ]},
        {h:"11. Perubahan pada Kebijakan Ini",b:[
          'Kami mungkin memperbarui Kebijakan Privasi ini dari waktu ke waktu. Jika kami membuat perubahan material, kami akan memperbarui tanggal "Terakhir diperbarui" dan dapat memberikan pemberitahuan tambahan di App jika diperlukan.'
        ]},
        {h:"12. Kontak",b:["Jika Anda memiliki pertanyaan, permintaan, atau umpan balik tentang Kebijakan Privasi ini, hubungi kami di {{email}}."]}

      vi: [

          "Thông tin này thường được lưu trữ cục bộ trên thiết bị của bạn. Chúng tôi không vận hành dịch vụ đồng bộ đám mây cho ScanSpace ở phiên bản 1 trừ khi tính năng tương lai nêu rõ khác."

          "Bạn có thể quản lý các quyền này trong cài đặt thiết bị."

          ["<strong>Firebase Analytics:</strong> giúp chúng tôi hiểu việc sử dụng App ở cấp độ cao, chẳng hạn như sử dụng tính năng và tương tác App.","<strong>Firebase Crashlytics:</strong> giúp chúng tôi chẩn đoán sự cố, lỗi, trạng thái thiết bị, phiên bản App, phiên bản hệ điều hành và nhật ký kỹ thuật liên quan đến lỗi.","<strong>Firebase Cloud Messaging:</strong> có thể xử lý mã push của thiết bị để gửi thông báo hoặc chiến dịch từ xa khi thông báo được bật.","<strong>Firebase Remote Config:</strong> có thể được sử dụng để kiểm soát tin nhắn App, chiến dịch, nội dung paywall hoặc cờ tính năng."],

      zh: [

    function renderSections(code) {
      const s = sections[code] || sections.en;
      const EMAIL = '<a href="mailto:khanhquang29000@gmail.com">khanhquang29000@gmail.com</a>';
      document.getElementById("sc").innerHTML = s.map(sec =>
        `<section><h2>${sec.h}</h2>${sec.b.map(n =>
          Array.isArray(n)
            ? `<ul>${n.map(i => `<li>${i}</li>`).join("")}</ul>`
            : `<p>${n.replace("{{email}}", EMAIL)}</p>`
        ).join("")}</section>`
      ).join("");
    }

    const select = document.getElementById("languageSelect");
    const browserLanguage = (navigator.language || "en").slice(0, 2).toLowerCase();
    const initialLanguage = copy[browserLanguage] ? browserLanguage : "en";

    for (const [code, label] of languages) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = label;
      select.appendChild(option);
    }

    function renderLanguage(code) {
      const item = copy[code] || copy.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("languageTitle").textContent = item.title;
      document.getElementById("languageSubtitle").textContent = item.subtitle;
      document.getElementById("localizedSummary").textContent = item.summary;
      document.getElementById("legalNote").textContent = item.note;
      select.value = code;
      renderSections(code);
    }

    select.addEventListener("change", (event) => renderLanguage(event.target.value));
    renderLanguage(initialLanguage);
  </script>
