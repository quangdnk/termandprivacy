      letter-spacing: 0.08em;

    }

    h2 {

      font-size: 22px;
      line-height: 1.25;
    }

    p, li {
      color: var(--muted);
      font-size: 16px;
    }

    strong { color: var(--text); }

    a {
      color: #f9a8c0;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    section {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(21, 19, 21, 0.72);
    }

    .language-card {
      background: linear-gradient(145deg, rgba(255, 184, 77, 0.12), rgba(21, 19, 21, 0.72));
    }

    .medical-card {
      border-color: rgba(232, 84, 122, 0.35);
      background: linear-gradient(145deg, rgba(232, 84, 122, 0.1), rgba(21, 19, 21, 0.72));
    }

    .language-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    select {
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--elevated);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
    }

    .localized-summary {
      margin: 16px 0 0;
      color: var(--text);
    }

    .legal-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    ul { padding-left: 22px; }

    .meta {
      margin: 0;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .pill {
      padding: 8px 12px;

      background: rgba(255, 255, 255, 0.05);

      font-weight: 700;
    }

    footer {

      {h:"9. Dịch vụ bên thứ ba",b:["Ứng dụng tương tác với Apple App Store hoặc Google Play cho mua hàng và subscription. Nếu bạn xuất và chia sẻ dữ liệu, ứng dụng hoặc dịch vụ tệp bên thứ ba bạn chọn sẽ xử lý dữ liệu đó theo điều khoản và chính sách riêng của họ.","App Lock dùng API sinh trắc học của hệ điều hành thiết bị. Dữ liệu sinh trắc học không được chia sẻ với chúng tôi hoặc bên thứ ba."]},
      {h:"10. Cập nhật và thay đổi",b:["Chúng tôi có thể cập nhật Ứng dụng, thêm hoặc xóa tính năng, sửa lỗi, thay đổi giá hoặc cập nhật các Terms này. Nếu có thay đổi quan trọng, chúng tôi sẽ cập nhật ngày \"Last updated\" và có thể thông báo thêm khi phù hợp."]},
      {h:"11. Không bảo đảm",b:["Ứng dụng được cung cấp theo hiện trạng và tùy tình trạng sẵn có. Trong phạm vi tối đa pháp luật cho phép, chúng tôi từ chối bảo đảm về khả năng thương mại, phù hợp cho mục đích cụ thể, không vi phạm, khả dụng, độ chính xác của ước tính và hoạt động không lỗi."]},
      {h:"12. Giới hạn trách nhiệm",b:["Trong phạm vi tối đa pháp luật cho phép, chúng tôi không chịu trách nhiệm cho thiệt hại gián tiếp, ngẫu nhiên, đặc biệt, hệ quả, điển hình hoặc trừng phạt, hoặc mất dữ liệu, dự đoán chu kỳ không chính xác, quyết định liên quan sức khỏe dựa trên ước tính của Ứng dụng, lỡ ngày kỳ kinh hoặc phụ thuộc vào dữ liệu chu kỳ được tạo."]},
      {h:"13. Điều khoản Apple và Google",b:["Nếu bạn tải Ứng dụng từ Apple App Store hoặc Google Play, việc sử dụng Ứng dụng cũng chịu điều khoản chợ ứng dụng, quy định subscription, thanh toán, hoàn tiền và chính sách nền tảng tương ứng."]},
      {h:"14. Liên hệ",b:["Nếu bạn có câu hỏi về các Terms này, liên hệ với chúng tôi tại {{email}}."]}
    ];

    sections.ja = [
      {h:"1. 同意",b:["この Terms of Service（\"Terms\"）は、CycleLog（\"CycleLog\"、\"アプリ\"、\"当社\"）へのアクセスおよび利用を規定します。アプリをダウンロード、アクセス、または使用することで、この Terms に同意したものとみなされます。同意しない場合はアプリを使用しないでください。"]},
      {h:"2. アプリの機能",b:["CycleLog は、月経周期の追跡、健康シグナルの記録、周期推定の表示、個人健康データを端末内で管理するためのプライベートなモバイルアプリです。","一部機能は無料で利用できます。一部機能には Pro サブスクリプション、無料トライアル、またはアプリ内に表示される他の権限が必要な場合があります。"]},
      {h:"3. 医療助言ではありません",b:["<strong>CycleLog は医療機器、医療サービス、医療提供者ではありません。</strong>","周期予測、生理推定、排卵推定、妊娠可能期間推定、その他アプリが生成する出力は、あなたが提供したデータに基づく統計的推定です。医学的診断、臨床評価、医療助言ではありません。","<strong>CycleLog は避妊方法ではありません。</strong> 避妊、妊娠、生殖健康に関する判断にアプリの予測を使用する場合は、必ず資格のある医療提供者に相談してください。","月経健康、生殖健康、その他の健康上の懸念に関する助言、診断、治療については、必ず資格のある医療提供者に相談してください。"]},
      {h:"4. あなたのコンテンツと責任",b:["あなたがアプリに記録または入力する周期データ、健康シグナル、メモ、日付、その他の情報について責任を負います。","適用法令または他者の権利に違反する方法でアプリを使用しないことに同意します。"]},
      {h:"5. ローカルデータとデータ損失",b:["CycleLog は周期データを端末上にローカル保存するよう設計されています。重要なデータは Export 機能でバックアップを保持する責任があります。","記録の削除、アプリデータの消去、アプリのアンインストール、機種変更、OS によるアプリデータ削除によりローカルデータが失われることがあります。当社はローカル保存データの損失について責任を負いません。"]},
      {h:"6. 推定の正確性",b:["当社は、記録データに基づく周期長、生理日、排卵、妊娠可能期間の推定をできるだけ正確にするよう努めます。ただし個人の周期は異なり、いかなる推定も保証されません。","予測精度は、記録された履歴データ量、周期の規則性、その他個人要因に依存します。重要な判断に使う前に推定を確認し、医療上の助言は医療提供者に相談してください。"]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode は、画面上の周期データを素早く隠すための機能です。これは画面上のプライバシーを守るための便利機能であり、データを削除せず、ロック解除済み端末へ物理的にアクセスできる人がデータを復元できないことを保証しません。","端末全体とそこに保存されたデータのセキュリティについてはユーザーが責任を負います。"]},
      {h:"8. サブスクリプション、トライアル、購入",b:["CycleLog は月額、年額、トライアル、プロモーションのサブスクリプションを提供する場合があります。価格、トライアル期間、機能、提供状況は国、プラットフォーム、時期により異なります。",["サブスクリプションは Apple App Store または Google Play の規則に従ってキャンセルしない限り自動更新されます。","無料トライアルは終了前にキャンセルしない場合、有料サブスクリプションへ移行することがあります。","サブスクリプションの管理またはキャンセルは Apple App Store または Google Play のアカウント設定で行えます。","返金は Apple、Google、または該当するアプリマーケットプレイスのポリシーに従って処理されます。"],"無料および有料機能の提供状況を変更することがありますが、合理的な代替またはプラットフォームでサポートされる対応なしに有効な有料権限を意図的に削除しません。"]},
      {h:"9. 第三者サービス",b:["アプリは購入とサブスクリプションのため Apple App Store または Google Play と連携します。データをエクスポートして共有する場合、選択した第三者アプリまたはファイルサービスが独自の規約とプライバシーポリシーに基づきそのデータを処理します。","App Lock は端末 OS の生体認証 API を使用します。生体データは当社または第三者と共有されません。"]},
      {h:"10. 更新と変更",b:["当社はアプリの更新、機能追加または削除、バグ修正、価格変更、またはこの Terms の更新を行うことがあります。重要な変更がある場合、\"Last updated\" 日付を更新し、必要に応じて追加通知を行うことがあります。"]},
      {h:"11. 保証なし",b:["アプリは現状有姿かつ提供可能な範囲で提供されます。法律で許される最大限の範囲で、商品性、特定目的適合性、非侵害、可用性、推定の正確性、エラーのない動作に関する保証を否認します。"]},
      {h:"12. 責任制限",b:["法律で許される最大限の範囲で、当社は間接的、偶発的、特別、結果的、例示的、懲罰的損害、データ損失、不正確な周期予測、アプリ推定に基づく健康関連判断、生理日の見落とし、生成された周期データへの依存について責任を負いません。"]},
      {h:"13. Apple と Google の規約",b:["Apple App Store または Google Play からアプリをダウンロードした場合、利用には該当マーケットプレイスの規約、サブスクリプション規則、支払い規則、返金規則、プラットフォームポリシーも適用されます。"]},
      {h:"14. 連絡先",b:["この Terms について質問がある場合は {{email}} までご連絡ください。"]}

    sections.ko = [
      {h:"1. 동의",b:["본 Terms of Service(\"Terms\")는 CycleLog(\"CycleLog\", \"앱\", \"당사\")에 대한 접근 및 사용을 규정합니다. 앱을 다운로드, 접근 또는 사용하면 본 Terms에 동의하는 것입니다. 동의하지 않는 경우 앱을 사용하지 마세요."]},
      {h:"2. 앱의 기능",b:["CycleLog는 생리 주기를 추적하고, 건강 신호를 기록하며, 주기 추정치를 보고, 개인 건강 데이터를 기기에 로컬로 관리하는 비공개 모바일 앱입니다.","일부 기능은 무료일 수 있습니다. 일부 기능은 Pro 구독, 무료 체험 또는 앱에 표시되는 다른 권한이 필요할 수 있습니다."]},
      {h:"3. 의료 조언 아님",b:["<strong>CycleLog는 의료기기, 의료 서비스 또는 의료 제공자가 아닙니다.</strong>","주기 예측, 생리 추정, 배란 추정, 가임 기간 추정 및 앱이 생성하는 모든 출력은 사용자가 제공한 데이터에 기반한 통계적 추정입니다. 의학적 진단, 임상 평가 또는 의료 조언이 아닙니다.","<strong>CycleLog는 피임 방법이 아닙니다.</strong> 자격 있는 의료 제공자와 상담하지 않고 앱 예측을 피임, 임신 또는 생식 건강 결정에 사용하지 마세요.","월경 건강, 생식 건강 또는 기타 건강 문제에 대한 조언, 진단 또는 치료는 항상 자격 있는 의료 제공자와 상담하세요."]},
      {h:"4. 사용자 콘텐츠와 책임",b:["앱에 기록하거나 입력하는 주기 데이터, 건강 신호, 메모, 날짜 및 기타 정보에 대한 책임은 사용자에게 있습니다.","사용자는 관련 법률 또는 규정을 위반하거나 타인의 권리를 침해하는 방식으로 앱을 사용하지 않기로 동의합니다."]},
      {h:"5. 로컬 데이터 및 데이터 손실",b:["CycleLog는 주기 데이터를 기기에 로컬 저장하도록 설계되었습니다. 중요한 데이터는 앱의 Export 기능을 사용해 백업 사본을 보관할 책임이 있습니다.","기록 삭제, 앱 데이터 삭제, 앱 제거, 기기 변경 또는 운영체제의 앱 데이터 제거로 로컬 데이터가 손실될 수 있습니다. 당사는 로컬 저장 데이터 손실에 책임지지 않습니다."]},
      {h:"6. 추정 정확도",b:["당사는 기록된 데이터를 기반으로 주기 길이 예측, 생리일 추정, 배란 추정 및 가임 기간 계산을 가능한 한 정확하게 만들기 위해 노력합니다. 그러나 개인의 주기는 다르며 어떤 추정도 보장될 수 없습니다.","예측 정확도는 기록된 과거 데이터의 양, 주기의 규칙성 및 기타 개인 요인에 따라 달라집니다. 중요한 결정에 사용하기 전에 추정치를 검토하고, 의료 안내는 의료 제공자와 상담하세요."]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode는 화면의 보이는 주기 데이터를 빠르게 숨기도록 설계되었습니다. 화면 개인정보 보호를 위한 편의 기능이며, 데이터를 삭제하지 않고 잠금 해제된 기기에 물리적으로 접근할 수 있는 사람이 데이터를 복구할 수 없음을 보장하지 않습니다.","기기와 그 안에 저장된 데이터의 전반적인 보안은 사용자 책임입니다."]},
      {h:"8. 구독, 체험 및 구매",b:["CycleLog는 월간, 연간, 체험 또는 프로모션 구독 옵션을 제공할 수 있습니다. 가격, 체험 기간, 기능 및 제공 여부는 국가, 플랫폼 및 시점에 따라 다를 수 있습니다.",["구독은 Apple App Store 또는 Google Play 규칙에 따라 취소하지 않는 한 자동 갱신됩니다.","무료 체험은 종료 전에 취소하지 않으면 유료 구독으로 전환될 수 있습니다.","구독은 Apple App Store 또는 Google Play 계정 설정에서 관리하거나 취소할 수 있습니다.","환불은 Apple, Google 또는 해당 앱 마켓플레이스의 정책에 따라 처리됩니다."],"당사는 무료 및 유료 기능 제공 여부를 변경할 수 있지만, 합리적인 대체 또는 플랫폼 지원 처리 없이 활성 유료 권한을 의도적으로 제거하지 않습니다."]},
      {h:"9. 제3자 서비스",b:["앱은 구매 및 구독을 위해 Apple App Store 또는 Google Play와 상호작용합니다. 데이터를 내보내고 공유하면 사용자가 선택한 제3자 앱 또는 파일 서비스가 자체 약관 및 개인정보처리방침에 따라 해당 데이터를 처리합니다.","App Lock은 기기 운영체제의 생체 인증 API를 사용합니다. 생체 데이터는 당사 또는 제3자와 공유되지 않습니다."]},
      {h:"10. 업데이트 및 변경",b:["당사는 앱 업데이트, 기능 추가 또는 제거, 버그 수정, 가격 변경 또는 본 Terms 업데이트를 할 수 있습니다. 중요한 변경이 있는 경우 \"Last updated\" 날짜를 업데이트하고 필요한 경우 추가 공지를 제공할 수 있습니다."]},
      {h:"11. 보증 없음",b:["앱은 있는 그대로 및 제공 가능한 상태로 제공됩니다. 법이 허용하는 최대 범위에서 당사는 상품성, 특정 목적 적합성, 비침해, 가용성, 추정 정확도 및 오류 없는 작동에 대한 보증을 부인합니다."]},
      {h:"12. 책임 제한",b:["법이 허용하는 최대 범위에서 당사는 간접, 우발, 특별, 결과, 예시적 또는 징벌적 손해, 데이터 손실, 부정확한 주기 예측, 앱 추정에 기반한 건강 관련 결정, 놓친 생리일 또는 생성된 주기 데이터에 대한 의존에 책임지지 않습니다."]},
      {h:"13. Apple 및 Google 약관",b:["Apple App Store 또는 Google Play에서 앱을 다운로드한 경우 앱 사용은 해당 마켓플레이스 약관, 구독 규칙, 결제 규칙, 환불 규칙 및 플랫폼 정책의 적용도 받습니다."]},
      {h:"14. 연락처",b:["본 Terms에 대한 질문은 {{email}} 로 문의하세요."]}
    ];

    sections.zh = [
      {h:"1. 协议",b:["本 Terms of Service（\"Terms\"）管理你对 CycleLog（\"CycleLog\"、\"本应用\"、\"我们\"）的访问和使用。下载、访问或使用本应用即表示你同意本 Terms。如果你不同意，请不要使用本应用。"]},
      {h:"2. 应用功能",b:["CycleLog 是一款私密移动应用，用于追踪月经周期、记录健康信号、查看周期估算，并在你的设备本地管理个人健康数据。","部分功能可能免费。部分功能可能需要 Pro 订阅、免费试用或应用中显示的其他权益。"]},
      {h:"3. 非医疗建议",b:["<strong>CycleLog 不是医疗设备、医疗服务或医疗提供者。</strong>","周期预测、经期估算、排卵估算、易孕窗口估算以及本应用生成的所有其他输出，都是基于你提供数据的统计估算。它们不是医学诊断、临床评估或医疗建议。","<strong>CycleLog 不是避孕方法。</strong> 未咨询合格医疗提供者前，请勿使用本应用预测来作出避孕、怀孕或生殖健康决定。","有关月经健康、生殖健康或任何其他健康问题的建议、诊断或治疗，请始终咨询合格医疗提供者。"]},
      {h:"4. 你的内容和责任",b:["你需要对在本应用中记录或输入的周期数据、健康信号、备注、日期和其他信息负责。","你同意不以违反适用法律法规或侵犯他人权利的方式使用本应用。"]},
      {h:"5. 本地数据和数据丢失",b:["CycleLog 设计为将周期数据本地存储在你的设备上。你有责任使用 Export 功能保留重要数据的备份。","如果你删除记录、清除应用数据、卸载应用、更换设备，或操作系统移除应用数据，本地数据可能丢失。我们不对本地存储数据的丢失负责。"]},
      {h:"6. 估算准确性",b:["我们努力根据你记录的数据尽可能准确地进行周期长度预测、经期日期估算、排卵估算和易孕窗口计算。然而个人周期会变化，任何估算都无法保证。","预测准确性取决于历史记录数据量、周期规律性和其他个人因素。请在作出重要决定前检查估算，并始终咨询医疗提供者获取医疗指导。"]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode 旨在快速隐藏屏幕上可见的周期数据。这是一项用于保护屏幕隐私的便利功能。它不会删除数据，也不保证拥有已解锁设备物理访问权限的人无法恢复数据。","你需要对设备及其存储数据的整体安全负责。"]},

      {h:"9. 第三方服务",b:["本应用会与 Apple App Store 或 Google Play 交互以处理购买和订阅。如果你导出并分享数据，你选择的第三方应用或文件服务将根据其自身条款和隐私政策处理该数据。","App Lock 使用设备操作系统的生物识别 API。生物识别数据不会与我们或任何第三方共享。"]},
      {h:"10. 更新和变更",b:["我们可能更新本应用、添加或移除功能、修复错误、调整价格或更新本 Terms。如果作出重大变更，我们会更新 \"Last updated\" 日期，并可能在适当情况下提供额外通知。"]},
      {h:"11. 无保证",b:["本应用按现状和可用状态提供。在法律允许的最大范围内，我们否认关于适销性、特定用途适用性、不侵权、可用性、估算准确性和无错误运行的保证。"]},
      {h:"12. 责任限制",b:["在法律允许的最大范围内，我们不对间接、偶然、特殊、后果性、示范性或惩罚性损害负责，也不对数据丢失、不准确的周期预测、基于应用估算作出的健康相关决定、错过经期日期或依赖生成的周期数据负责。"]},

    sections.es = [
      {h:"1. Acuerdo",b:["Estos Terms of Service (\"Terms\") rigen tu acceso y uso de CycleLog (\"CycleLog\", \"la App\", \"nosotros\"). Al descargar, acceder o usar la App, aceptas estos Terms. Si no estás de acuerdo, no uses la App."]},
      {h:"2. Qué hace la App",b:["CycleLog es una app móvil privada para rastrear ciclos menstruales, registrar señales de salud, ver estimaciones de ciclo y gestionar datos personales de salud localmente en tu dispositivo.","Algunas funciones pueden ser gratuitas. Otras pueden requerir una suscripción Pro, prueba gratuita u otro derecho mostrado en la App."]},
      {h:"3. No es consejo médico",b:["<strong>CycleLog no es un dispositivo médico, servicio médico ni proveedor sanitario.</strong>","Las predicciones de ciclo, estimaciones de periodo, ovulación, ventana fértil y demás resultados de la App son estimaciones estadísticas basadas en los datos que proporcionas. No son diagnósticos médicos, evaluaciones clínicas ni consejo médico.","<strong>CycleLog no es un método anticonceptivo.</strong> No uses las predicciones de la App para decisiones sobre anticoncepción, embarazo o salud reproductiva sin consultar a un profesional cualificado.","Consulta siempre a un profesional sanitario cualificado para consejo, diagnóstico o tratamiento relacionado con salud menstrual, reproductiva o cualquier otra preocupación de salud."]},
      {h:"4. Tu contenido y responsabilidad",b:["Eres responsable de los datos de ciclo, señales de salud, notas, fechas y demás información que registras o introduces en la App.","Aceptas no usar la App de ninguna forma que viole leyes o regulaciones aplicables o infrinja derechos de otros."]},
      {h:"5. Datos locales y pérdida de datos",b:["CycleLog está diseñado para almacenar tus datos de ciclo localmente en tu dispositivo. Eres responsable de mantener copias de seguridad de datos importantes usando Export.","Los datos locales pueden perderse si eliminas registros, borras datos de la app, desinstalas la App, cambias de dispositivo o si el sistema elimina datos de la app. No somos responsables de la pérdida de datos locales."]},
      {h:"6. Precisión de las estimaciones",b:["Trabajamos para que las predicciones de longitud de ciclo, fechas de periodo, ovulación y ventana fértil sean lo más precisas posible según tus datos. Sin embargo, los ciclos individuales varían y ninguna estimación puede garantizarse.","La precisión depende de la cantidad de datos históricos, regularidad del ciclo y otros factores individuales. Revisa estimaciones antes de decisiones importantes. Consulta siempre a un proveedor sanitario para orientación médica."]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode está diseñado para ocultar rápidamente los datos de ciclo visibles en pantalla. Es una función de conveniencia para proteger tu privacidad en pantalla. No elimina datos ni garantiza que alguien con acceso físico a tu dispositivo desbloqueado no pueda recuperarlos.","Eres responsable de la seguridad general de tu dispositivo y de los datos almacenados en él."]},
      {h:"8. Suscripciones, pruebas y compras",b:["CycleLog puede ofrecer opciones mensuales, anuales, de prueba o promocionales. Precios, duración de prueba, funciones y disponibilidad pueden variar por país, plataforma y momento.",["Las suscripciones se renuevan automáticamente salvo cancelación según reglas de Apple App Store o Google Play.","Las pruebas gratuitas pueden convertirse en suscripciones pagas si no se cancelan antes de terminar.","Puedes gestionar o cancelar suscripciones en los ajustes de tu cuenta Apple App Store o Google Play.","Los reembolsos son gestionados por Apple, Google o el marketplace aplicable según sus políticas."],"Podemos cambiar la disponibilidad de funciones gratuitas y pagas con el tiempo, pero no eliminaremos intencionalmente derechos pagados activos sin un reemplazo razonable o manejo soportado por la plataforma."]},
      {h:"9. Servicios de terceros",b:["La App interactúa con Apple App Store o Google Play para compras y suscripciones. Si exportas y compartes datos, las apps o servicios de archivos de terceros elegidos procesarán esos datos bajo sus propios términos y políticas.","App Lock usa APIs biométricas del sistema operativo de tu dispositivo. Los datos biométricos no se comparten con nosotros ni con terceros."]},
      {h:"10. Actualizaciones y cambios",b:["Podemos actualizar la App, añadir o eliminar funciones, corregir errores, cambiar precios o actualizar estos Terms. Si hacemos cambios importantes, actualizaremos la fecha \"Last updated\" y podremos dar aviso adicional donde corresponda."]},
      {h:"11. Sin garantías",b:["La App se proporciona tal cual y según disponibilidad. En la máxima medida permitida por ley, rechazamos garantías de comerciabilidad, adecuación a un propósito particular, no infracción, disponibilidad, precisión de estimaciones y funcionamiento sin errores."]},
      {h:"12. Limitación de responsabilidad",b:["En la máxima medida permitida por ley, no seremos responsables de daños indirectos, incidentales, especiales, consecuentes, ejemplares o punitivos, ni por pérdida de datos, predicciones inexactas, decisiones de salud basadas en estimaciones, fechas de periodo omitidas o dependencia de datos generados."]},

    sections.pt = [
      {h:"1. Acordo",b:["Estes Terms of Service (\"Terms\") regem seu acesso e uso do CycleLog (\"CycleLog\", \"o App\", \"nós\"). Ao baixar, acessar ou usar o App, você concorda com estes Terms. Se não concordar, não use o App."]},
      {h:"2. O que o App faz",b:["CycleLog é um app móvel privado para acompanhar ciclos menstruais, registrar sinais de saúde, ver estimativas de ciclo e gerenciar dados pessoais de saúde localmente no dispositivo.","Alguns recursos podem ser gratuitos. Outros podem exigir assinatura Pro, teste gratuito ou outro direito mostrado no App."]},
      {h:"3. Não é conselho médico",b:["<strong>CycleLog não é dispositivo médico, serviço médico ou provedor de saúde.</strong>","Predições de ciclo, estimativas de menstruação, ovulação, janela fértil e demais saídas geradas pelo App são estimativas estatísticas baseadas nos dados fornecidos. Não são diagnósticos médicos, avaliações clínicas ou conselho médico.","<strong>CycleLog não é método contraceptivo.</strong> Não use previsões do App para decisões sobre contracepção, gravidez ou saúde reprodutiva sem consultar um profissional qualificado.","Consulte sempre um profissional de saúde qualificado para conselho, diagnóstico ou tratamento relacionado à saúde menstrual, reprodutiva ou qualquer outra questão de saúde."]},
      {h:"4. Seu conteúdo e responsabilidade",b:["Você é responsável pelos dados de ciclo, sinais de saúde, notas, datas e outras informações que registra ou insere no App.","Você concorda em não usar o App de forma que viole leis ou regulamentos aplicáveis ou infrinja direitos de terceiros."]},
      {h:"5. Dados locais e perda de dados",b:["CycleLog foi projetado para armazenar seus dados de ciclo localmente no dispositivo. Você é responsável por manter backups de dados importantes usando Export.","Dados locais podem ser perdidos se você excluir registros, limpar dados do app, desinstalar o App, trocar de dispositivo ou se o sistema remover dados do app. Não somos responsáveis por perda de dados locais."]},
      {h:"6. Precisão das estimativas",b:["Trabalhamos para tornar previsões de duração do ciclo, datas de menstruação, ovulação e janela fértil tão precisas quanto possível com base nos seus dados. Porém, ciclos individuais variam e nenhuma estimativa é garantida.","A precisão depende da quantidade de histórico registrado, regularidade dos ciclos e outros fatores individuais. Revise estimativas antes de decisões importantes. Consulte sempre um profissional para orientação médica."]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode foi criado para ocultar rapidamente dados de ciclo visíveis na tela. É um recurso de conveniência para proteger sua privacidade na tela. Não apaga dados nem garante que eles não possam ser recuperados por alguém com acesso físico ao dispositivo desbloqueado.","Você é responsável pela segurança geral do dispositivo e dos dados armazenados nele."]},
      {h:"8. Assinaturas, testes e compras",b:["CycleLog pode oferecer opções mensais, anuais, de teste ou promocionais. Preços, duração do teste, recursos e disponibilidade podem variar por país, plataforma e tempo.",["Assinaturas renovam automaticamente salvo cancelamento conforme regras da Apple App Store ou Google Play.","Testes gratuitos podem virar assinaturas pagas se não forem cancelados antes do fim.","Você pode gerenciar ou cancelar assinaturas nas configurações da conta Apple App Store ou Google Play.","Reembolsos são tratados por Apple, Google ou marketplace aplicável segundo suas políticas."],"Podemos alterar a disponibilidade de recursos gratuitos e pagos ao longo do tempo, mas não removeremos intencionalmente direitos pagos ativos sem substituição razoável ou tratamento suportado pela plataforma."]},
      {h:"9. Serviços de terceiros",b:["O App interage com Apple App Store ou Google Play para compras e assinaturas. Se você exportar e compartilhar dados, apps ou serviços de arquivos de terceiros escolhidos processarão esses dados sob seus próprios termos e políticas.","App Lock usa APIs biométricas do sistema operacional do dispositivo. Dados biométricos não são compartilhados conosco nem com terceiros."]},
      {h:"10. Atualizações e alterações",b:["Podemos atualizar o App, adicionar ou remover recursos, corrigir bugs, alterar preços ou atualizar estes Terms. Se fizermos mudanças materiais, atualizaremos a data \"Last updated\" e poderemos fornecer aviso adicional quando apropriado."]},
      {h:"11. Sem garantias",b:["O App é fornecido no estado em que se encontra e conforme disponível. Na máxima medida permitida por lei, rejeitamos garantias de comercialização, adequação a finalidade específica, não infração, disponibilidade, precisão de estimativas e operação sem erros."]},
      {h:"12. Limitação de responsabilidade",b:["Na máxima medida permitida por lei, não seremos responsáveis por danos indiretos, incidentais, especiais, consequenciais, exemplares ou punitivos, nem por perda de dados, previsões imprecisas, decisões de saúde baseadas em estimativas, datas perdidas ou dependência de dados gerados."]},
      {h:"13. Termos Apple e Google",b:["Se você baixou o App pela Apple App Store ou Google Play, seu uso também está sujeito aos termos do marketplace, regras de assinatura, pagamento, reembolso e políticas da plataforma aplicáveis."]},

    sections.fr = [
      {h:"1. Accord",b:["Ces Terms of Service (\"Terms\") régissent votre accès et votre utilisation de CycleLog (\"CycleLog\", \"l'App\", \"nous\"). En téléchargeant, accédant à ou utilisant l'App, vous acceptez ces Terms. Si vous n'acceptez pas, n'utilisez pas l'App."]},
      {h:"2. Ce que fait l'App",b:["CycleLog est une app mobile privée pour suivre les cycles menstruels, enregistrer des signaux de santé, consulter des estimations de cycle et gérer des données personnelles de santé localement sur votre appareil.","Certaines fonctions peuvent être gratuites. D'autres peuvent nécessiter un abonnement Pro, un essai gratuit ou un autre droit affiché dans l'App."]},
      {h:"3. Pas un conseil médical",b:["<strong>CycleLog n'est pas un dispositif médical, un service médical ou un professionnel de santé.</strong>","Les prédictions de cycle, estimations de règles, d'ovulation, de fenêtre fertile et autres résultats générés par l'App sont des estimations statistiques basées sur vos données. Elles ne sont pas des diagnostics médicaux, évaluations cliniques ou conseils médicaux.","<strong>CycleLog n'est pas une méthode contraceptive.</strong> N'utilisez pas les prédictions de l'App pour des décisions de contraception, grossesse ou santé reproductive sans consulter un professionnel qualifié.","Consultez toujours un professionnel de santé qualifié pour tout conseil, diagnostic ou traitement lié à votre santé menstruelle, reproductive ou autre préoccupation de santé."]},
      {h:"4. Votre contenu et responsabilité",b:["Vous êtes responsable des données de cycle, signaux de santé, notes, dates et autres informations que vous enregistrez ou saisissez dans l'App.","Vous acceptez de ne pas utiliser l'App d'une manière violant les lois ou règlements applicables ou les droits d'autrui."]},
      {h:"5. Données locales et perte de données",b:["CycleLog est conçu pour stocker vos données de cycle localement sur votre appareil. Vous êtes responsable de conserver des sauvegardes de données importantes grâce à Export.","Les données locales peuvent être perdues si vous supprimez des entrées, effacez les données de l'app, désinstallez l'App, changez d'appareil ou si le système supprime des données d'app. Nous ne sommes pas responsables de la perte de données locales."]},
      {h:"6. Exactitude des estimations",b:["Nous cherchons à rendre les prédictions de longueur de cycle, dates de règles, ovulation et fenêtre fertile aussi exactes que possible selon vos données. Cependant, les cycles individuels varient et aucune estimation ne peut être garantie.","La précision dépend de la quantité d'historique, de la régularité des cycles et d'autres facteurs individuels. Vérifiez les estimations avant toute décision importante. Consultez toujours un professionnel pour un avis médical."]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode est conçu pour masquer rapidement les données de cycle visibles à l'écran. C'est une fonction de confort pour protéger votre confidentialité à l'écran. Elle ne supprime pas les données et ne garantit pas qu'elles ne peuvent pas être récupérées par une personne ayant accès physiquement à votre appareil déverrouillé.","Vous êtes responsable de la sécurité générale de votre appareil et des données qu'il contient."]},
      {h:"8. Abonnements, essais et achats",b:["CycleLog peut proposer des options mensuelles, annuelles, d'essai ou promotionnelles. Les prix, durée d'essai, fonctions et disponibilité peuvent varier selon le pays, la plateforme et le moment.",["Les abonnements se renouvellent automatiquement sauf annulation selon les règles Apple App Store ou Google Play.","Les essais gratuits peuvent devenir des abonnements payants s'ils ne sont pas annulés avant la fin.","Vous pouvez gérer ou annuler les abonnements dans les paramètres de compte Apple App Store ou Google Play.","Les remboursements sont gérés par Apple, Google ou le marketplace applicable selon leurs politiques."],"Nous pouvons modifier la disponibilité des fonctions gratuites et payantes, mais ne retirerons pas intentionnellement des droits payants actifs sans remplacement raisonnable ou traitement pris en charge par la plateforme."]},
      {h:"9. Services tiers",b:["L'App interagit avec Apple App Store ou Google Play pour les achats et abonnements. Si vous exportez et partagez des données, les apps ou services tiers choisis traiteront ces données selon leurs propres conditions et politiques.","App Lock utilise les APIs biométriques du système d'exploitation de votre appareil. Les données biométriques ne sont pas partagées avec nous ni avec des tiers."]},
      {h:"10. Mises à jour et changements",b:["Nous pouvons mettre à jour l'App, ajouter ou retirer des fonctions, corriger des bugs, modifier les prix ou mettre à jour ces Terms. En cas de changements importants, nous mettrons à jour la date \"Last updated\" et pourrons fournir un avis supplémentaire si approprié."]},
      {h:"11. Aucune garantie",b:["L'App est fournie telle quelle et selon disponibilité. Dans la mesure maximale permise par la loi, nous excluons les garanties de qualité marchande, adéquation à un usage particulier, non-contrefaçon, disponibilité, exactitude des estimations et fonctionnement sans erreur."]},
      {h:"12. Limitation de responsabilité",b:["Dans la mesure maximale permise par la loi, nous ne serons pas responsables des dommages indirects, accessoires, spéciaux, consécutifs, exemplaires ou punitifs, ni de la perte de données, prédictions inexactes, décisions de santé fondées sur les estimations, dates de règles manquées ou dépendance aux données générées."]},
      {h:"13. Conditions Apple et Google",b:["Si vous avez téléchargé l'App depuis Apple App Store ou Google Play, votre utilisation est également soumise aux conditions du marketplace, règles d'abonnement, paiement, remboursement et politiques de plateforme applicables."]},

      {h:"4. Deine Inhalte und Verantwortung",b:["Du bist verantwortlich für Zyklusdaten, Gesundheitssignale, Notizen, Daten und andere Informationen, die du in der App einträgst.","Du stimmst zu, die App nicht auf eine Weise zu verwenden, die geltende Gesetze oder Vorschriften verletzt oder Rechte anderer beeinträchtigt."]},
      {h:"5. Lokale Daten und Datenverlust",b:["CycleLog ist so gestaltet, dass deine Zyklusdaten lokal auf deinem Gerät gespeichert werden. Du bist verantwortlich, wichtige Daten mit Export zu sichern.","Lokale Daten können verloren gehen, wenn du Einträge löschst, App-Daten löschst, die App deinstallierst, Geräte wechselst oder das Betriebssystem App-Daten entfernt. Wir sind nicht verantwortlich für den Verlust lokal gespeicherter Daten."]},
      {h:"6. Genauigkeit der Schätzungen",b:["Wir arbeiten daran, Zykluslänge, Periodendaten, Eisprung und Fruchtbarkeitsfenster anhand deiner Daten möglichst genau zu schätzen. Individuelle Zyklen variieren jedoch und keine Schätzung kann garantiert werden.","Die Genauigkeit hängt von der Menge historischer Daten, Regelmäßigkeit deiner Zyklen und anderen individuellen Faktoren ab. Prüfe Schätzungen vor wichtigen Entscheidungen. Konsultiere medizinisches Fachpersonal für medizinische Anleitung."]},
      {h:"7. Emergency Privacy Mode",b:["Emergency Privacy Mode soll sichtbare Zyklusdaten schnell auf dem Bildschirm ausblenden. Es ist eine Komfortfunktion zum Schutz deiner Bildschirmprivatsphäre. Sie löscht keine Daten und garantiert nicht, dass Daten nicht von jemandem mit physischem Zugriff auf dein entsperrtes Gerät wiederhergestellt werden können.","Du bist für die Gesamtsicherheit deines Geräts und der darauf gespeicherten Daten verantwortlich."]},
      {h:"8. Abonnements, Tests und Käufe",b:["CycleLog kann monatliche, jährliche, Test- oder Aktionsabonnements anbieten. Preise, Testdauer, Funktionen und Verfügbarkeit können je nach Land, Plattform und Zeitpunkt variieren.",["Abonnements verlängern sich automatisch, sofern sie nicht gemäß den Regeln des Apple App Store oder Google Play gekündigt werden.","Kostenlose Tests können in kostenpflichtige Abonnements umgewandelt werden, wenn sie nicht vor Ende gekündigt werden.","Du kannst Abonnements in deinen Apple App Store- oder Google Play-Kontoeinstellungen verwalten oder kündigen.","Erstattungen werden von Apple, Google oder dem jeweiligen Marketplace gemäß deren Richtlinien abgewickelt."],"Wir können die Verfügbarkeit kostenloser und bezahlter Funktionen ändern, entfernen aktive bezahlte Berechtigungen jedoch nicht absichtlich ohne angemessenen Ersatz oder plattformgestützte Behandlung."]},
      {h:"9. Drittanbieterdienste",b:["Die App interagiert mit Apple App Store oder Google Play für Käufe und Abonnements. Wenn du Daten exportierst und teilst, verarbeiten die von dir gewählten Drittanbieter-Apps oder Dateidienste diese Daten gemäß ihren eigenen Bedingungen und Datenschutzrichtlinien.","App Lock nutzt biometrische APIs des Betriebssystems deines Geräts. Biometrische Daten werden nicht mit uns oder Dritten geteilt."]},
      {h:"10. Updates und Änderungen",b:["Wir können die App aktualisieren, Funktionen hinzufügen oder entfernen, Fehler beheben, Preise ändern oder diese Terms aktualisieren. Bei wesentlichen Änderungen aktualisieren wir das Datum \"Last updated\" und können bei Bedarf zusätzliche Hinweise geben."]},
      {h:"11. Keine Gewährleistungen",b:["Die App wird wie besehen und nach Verfügbarkeit bereitgestellt. Soweit gesetzlich zulässig, lehnen wir Gewährleistungen für Marktgängigkeit, Eignung für einen bestimmten Zweck, Nichtverletzung, Verfügbarkeit, Genauigkeit der Schätzungen und fehlerfreien Betrieb ab."]},
      {h:"12. Haftungsbeschränkung",b:["Soweit gesetzlich zulässig, haften wir nicht für indirekte, zufällige, besondere, Folge-, exemplarische oder Strafschäden oder für Datenverlust, ungenaue Zyklusvorhersagen, gesundheitsbezogene Entscheidungen auf Grundlage von App-Schätzungen, verpasste Periodendaten oder Vertrauen auf generierte Zyklusdaten."]},
      {h:"13. Apple- und Google-Bedingungen",b:["Wenn du die App aus dem Apple App Store oder Google Play heruntergeladen hast, unterliegt deine Nutzung auch den geltenden Marketplace-Bedingungen, Abonnementregeln, Zahlungsregeln, Erstattungsregeln und Plattformrichtlinien."]},
      {h:"14. Kontakt",b:["Bei Fragen zu diesen Terms kontaktiere uns unter {{email}}."]}

    sections.ar = [
      {h:"1. الاتفاق",b:["تحكم Terms of Service هذه (\"Terms\") وصولك إلى CycleLog (\"CycleLog\" أو \"التطبيق\" أو \"نحن\") واستخدامك له. بتنزيل التطبيق أو الوصول إليه أو استخدامه، توافقين على هذه Terms. إذا كنت لا توافقين، فلا تستخدمي التطبيق."]},
      {h:"2. ما الذي يفعله التطبيق",b:["CycleLog هو تطبيق خاص لتتبع الدورات الشهرية وتسجيل الإشارات الصحية وعرض تقديرات الدورة وإدارة بيانات الصحة الشخصية محليًا على جهازك.","قد تكون بعض الميزات مجانية. وقد تتطلب بعض الميزات اشتراك Pro أو تجربة مجانية أو استحقاقًا آخر يظهر في التطبيق."]},
      {h:"3. ليس نصيحة طبية",b:["<strong>CycleLog ليس جهازًا طبيًا أو خدمة طبية أو مقدم رعاية صحية.</strong>","توقعات الدورة وتقديرات الحيض والإباضة ونافذة الخصوبة وكل المخرجات الأخرى التي يولدها التطبيق هي تقديرات إحصائية بناءً على البيانات التي تقدمينها. ليست تشخيصات طبية أو تقييمات سريرية أو نصائح طبية.","<strong>CycleLog ليس وسيلة لمنع الحمل.</strong> لا تستخدمي توقعات التطبيق لاتخاذ قرارات حول منع الحمل أو الحمل أو الصحة الإنجابية دون استشارة مقدم رعاية صحية مؤهل.","استشيري دائمًا مقدم رعاية صحية مؤهل للحصول على نصيحة أو تشخيص أو علاج يتعلق بصحة الدورة أو الصحة الإنجابية أو أي قلق صحي آخر."]},
      {h:"4. محتواك ومسؤوليتك",b:["أنت مسؤولة عن بيانات الدورة والإشارات الصحية والملاحظات والتواريخ وأي معلومات أخرى تسجلينها أو تدخلينها في التطبيق.","توافقين على عدم استخدام التطبيق بأي طريقة تنتهك القوانين أو اللوائح المعمول بها أو حقوق الآخرين."]},
      {h:"5. البيانات المحلية وفقدان البيانات",b:["تم تصميم CycleLog لتخزين بيانات الدورة محليًا على جهازك. أنت مسؤولة عن الاحتفاظ بنسخ احتياطية من البيانات المهمة باستخدام ميزة Export.","قد تضيع البيانات المحلية إذا حذفت السجلات أو مسحت بيانات التطبيق أو أزلت تثبيته أو غيرت الجهاز أو أزال نظام التشغيل بيانات التطبيق. نحن غير مسؤولين عن فقدان البيانات المخزنة محليًا."]},
      {h:"6. دقة التقديرات",b:["نعمل على جعل توقعات طول الدورة وتواريخ الحيض والإباضة ونافذة الخصوبة دقيقة قدر الإمكان بناءً على بياناتك المسجلة. ومع ذلك، تختلف الدورات الفردية ولا يمكن ضمان أي تقدير.","تعتمد الدقة على مقدار البيانات التاريخية وانتظام الدورات وعوامل فردية أخرى. راجعي التقديرات قبل الاعتماد عليها في أي قرار مهم. استشيري دائمًا مقدم رعاية صحية للتوجيه الطبي."]},
      {h:"7. Emergency Privacy Mode",b:["تم تصميم Emergency Privacy Mode لإخفاء بيانات الدورة الظاهرة على الشاشة بسرعة. إنها ميزة ملاءمة لحماية خصوصيتك على الشاشة. لا تحذف البيانات ولا تضمن عدم إمكانية استعادتها من شخص لديه وصول فعلي إلى جهازك غير المقفل.","أنت مسؤولة عن الأمان العام لجهازك والبيانات المخزنة عليه."]},
      {h:"8. الاشتراكات والتجارب والمشتريات",b:["قد يقدم CycleLog خيارات اشتراك شهرية أو سنوية أو تجريبية أو ترويجية. قد تختلف الأسعار ومدة التجربة والميزات والتوفر حسب البلد والمنصة والوقت.",["تتجدد الاشتراكات تلقائيًا ما لم يتم إلغاؤها وفق قواعد Apple App Store أو Google Play.","قد تتحول التجارب المجانية إلى اشتراكات مدفوعة إذا لم يتم إلغاؤها قبل انتهائها.","يمكنك إدارة أو إلغاء الاشتراكات من إعدادات حساب Apple App Store أو Google Play.","تتم معالجة الاستردادات بواسطة Apple أو Google أو متجر التطبيقات المعني وفق سياساته."],"قد نغير توفر الميزات المجانية والمدفوعة بمرور الوقت، لكننا لن نزيل عمدًا استحقاقات مدفوعة نشطة دون بديل معقول أو معالجة مدعومة من المنصة."]},
      {h:"9. خدمات الطرف الثالث",b:["يتفاعل التطبيق مع Apple App Store أو Google Play للمشتريات والاشتراكات. إذا قمت بتصدير البيانات ومشاركتها، ستعالج تطبيقات أو خدمات الملفات الخارجية التي تختارينها تلك البيانات وفق شروطها وسياسات الخصوصية الخاصة بها.","يستخدم App Lock واجهات المصادقة الحيوية في نظام تشغيل جهازك. لا تتم مشاركة البيانات الحيوية معنا أو مع أي طرف ثالث."]},
      {h:"10. التحديثات والتغييرات",b:["قد نحدث التطبيق أو نضيف أو نزيل ميزات أو نصلح أخطاء أو نغير الأسعار أو نحدث هذه Terms. إذا أجرينا تغييرات جوهرية، سنحدث تاريخ \"Last updated\" وقد نقدم إشعارًا إضافيًا حيثما كان مناسبًا."]},
      {h:"11. لا ضمانات",b:["يتم تقديم التطبيق كما هو وحسب التوفر. إلى أقصى حد يسمح به القانون، نتنصل من ضمانات القابلية للتسويق والملاءمة لغرض معين وعدم الانتهاك والتوفر ودقة التقديرات والتشغيل الخالي من الأخطاء."]},
      {h:"12. حدود المسؤولية",b:["إلى أقصى حد يسمح به القانون، لن نكون مسؤولين عن الأضرار غير المباشرة أو العرضية أو الخاصة أو التبعية أو النموذجية أو العقابية، أو فقدان البيانات، أو توقعات الدورة غير الدقيقة، أو القرارات الصحية المتخذة بناءً على تقديرات التطبيق، أو تواريخ الحيض الفائتة، أو الاعتماد على بيانات الدورة المولدة."]},
      {h:"13. شروط Apple و Google",b:["إذا قمت بتنزيل التطبيق من Apple App Store أو Google Play، فإن استخدامك للتطبيق يخضع أيضًا لشروط المتجر وقواعد الاشتراك والدفع والاسترداد وسياسات المنصة المعمول بها."]},
      {h:"14. التواصل",b:["إذا كانت لديك أسئلة حول هذه Terms، تواصلي معنا عبر {{email}}."]}
    ];

    function renderSections(code) {
      const s = sections[code] || sections.en;
      const EMAIL = '<a href="mailto:khanhquang29000@gmail.com">khanhquang29000@gmail.com</a>';
      document.getElementById("sc").innerHTML = s.map((sec, idx) => {
        const isMedical = idx === 2;
        return `<section${isMedical ? ' class="medical-card"' : ""}><h2>${sec.h}</h2>${sec.b.map(n =>
          Array.isArray(n)
            ? `<ul>${n.map(i => `<li>${i}</li>`).join("")}</ul>`
            : `<p>${n.replace("{{email}}", EMAIL)}</p>`
        ).join("")}</section>`;
      }).join("");
    }

    const select = document.getElementById("languageSelect");
    const browserLanguage = (navigator.language || "en").slice(0, 2).toLowerCase();
    const initialLanguage = copy[browserLanguage] ? browserLanguage : "en";

    for (const [code, label] of languages) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = label;
      select.appendChild(option);
    }

    function renderLanguage(code) {
      const item = copy[code] || copy.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("languageTitle").textContent = item.title;
      document.getElementById("languageSubtitle").textContent = item.subtitle;
      document.getElementById("localizedSummary").textContent = item.summary;
      document.getElementById("legalNote").textContent = item.note;
      select.value = code;
      renderSections(code);
    }

    select.addEventListener("change", (event) => renderLanguage(event.target.value));
    renderLanguage(initialLanguage);
  </script>
