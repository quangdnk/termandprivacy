<head>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0a0b;
      --card: #171315;
      --elevated: #1e1a1c;
      --text: #ffffff;
      --muted: #a2a2aa;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #E8547A;
      --rose: #E8547A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(232, 84, 122, 0.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(200, 100, 180, 0.08), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      color: var(--rose);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    h2 {
      margin: 34px 0 10px;
      font-size: 22px;
      line-height: 1.25;
    }

    p, li {
      color: var(--muted);
      font-size: 16px;
    }

    strong { color: var(--text); }

    a {
      color: #f9a8c0;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    section {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(21, 19, 21, 0.72);
    }

    .language-card {
      background: linear-gradient(145deg, rgba(232, 84, 122, 0.12), rgba(21, 19, 21, 0.72));
    }

    .language-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    select {
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--elevated);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
    }

    .localized-summary {
      margin: 16px 0 0;
      color: var(--text);
    }

    .legal-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    ul { padding-left: 22px; }

    .meta {
      margin: 0;
      color: var(--muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

    <footer>

  </main>

      {h:"6. Xuất và nhập dữ liệu",b:["Nếu dùng tính năng Export, dữ liệu chu kỳ của bạn được ghi vào file JSON cục bộ trên thiết bị. Sau đó bạn có thể chọn chia sẻ, lưu hoặc sao lưu file này bằng hệ thống tệp hoặc ứng dụng khác. Dữ liệu xuất ra được ứng dụng bên thứ ba xử lý theo chính sách riêng của họ.","Chúng tôi không nhận, lưu hoặc xử lý file dữ liệu xuất của bạn trên máy chủ."]},
      {h:"7. Emergency Privacy Mode và App Lock",b:["Emergency Privacy Mode cho phép ẩn ngay dữ liệu chu kỳ đang hiển thị bằng một lần chạm. App Lock yêu cầu xác thực sinh trắc học hoặc mật mã thiết bị để mở Ứng dụng. Các tính năng này nhằm bảo vệ quyền riêng tư trên thiết bị của bạn.","Dữ liệu sinh trắc học dùng cho App Lock được xử lý hoàn toàn bởi hệ thống bảo mật của hệ điều hành và không được Ứng dụng truy cập hoặc truyền đi."]},
      {h:"8. Dữ liệu sức khỏe và thông tin y tế",b:["Dữ liệu chu kỳ bạn ghi và các ước tính do Ứng dụng tạo là thông tin sức khỏe cá nhân. Chúng tôi xử lý dữ liệu này cẩn trọng: dữ liệu ở trên thiết bị và không chia sẻ với nhà quảng cáo, môi giới dữ liệu hoặc dịch vụ bên thứ ba nếu bạn không chủ động thực hiện.","CycleLog không phải thiết bị y tế và không cung cấp tư vấn y tế. Ước tính chu kỳ, dự đoán kỳ kinh, cửa sổ thụ thai và rụng trứng là tính toán thống kê, không phải chẩn đoán y tế và không phù hợp làm biện pháp tránh thai."]},
      {h:"9. Lưu giữ và xóa dữ liệu",b:["Dữ liệu app cục bộ ở trên thiết bị cho đến khi bạn xóa từng mục nhật ký, xóa toàn bộ dữ liệu trong Settings hoặc gỡ cài đặt Ứng dụng.","Nếu bạn liên hệ qua email, chúng tôi có thể lưu cuộc trao đổi đó cho hỗ trợ và cải thiện sản phẩm."]},
      {h:"10. Trẻ em",b:["CycleLog không hướng đến trẻ em dưới 13 tuổi. Chúng tôi không cố ý thu thập thông tin cá nhân từ trẻ dưới 13 tuổi. Nếu bạn tin rằng trẻ đã cung cấp thông tin cá nhân, vui lòng liên hệ để chúng tôi xử lý phù hợp."]},
      {h:"11. Người dùng quốc tế",b:["CycleLog có thể được sử dụng toàn cầu. Nếu bạn mua hàng, Apple hoặc Google có thể xử lý thông tin thanh toán ở quốc gia khác nơi bạn sống theo chính sách riêng của họ. Chúng tôi không tải dữ liệu sức khỏe hoặc chu kỳ của bạn lên máy chủ bên ngoài."]},
      {h:"12. Thay đổi chính sách",b:["Chúng tôi có thể cập nhật Privacy Policy này theo thời gian. Nếu có thay đổi quan trọng, chúng tôi sẽ cập nhật ngày \"Last updated\" và có thể thông báo thêm trong Ứng dụng khi phù hợp."]},
      {h:"13. Liên hệ",b:["Nếu bạn có câu hỏi, yêu cầu hoặc phản hồi về Privacy Policy này, hãy liên hệ với chúng tôi tại {{email}}."]}
    ];

    sections.ja = [
      {h:"1. 概要",b:["この Privacy Policy は、CycleLog（\"CycleLog\"、\"アプリ\"、\"当社\"）がアプリ利用時の情報をどのように扱うかを説明します。CycleLog は、月経周期、生理日、経血量、気分、症状、基礎体温（BBT）、エネルギー、睡眠の質、関連する健康シグナルを記録するプライベートな周期トラッキングアプリです。","CycleLog はプライバシーとオフライン利用を重視して設計されています。健康データと周期データは端末に保存され、当社サーバーへアップロードされず、広告やトラッキング目的で第三者と共有されません。"]},
      {h:"2. 記録または追跡する情報",b:["アプリは機能提供のため、以下の情報を処理します:",["<strong>周期と生理データ:</strong> 生理の開始日と終了日、周期の長さ、生理期間、周期カレンダーのデータ。","<strong>健康シグナルと症状:</strong> 経血量、気分、エネルギー、睡眠の質、BBT、生理痛、その他あなたが記録する症状。","<strong>メモ:</strong> 記録に添付する自由入力メモ。","<strong>アプリ設定:</strong> 周期の既定値、リマインダー時刻、アプリロック設定、言語、表示設定。","<strong>インポートとエクスポートデータ:</strong> データをインポートまたはエクスポートする場合、端末上でローカル JSON ファイルが作成または読み込まれます。","<strong>フィードバック:</strong> メールで連絡する場合、メールアドレス、メッセージ、含めた情報を受け取ることがあります。"],"この情報は端末上にローカル保存されます。CycleLog ではクラウド同期またはバックアップサービスを運営していません。"]},
      {h:"3. 権限",b:["使用する機能に応じて、アプリは次のアクセスを求める場合があります:",["<strong>生体認証（Face ID、指紋）:</strong> App Lock を有効にした場合。生体データは端末の OS によって完全に処理され、アプリがアクセスまたは保存することはありません。","<strong>通知:</strong> あなたが有効にした生理リマインダー、周期予測、その他のローカル通知を送るため。","<strong>ファイル:</strong> 周期データをローカルファイルへエクスポートしたり、以前のバックアップをインポートしたりするため。"],"これらの権限は端末設定で管理できます。"]},
      {h:"4. オフライン動作と外部分析なし",b:["CycleLog は完全にオフラインで動作するよう設計されています。現在のバージョンでは第三者分析サービス、クラッシュレポート、広告ネットワークを使用しません。","周期データ、健康シグナル、利用状況は、トラッキング、分析、広告目的で外部サーバーに送信されません。技術的な問題が発生した場合、あなたがメールで詳細を共有できます。"]},
      {h:"5. 購入とサブスクリプション",b:["CycleLog は無料機能と、月額または年額サブスクリプションによる Pro 機能を提供する場合があります。支払いは Apple App Store または Google Play が処理します。当社はクレジットカード番号全体を受け取ったり保存したりしません。","Pro 機能を解除するため、Apple または Google から購入状態、製品 ID、権限状態、サブスクリプション状態を受け取る場合があります。"]},
      {h:"6. データのエクスポートとインポート",b:["Export 機能を使用すると、周期データは端末上のローカル JSON ファイルに書き出されます。その後、端末のファイルシステムや他アプリを使って共有、保存、バックアップできます。共有先の第三者アプリによる処理は各自のプライバシーポリシーに従います。","当社はエクスポートされたデータファイルをサーバーで受け取り、保存、処理しません。"]},
      {h:"7. Emergency Privacy Mode と App Lock",b:["Emergency Privacy Mode は、表示中の周期データをワンタップで即座に隠す機能です。App Lock はアプリを開く際に生体認証または端末パスコードを要求できます。これらは端末上のプライバシーを守るための機能です。","App Lock に使われる生体データは OS の安全な領域で完全に処理され、アプリからアクセスできず、どこにも送信されません。"]},
      {h:"8. 健康データと医療情報",b:["記録した周期データとアプリが生成する推定は個人の健康情報です。当社はこのデータを特に慎重に扱い、端末上に保持し、あなたの明示的な操作なしに広告業者、データブローカー、第三者サービスと共有しません。","CycleLog は医療機器ではなく医療助言を提供しません。周期推定、生理予測、妊娠可能期間、排卵推定は統計計算であり、医学的診断ではなく、避妊方法として適していません。"]},
      {h:"9. データ保持と削除",b:["ローカルアプリデータは、個別記録の削除、Settings での全データ削除、またはアプリのアンインストールまで端末に残ります。","メールでお問い合わせいただいた場合、その会話をサポートと製品改善のために保持することがあります。"]},
      {h:"10. 子ども",b:["CycleLog は 13 歳未満の子どもを対象としていません。当社は 13 歳未満の子どもから意図的に個人情報を収集しません。子どもが個人情報を提供したと思われる場合は、適切に対応できるようご連絡ください。"]},
      {h:"11. 国際ユーザー",b:["CycleLog は世界中で利用できます。購入時には Apple または Google が各自のプライバシーポリシーに従い、居住国以外で支払い情報を処理する場合があります。当社は健康データまたは周期データを外部サーバーへアップロードしません。"]},
      {h:"12. 本ポリシーの変更",b:["当社はこの Privacy Policy を随時更新することがあります。重要な変更がある場合、\"Last updated\" 日付を更新し、必要に応じてアプリ内で追加通知を行うことがあります。"]},
      {h:"13. 連絡先",b:["この Privacy Policy に関する質問、リクエスト、フィードバックは {{email}} までご連絡ください。"]}
    ];

    sections.ko = [
      {h:"1. 개요",b:["이 Privacy Policy는 CycleLog(\"CycleLog\", \"앱\", \"당사\")가 앱 사용 시 정보를 어떻게 처리하는지 설명합니다. CycleLog는 생리 주기, 생리 날짜, 출혈 강도, 기분, 증상, 기초체온(BBT), 에너지 수준, 수면 품질 및 관련 건강 신호를 기록하는 비공개 주기 추적 앱입니다.","CycleLog는 비공개 및 오프라인 우선으로 설계되었습니다. 건강 및 주기 데이터는 기기에 저장되며 당사 서버에 업로드되거나 광고 또는 추적 목적으로 제3자와 공유되지 않습니다."]},
      {h:"2. 추적 또는 기록하는 정보",b:["앱은 기능 제공을 위해 다음 정보를 처리합니다:",["<strong>주기 및 생리 데이터:</strong> 생리 시작/종료일, 주기 길이, 생리 기간, 주기 달력 데이터.","<strong>건강 신호 및 증상:</strong> 출혈 강도, 기분, 에너지 수준, 수면 품질, BBT, 생리통 및 사용자가 기록하는 기타 증상.","<strong>메모:</strong> 기록 항목에 첨부하는 자유 입력 메모.","<strong>앱 설정:</strong> 기본 주기 길이, 알림 시간, 앱 잠금 설정, 언어 및 표시 설정.","<strong>가져오기 및 내보내기 데이터:</strong> 데이터를 가져오거나 내보내는 경우 로컬 JSON 파일이 기기에서 생성되거나 읽힙니다.","<strong>피드백:</strong> 이메일로 문의하면 이메일 주소, 메시지 및 사용자가 포함한 정보를 받을 수 있습니다."],"이 정보는 기기에 로컬 저장됩니다. CycleLog는 클라우드 동기화 또는 백업 서비스를 운영하지 않습니다."]},
      {h:"3. 권한",b:["사용하는 기능에 따라 앱은 다음 접근 권한을 요청할 수 있습니다:",["<strong>생체 인증(Face ID, 지문):</strong> App Lock 기능을 활성화한 경우. 생체 데이터는 기기의 운영체제에서만 처리되며 앱이 접근하거나 저장하지 않습니다.","<strong>알림:</strong> 사용자가 활성화한 로컬 생리 알림, 주기 예측 또는 기타 알림을 보내기 위해.","<strong>파일:</strong> 주기 데이터를 로컬 파일로 내보내거나 이전에 내보낸 백업을 가져오기 위해."],"이 권한은 기기 설정에서 관리할 수 있습니다."]},
      {h:"4. 오프라인 작동 및 외부 분석 없음",b:["CycleLog는 완전히 오프라인으로 작동하도록 설계되었습니다. 현재 버전은 제3자 분석 서비스, 충돌 보고 서비스 또는 광고 네트워크를 사용하지 않습니다.","주기 데이터, 건강 신호 및 사용 활동은 추적, 분석 또는 광고 목적으로 외부 서버에 전송되지 않습니다. 기술 문제가 발생하면 사용자가 이메일로 세부 정보를 직접 공유할 수 있습니다."]},
      {h:"5. 구매 및 구독",b:["CycleLog는 월간 또는 연간 구독을 통해 무료 기능과 Pro 기능을 제공할 수 있습니다. 결제는 Apple App Store 또는 Google Play에서 처리합니다. 당사는 전체 신용카드 번호를 받거나 저장하지 않습니다.","앱이 Pro 기능을 잠금 해제할 수 있도록 Apple 또는 Google로부터 구매 상태, 제품 식별자, 권한 상태 또는 구독 상태를 받을 수 있습니다."]},
      {h:"6. 데이터 내보내기 및 가져오기",b:["Export 기능을 사용하면 주기 데이터가 기기의 로컬 JSON 파일로 작성됩니다. 이후 기기의 파일 시스템 또는 다른 앱을 사용해 이 파일을 공유, 저장 또는 백업할 수 있습니다. 공유한 제3자 앱의 데이터 처리는 해당 앱의 개인정보처리방침을 따릅니다.","당사는 서버에서 내보낸 데이터 파일을 받거나 저장하거나 처리하지 않습니다."]},
      {h:"7. Emergency Privacy Mode 및 App Lock",b:["Emergency Privacy Mode는 한 번의 탭으로 화면에 보이는 모든 주기 데이터를 즉시 숨깁니다. App Lock은 앱을 열 때 생체 인증 또는 기기 암호를 요구할 수 있습니다. 이 기능들은 기기에서 개인정보를 보호하도록 설계되었습니다.","App Lock에 사용되는 생체 데이터는 운영체제의 보안 영역에서만 처리되며 앱이 접근하거나 전송할 수 없습니다."]},
      {h:"8. 건강 데이터 및 의료 정보",b:["사용자가 기록하는 주기 데이터와 앱이 생성하는 추정값은 개인 건강 정보입니다. 당사는 이 데이터를 특별히 주의하여 다루며, 사용자의 명시적 행동 없이 광고업체, 데이터 브로커 또는 제3자 서비스와 공유하지 않습니다.","CycleLog는 의료기기가 아니며 의료 조언을 제공하지 않습니다. 주기 추정, 생리 예측, 가임 기간 및 배란 추정은 통계 계산이며 의학적 진단이 아니고 피임 방법으로 적합하지 않습니다."]},
      {h:"9. 데이터 보관 및 삭제",b:["로컬 앱 데이터는 개별 기록을 삭제하거나 Settings에서 모든 데이터를 지우거나 앱을 제거할 때까지 기기에 남아 있습니다.","이메일로 문의한 경우 당사는 지원 및 제품 개선 목적으로 해당 대화를 보관할 수 있습니다."]},
      {h:"10. 아동",b:["CycleLog는 13세 미만 아동을 대상으로 하지 않습니다. 당사는 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 아동이 개인정보를 제공했다고 생각되면 적절한 조치를 취할 수 있도록 연락해 주세요."]},
      {h:"11. 국제 사용자",b:["CycleLog는 전 세계에서 사용할 수 있습니다. 구매 시 Apple 또는 Google은 자체 개인정보처리방침에 따라 사용자가 거주하는 국가 외의 국가에서 결제 정보를 처리할 수 있습니다. 당사는 건강 또는 주기 데이터를 외부 서버에 업로드하지 않습니다."]},
      {h:"12. 본 정책 변경",b:["당사는 때때로 이 Privacy Policy를 업데이트할 수 있습니다. 중요한 변경이 있는 경우 \"Last updated\" 날짜를 업데이트하고 필요한 경우 앱에서 추가 공지를 제공할 수 있습니다."]},
      {h:"13. 연락처",b:["이 Privacy Policy에 대한 질문, 요청 또는 피드백은 {{email}} 로 문의하세요."]}
    ];

    sections.zh = [
      {h:"1. 概述",b:["本 Privacy Policy 说明 CycleLog（\"CycleLog\"、\"本应用\"、\"我们\"）在你使用应用时如何处理信息。CycleLog 是一款私密的经期和周期追踪应用，用于记录月经周期、经期日期、流量强度、心情、症状、基础体温（BBT）、能量水平、睡眠质量和相关健康信号。","CycleLog 采用隐私优先和离线优先设计。你的健康和周期数据存储在设备上，不会上传到我们的服务器，也不会为广告或追踪目的与第三方共享。"]},
      {h:"2. 你追踪或记录的信息",b:["本应用会处理以下信息以提供功能:",["<strong>周期和经期数据:</strong> 经期开始和结束日期、周期长度、经期长度和周期日历数据。","<strong>健康信号和症状:</strong> 流量强度、心情、能量、睡眠质量、BBT、痛经以及你选择记录的其他症状。","<strong>备注:</strong> 你附加到记录条目的任何自由文本备注。","<strong>应用设置:</strong> 默认周期长度、提醒时间、应用锁偏好、语言和显示偏好。","<strong>导入和导出数据:</strong> 如果你导入或导出数据，本地 JSON 文件会在设备上创建或读取。","<strong>反馈:</strong> 如果你通过邮件联系我们，我们可能会收到你的邮箱地址、消息和你选择包含的信息。"],"这些信息会保存在你的设备本地。我们不为 CycleLog 运营云同步或备份服务。"]},
      {h:"3. 权限",b:["根据你使用的功能，本应用可能请求访问:",["<strong>生物识别认证（Face ID、指纹）:</strong> 如果你启用 App Lock。你的生物识别数据完全由设备操作系统处理，本应用不会访问或存储。","<strong>通知:</strong> 用于发送你启用的本地经期提醒、周期预测或其他提醒。","<strong>文件:</strong> 用于将周期数据导出到本地文件或导入之前导出的备份。"],"你可以在设备设置中管理这些权限。"]},
      {h:"4. 离线运行，无外部分析",b:["CycleLog 设计为完全离线工作。当前版本不使用第三方分析服务、崩溃报告服务或广告网络。","你的周期数据、健康信号和使用活动不会发送到外部服务器用于追踪、分析或广告。如果遇到技术问题，你可以选择通过邮件直接向我们分享详情。"]},
      {h:"5. 购买和订阅",b:["CycleLog 可能通过月度或年度订阅提供免费功能和 Pro 功能。付款由 Apple App Store 或 Google Play 处理。我们不会接收或存储你的完整信用卡号。","我们可能会从 Apple 或 Google 接收购买状态、产品标识符、权益状态或订阅状态，以便应用解锁 Pro 功能。"]},
      {h:"6. 导出和导入数据",b:["如果使用 Export 功能，你的周期数据会写入设备上的本地 JSON 文件。之后你可以通过设备文件系统或其他应用分享、保存或备份该文件。你分享给第三方应用后的数据处理受其自身隐私政策约束。","我们不会在服务器上接收、存储或处理你的导出数据文件。"]},
      {h:"7. Emergency Privacy Mode 和 App Lock",b:["Emergency Privacy Mode 可让你一键隐藏屏幕上可见的周期数据。App Lock 可要求使用生物识别认证或设备密码打开应用。这些功能旨在保护你设备上的隐私。","App Lock 使用的生物识别数据完全由操作系统安全区域处理，本应用无法访问，也不会传输到任何地方。"]},
      {h:"8. 健康数据和医疗信息",b:["你记录的周期数据和应用生成的估算属于个人健康信息。我们会特别谨慎地处理这些数据：它们留在你的设备上，除非你明确操作，否则不会与广告商、数据经纪商或第三方服务共享。","CycleLog 不是医疗设备，也不提供医疗建议。周期估算、经期预测、易孕窗口估算和排卵估算是统计计算，不是医学诊断，也不适合作为避孕方法。"]},
      {h:"9. 数据保留和删除",b:["本地应用数据会保留在你的设备上，直到你删除单个记录、在 Settings 中清除全部数据或卸载应用。","如果你通过邮件联系我们，我们可能会为支持和产品改进目的保留该对话。"]},
      {h:"10. 儿童",b:["CycleLog 不面向 13 岁以下儿童。我们不会 knowingly 收集 13 岁以下儿童的个人信息。如果你认为儿童提供了个人信息，请联系我们以便采取适当措施。"]},
      {h:"11. 国际用户",b:["CycleLog 可在全球使用。如果你购买服务，Apple 或 Google 可能会根据其自身隐私政策在你所在国家以外处理付款信息。我们不会将你的健康或周期数据上传到外部服务器。"]},
      {h:"12. 本政策变更",b:["我们可能会不时更新本 Privacy Policy。如果作出重大变更，我们会更新 \"Last updated\" 日期，并可能在适当情况下在应用内提供额外通知。"]},
      {h:"13. 联系",b:["如果你对本 Privacy Policy 有问题、请求或反馈，请通过 {{email}} 联系我们。"]}
    ];

    sections.es = [
      {h:"1. Descripción general",b:["Esta Privacy Policy explica cómo CycleLog (\"CycleLog\", \"la App\", \"nosotros\") maneja la información cuando usas la App. CycleLog es una app privada de seguimiento menstrual y de ciclos para registrar ciclos, fechas de periodo, intensidad del flujo, estado de ánimo, síntomas, temperatura basal (BBT), energía, calidad del sueño y señales de salud relacionadas.","CycleLog está diseñado con privacidad y funcionamiento offline primero. Tus datos de salud y ciclo se almacenan en tu dispositivo y no se suben a nuestros servidores ni se comparten con terceros para publicidad o seguimiento."]},
      {h:"2. Información que rastreas o registras",b:["La App procesa la siguiente información para ofrecer sus funciones:",["<strong>Datos de ciclo y periodo:</strong> fechas de inicio y fin del periodo, longitud del ciclo, duración del periodo y datos de calendario.","<strong>Señales de salud y síntomas:</strong> intensidad del flujo, estado de ánimo, energía, sueño, BBT, cólicos y otros síntomas que decidas registrar.","<strong>Notas:</strong> notas de texto libre que adjuntes a entradas.","<strong>Ajustes:</strong> valores predeterminados de ciclo, hora de recordatorio, bloqueo de app, idioma y preferencias visuales.","<strong>Importación y exportación:</strong> si importas o exportas datos, se crea o lee un archivo JSON local en tu dispositivo.","<strong>Feedback:</strong> si nos contactas por email, podemos recibir tu email, mensaje e información que incluyas."],"Esta información se guarda localmente en tu dispositivo. No operamos un servicio de sincronización o copia en la nube para CycleLog."]},
      {h:"3. Permisos",b:["Según las funciones que uses, la App puede solicitar acceso a:",["<strong>Autenticación biométrica (Face ID, huella):</strong> si activas App Lock. Tus datos biométricos son procesados por el sistema operativo y nunca son accedidos ni almacenados por la App.","<strong>Notificaciones:</strong> para enviarte recordatorios locales del periodo, predicciones de ciclo u otras alertas que actives.","<strong>Archivos:</strong> para exportar tus datos a un archivo local o importar una copia previa."],"Puedes gestionar estos permisos en los ajustes de tu dispositivo."]},
      {h:"4. Operación offline y sin analíticas externas",b:["CycleLog está diseñado para funcionar completamente offline. La versión actual no usa servicios de analíticas de terceros, crash reporting ni redes publicitarias.","Tus datos de ciclo, señales de salud y actividad de uso no se envían a servidores externos para seguimiento, analíticas o publicidad. Si tienes un problema técnico, puedes compartir detalles con nosotros por email."]},
      {h:"5. Compras y suscripciones",b:["CycleLog puede ofrecer funciones gratuitas y Pro mediante suscripción mensual o anual. Los pagos son procesados por Apple App Store o Google Play. No recibimos ni guardamos tu número completo de tarjeta.","Podemos recibir estado de compra, identificadores de producto, estado de derechos o estado de suscripción de Apple o Google para desbloquear funciones Pro."]},
      {h:"6. Exportar e importar datos",b:["Si usas Export, tus datos de ciclo se escriben en un archivo JSON local en tu dispositivo. Luego puedes compartir, guardar o respaldar ese archivo usando el sistema de archivos u otras apps. El manejo de datos por apps de terceros se rige por sus propias políticas.","No recibimos, almacenamos ni procesamos tus archivos exportados en nuestros servidores."]},
      {h:"7. Emergency Privacy Mode y App Lock",b:["Emergency Privacy Mode te permite ocultar al instante todos los datos visibles de ciclo con un toque. App Lock permite requerir autenticación biométrica o código del dispositivo para abrir la App. Estas funciones protegen tu privacidad en tu dispositivo.","Los datos biométricos usados para App Lock son procesados completamente por el sistema operativo y no son accesibles para la App ni transmitidos a ningún lugar."]},
      {h:"8. Datos de salud e información médica",b:["Los datos de ciclo que registras y las estimaciones generadas por la App son información de salud personal. Los tratamos con especial cuidado: permanecen en tu dispositivo y no se comparten con anunciantes, brokers de datos o servicios de terceros sin tu acción explícita.","CycleLog no es un dispositivo médico y no proporciona consejo médico. Las estimaciones de ciclo, periodo, ventana fértil y ovulación son cálculos estadísticos. No son diagnósticos médicos ni son adecuados como método anticonceptivo."]},
      {h:"9. Retención y eliminación",b:["Los datos locales permanecen en tu dispositivo hasta que elimines entradas, borres todos los datos en Settings o desinstales la App.","Si nos contactas por email, podemos conservar esa conversación para soporte y mejora del producto."]},
      {h:"10. Niños",b:["CycleLog no está dirigido a menores de 13 años. No recopilamos conscientemente información personal de menores de 13. Si crees que un menor proporcionó información personal, contáctanos para tomar medidas adecuadas."]},
      {h:"11. Usuarios internacionales",b:["CycleLog puede usarse globalmente. Si realizas una compra, Apple o Google pueden procesar información de pago en países distintos al tuyo según sus propias políticas. No subimos tus datos de salud o ciclo a servidores externos."]},
      {h:"12. Cambios en esta política",b:["Podemos actualizar esta Privacy Policy de vez en cuando. Si hacemos cambios importantes, actualizaremos la fecha \"Last updated\" y podemos dar aviso adicional en la App cuando corresponda."]},
      {h:"13. Contacto",b:["Si tienes preguntas, solicitudes o comentarios sobre esta Privacy Policy, contáctanos en {{email}}."]}
    ];

    sections.pt = [
      {h:"1. Visão geral",b:["Esta Privacy Policy explica como o CycleLog (\"CycleLog\", \"o App\", \"nós\") trata informações quando você usa o App. CycleLog é um app privado de acompanhamento menstrual e de ciclos para registrar ciclos, datas de menstruação, intensidade do fluxo, humor, sintomas, temperatura basal (BBT), energia, qualidade do sono e sinais de saúde relacionados.","CycleLog foi criado com privacidade e offline-first. Seus dados de saúde e ciclo são armazenados no dispositivo e não são enviados aos nossos servidores nem compartilhados com terceiros para publicidade ou rastreamento."]},
      {h:"2. Informações que você acompanha ou registra",b:["O App processa as seguintes informações para oferecer recursos:",["<strong>Dados de ciclo e menstruação:</strong> datas de início e fim da menstruação, duração do ciclo, duração da menstruação e calendário.","<strong>Sinais de saúde e sintomas:</strong> intensidade do fluxo, humor, energia, sono, BBT, cólicas e outros sintomas que você escolher registrar.","<strong>Notas:</strong> notas livres anexadas a registros.","<strong>Configurações:</strong> padrões de ciclo, horário de lembrete, bloqueio do app, idioma e preferências visuais.","<strong>Importação e exportação:</strong> se você importar ou exportar dados, um arquivo JSON local é criado ou lido no dispositivo.","<strong>Feedback:</strong> se você nos contatar por email, podemos receber seu email, mensagem e informações incluídas."],"Essas informações são armazenadas localmente no dispositivo. Não operamos serviço de sincronização ou backup em nuvem para CycleLog."]},
      {h:"3. Permissões",b:["Dependendo dos recursos usados, o App pode solicitar acesso a:",["<strong>Autenticação biométrica (Face ID, digital):</strong> se você ativar App Lock. Seus dados biométricos são processados pelo sistema operacional e nunca acessados ou armazenados pelo App.","<strong>Notificações:</strong> para enviar lembretes locais de menstruação, previsões de ciclo ou outros alertas ativados.","<strong>Arquivos:</strong> para exportar dados para um arquivo local ou importar backup anterior."],"Você pode gerenciar essas permissões nas configurações do dispositivo."]},
      {h:"4. Operação offline e sem analytics externos",b:["CycleLog foi projetado para funcionar totalmente offline. A versão atual não usa serviços de analytics de terceiros, crash reporting ou redes de anúncios.","Dados de ciclo, sinais de saúde e atividade de uso não são enviados a servidores externos para rastreamento, analytics ou publicidade. Se encontrar um problema técnico, você pode compartilhar detalhes conosco por email."]},
      {h:"5. Compras e assinaturas",b:["CycleLog pode oferecer recursos gratuitos e Pro por assinatura mensal ou anual. Pagamentos são processados pela Apple App Store ou Google Play. Não recebemos nem armazenamos o número completo do seu cartão.","Podemos receber status de compra, identificadores de produto, status de direito ou assinatura da Apple ou Google para desbloquear recursos Pro."]},
      {h:"6. Exportação e importação de dados",b:["Se você usar Export, seus dados de ciclo são gravados em um arquivo JSON local no dispositivo. Você pode compartilhar, salvar ou fazer backup usando o sistema de arquivos ou outros apps. O tratamento por apps de terceiros segue suas próprias políticas.","Não recebemos, armazenamos nem processamos arquivos exportados em nossos servidores."]},
      {h:"7. Emergency Privacy Mode e App Lock",b:["Emergency Privacy Mode permite ocultar instantaneamente todos os dados visíveis de ciclo com um toque. App Lock permite exigir biometria ou senha do dispositivo para abrir o App. Esses recursos protegem sua privacidade no dispositivo.","Dados biométricos usados pelo App Lock são processados totalmente pelo sistema operacional e não são acessíveis ao App nem transmitidos."]},
      {h:"8. Dados de saúde e informação médica",b:["Dados de ciclo que você registra e estimativas geradas pelo App são informações pessoais de saúde. Tratamos esses dados com cuidado: ficam no dispositivo e não são compartilhados com anunciantes, data brokers ou terceiros sem sua ação explícita.","CycleLog não é dispositivo médico e não fornece conselho médico. Estimativas de ciclo, menstruação, janela fértil e ovulação são cálculos estatísticos. Não são diagnósticos médicos nem adequadas como método contraceptivo."]},
      {h:"9. Retenção e exclusão",b:["Dados locais permanecem no dispositivo até você excluir registros, limpar todos os dados em Settings ou desinstalar o App.","Se você nos contatar por email, podemos manter a conversa para suporte e melhoria do produto."]},
      {h:"10. Crianças",b:["CycleLog não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de menores de 13. Se acredita que uma criança forneceu informações, entre em contato para tomarmos medidas adequadas."]},
      {h:"11. Usuários internacionais",b:["CycleLog pode ser usado globalmente. Se você fizer uma compra, Apple ou Google podem processar informações de pagamento em países diferentes do seu, conforme suas próprias políticas. Não enviamos dados de saúde ou ciclo a servidores externos."]},
      {h:"12. Alterações desta política",b:["Podemos atualizar esta Privacy Policy periodicamente. Se fizermos mudanças relevantes, atualizaremos a data \"Last updated\" e poderemos avisar no App quando apropriado."]},
      {h:"13. Contato",b:["Se tiver perguntas, solicitações ou feedback sobre esta Privacy Policy, entre em contato em {{email}}."]}
    ];

    sections.fr = [
      {h:"1. Aperçu",b:["Cette Privacy Policy explique comment CycleLog (\"CycleLog\", \"l'App\", \"nous\") traite les informations lorsque vous utilisez l'App. CycleLog est une app privée de suivi menstruel et de cycle pour enregistrer cycles, dates de règles, intensité du flux, humeur, symptômes, température basale (BBT), énergie, qualité du sommeil et signaux de santé liés.","CycleLog est conçu avec une approche privée et offline-first. Vos données de santé et de cycle sont stockées sur votre appareil et ne sont pas envoyées à nos serveurs ni partagées avec des tiers à des fins de publicité ou de suivi."]},
      {h:"2. Informations que vous suivez ou enregistrez",b:["L'App traite les informations suivantes pour fournir ses fonctions :",["<strong>Données de cycle et de règles :</strong> dates de début et de fin des règles, longueur du cycle, durée des règles et calendrier.","<strong>Signaux de santé et symptômes :</strong> intensité du flux, humeur, énergie, sommeil, BBT, crampes et autres symptômes que vous choisissez d'enregistrer.","<strong>Notes :</strong> notes libres attachées aux entrées.","<strong>Paramètres :</strong> valeurs par défaut du cycle, heure de rappel, verrouillage de l'app, langue et préférences d'affichage.","<strong>Import et export :</strong> si vous importez ou exportez des données, un fichier JSON local est créé ou lu sur votre appareil.","<strong>Feedback :</strong> si vous nous contactez par email, nous pouvons recevoir votre adresse, message et informations incluses."],"Ces informations sont stockées localement sur votre appareil. Nous n'exploitons pas de service de synchronisation ou sauvegarde cloud pour CycleLog."]},
      {h:"3. Autorisations",b:["Selon les fonctions utilisées, l'App peut demander l'accès à :",["<strong>Authentification biométrique (Face ID, empreinte) :</strong> si vous activez App Lock. Vos données biométriques sont entièrement traitées par le système d'exploitation et jamais consultées ou stockées par l'App.","<strong>Notifications :</strong> pour envoyer des rappels locaux de règles, prédictions de cycle ou alertes activées.","<strong>Fichiers :</strong> pour exporter vos données vers un fichier local ou importer une sauvegarde précédente."],"Vous pouvez gérer ces autorisations dans les paramètres de votre appareil."]},
      {h:"4. Fonctionnement hors ligne, sans analytics externes",b:["CycleLog est conçu pour fonctionner entièrement hors ligne. La version actuelle n'utilise pas de services analytics tiers, crash reporting ou réseaux publicitaires.","Vos données de cycle, signaux de santé et activité d'utilisation ne sont pas envoyés à des serveurs externes pour suivi, analytics ou publicité. En cas de problème technique, vous pouvez choisir de nous envoyer des détails par email."]},
      {h:"5. Achats et abonnements",b:["CycleLog peut proposer des fonctions gratuites et Pro via abonnement mensuel ou annuel. Les paiements sont traités par Apple App Store ou Google Play. Nous ne recevons ni ne stockons votre numéro complet de carte.","Nous pouvons recevoir d'Apple ou Google le statut d'achat, les identifiants produit, les droits ou l'état d'abonnement pour déverrouiller les fonctions Pro."]},
      {h:"6. Exporter et importer des données",b:["Si vous utilisez Export, vos données de cycle sont écrites dans un fichier JSON local sur votre appareil. Vous pouvez ensuite partager, enregistrer ou sauvegarder ce fichier via le système de fichiers ou d'autres apps. Le traitement par des apps tierces est régi par leurs propres politiques.","Nous ne recevons, stockons ni traitons vos fichiers exportés sur nos serveurs."]},
      {h:"7. Emergency Privacy Mode et App Lock",b:["Emergency Privacy Mode permet de masquer instantanément toutes les données de cycle visibles en un toucher. App Lock permet d'exiger une authentification biométrique ou le code de l'appareil pour ouvrir l'App. Ces fonctions protègent votre vie privée sur votre appareil.","Les données biométriques utilisées par App Lock sont entièrement traitées par le système d'exploitation et ne sont pas accessibles à l'App ni transmises."]},
      {h:"8. Données de santé et information médicale",b:["Les données de cycle que vous enregistrez et les estimations générées par l'App sont des informations personnelles de santé. Nous les traitons avec soin : elles restent sur votre appareil et ne sont pas partagées avec annonceurs, courtiers de données ou services tiers sans action explicite de votre part.","CycleLog n'est pas un dispositif médical et ne fournit pas de conseil médical. Les estimations de cycle, règles, fenêtre fertile et ovulation sont des calculs statistiques. Elles ne sont pas des diagnostics médicaux et ne conviennent pas comme méthode contraceptive."]},
      {h:"9. Conservation et suppression",b:["Les données locales restent sur votre appareil jusqu'à ce que vous supprimiez des entrées, effaciez toutes les données dans Settings ou désinstalliez l'App.","Si vous nous contactez par email, nous pouvons conserver cette conversation pour le support et l'amélioration du produit."]},
      {h:"10. Enfants",b:["CycleLog ne s'adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d'informations personnelles d'enfants de moins de 13 ans. Si vous pensez qu'un enfant a fourni des informations, contactez-nous afin que nous puissions agir."]},
      {h:"11. Utilisateurs internationaux",b:["CycleLog peut être utilisé dans le monde entier. Si vous effectuez un achat, Apple ou Google peut traiter les informations de paiement dans d'autres pays selon ses propres politiques. Nous n'envoyons pas vos données de santé ou de cycle à des serveurs externes."]},
      {h:"12. Modifications de cette politique",b:["Nous pouvons mettre à jour cette Privacy Policy de temps à autre. En cas de changements importants, nous mettrons à jour la date \"Last updated\" et pourrons fournir un avis dans l'App si approprié."]},
      {h:"13. Contact",b:["Pour toute question, demande ou commentaire sur cette Privacy Policy, contactez-nous à {{email}}."]}
    ];

    sections.de = [
      {h:"1. Überblick",b:["Diese Privacy Policy erklärt, wie CycleLog (\"CycleLog\", \"die App\", \"wir\") Informationen verarbeitet, wenn du die App nutzt. CycleLog ist eine private Perioden- und Zyklus-Tracking-App zum Erfassen von Menstruationszyklen, Periodendaten, Blutungsstärke, Stimmung, Symptomen, Basaltemperatur (BBT), Energie, Schlafqualität und verwandten Gesundheitssignalen.","CycleLog ist privat und offline-first gestaltet. Deine Gesundheits- und Zyklusdaten werden auf deinem Gerät gespeichert und nicht auf unsere Server hochgeladen oder zu Werbe- oder Trackingzwecken mit Dritten geteilt."]},
      {h:"2. Informationen, die du verfolgst oder einträgst",b:["Die App verarbeitet folgende Informationen zur Bereitstellung ihrer Funktionen:",["<strong>Zyklus- und Periodendaten:</strong> Start- und Enddaten der Periode, Zykluslänge, Periodenlänge und Kalenderdaten.","<strong>Gesundheitssignale und Symptome:</strong> Blutungsstärke, Stimmung, Energie, Schlafqualität, BBT, Krämpfe und andere Symptome, die du einträgst.","<strong>Notizen:</strong> freie Textnotizen, die du Einträgen hinzufügst.","<strong>App-Einstellungen:</strong> Standardzykluslänge, Erinnerungszeit, App-Lock-Einstellung, Sprache und Anzeigeoptionen.","<strong>Import- und Exportdaten:</strong> Beim Import oder Export wird eine lokale JSON-Datei auf deinem Gerät erstellt oder gelesen.","<strong>Feedback:</strong> Wenn du uns per E-Mail kontaktierst, können wir deine Adresse, Nachricht und enthaltene Informationen erhalten."],"Diese Informationen werden lokal auf deinem Gerät gespeichert. Wir betreiben keinen Cloud-Synchronisierungs- oder Backupdienst für CycleLog."]},
      {h:"3. Berechtigungen",b:["Je nach verwendeter Funktion kann die App Zugriff anfordern auf:",["<strong>Biometrische Authentifizierung (Face ID, Fingerabdruck):</strong> wenn du App Lock aktivierst. Deine biometrischen Daten werden vollständig vom Betriebssystem verarbeitet und von der App nie abgerufen oder gespeichert.","<strong>Benachrichtigungen:</strong> um lokale Periodenerinnerungen, Zyklusvorhersagen oder andere aktivierte Hinweise zu senden.","<strong>Dateien:</strong> um Zyklusdaten in eine lokale Datei zu exportieren oder ein früheres Backup zu importieren."],"Du kannst diese Berechtigungen in den Geräteeinstellungen verwalten."]},
      {h:"4. Offline-Betrieb ohne externe Analytics",b:["CycleLog ist für vollständigen Offline-Betrieb konzipiert. Die aktuelle Version verwendet keine Drittanbieter-Analytics, Crash-Reporting-Dienste oder Werbenetzwerke.","Deine Zyklusdaten, Gesundheitssignale und Nutzungsaktivität werden nicht für Tracking, Analytics oder Werbung an externe Server gesendet. Bei technischen Problemen kannst du uns freiwillig Details per E-Mail senden."]},
      {h:"5. Käufe und Abonnements",b:["CycleLog kann kostenlose und Pro-Funktionen über Monats- oder Jahresabonnements anbieten. Zahlungen werden über Apple App Store oder Google Play verarbeitet. Wir erhalten oder speichern deine vollständige Kreditkartennummer nicht.","Wir können Kaufstatus, Produktkennungen, Berechtigungsstatus oder Abonnementstatus von Apple oder Google erhalten, damit die App Pro-Funktionen freischalten kann."]},
      {h:"6. Daten exportieren und importieren",b:["Wenn du Export verwendest, werden deine Zyklusdaten in eine lokale JSON-Datei auf deinem Gerät geschrieben. Danach kannst du diese Datei über das Dateisystem oder andere Apps teilen, speichern oder sichern. Die Verarbeitung durch Drittanbieter-Apps unterliegt deren eigenen Datenschutzrichtlinien.","Wir erhalten, speichern oder verarbeiten deine exportierten Datendateien nicht auf unseren Servern."]},
      {h:"7. Emergency Privacy Mode und App Lock",b:["Emergency Privacy Mode blendet alle sichtbaren Zyklusdaten mit einem Tipp sofort aus. App Lock kann biometrische Authentifizierung oder Gerätecode zum Öffnen der App verlangen. Diese Funktionen schützen deine Privatsphäre auf deinem Gerät.","Biometrische Daten für App Lock werden vollständig vom sicheren Bereich des Betriebssystems verarbeitet und sind für die App nicht zugänglich oder übertragbar."]},
      {h:"8. Gesundheitsdaten und medizinische Informationen",b:["Zyklusdaten, die du einträgst, und Schätzungen der App sind persönliche Gesundheitsinformationen. Wir behandeln sie besonders sorgfältig: Sie bleiben auf deinem Gerät und werden ohne deine ausdrückliche Aktion nicht mit Werbetreibenden, Datenhändlern oder Drittanbieterdiensten geteilt.","CycleLog ist kein Medizinprodukt und bietet keine medizinische Beratung. Zyklus-, Perioden-, Fruchtbarkeitsfenster- und Eisprungschätzungen sind statistische Berechnungen. Sie sind keine Diagnosen und nicht als Verhütungsmethode geeignet."]},
      {h:"9. Speicherung und Löschung",b:["Lokale App-Daten bleiben auf deinem Gerät, bis du einzelne Einträge löschst, alle Daten in Settings löschst oder die App deinstallierst.","Wenn du uns per E-Mail kontaktierst, können wir diese Unterhaltung für Support und Produktverbesserung aufbewahren."]},
      {h:"10. Kinder",b:["CycleLog richtet sich nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn du glaubst, dass ein Kind Daten bereitgestellt hat, kontaktiere uns bitte."]},
      {h:"11. Internationale Nutzer",b:["CycleLog kann weltweit genutzt werden. Wenn du etwas kaufst, können Apple oder Google Zahlungsinformationen gemäß ihren eigenen Richtlinien in anderen Ländern verarbeiten. Wir laden deine Gesundheits- oder Zyklusdaten nicht auf externe Server hoch."]},
      {h:"12. Änderungen dieser Richtlinie",b:["Wir können diese Privacy Policy von Zeit zu Zeit aktualisieren. Bei wesentlichen Änderungen aktualisieren wir das Datum \"Last updated\" und können bei Bedarf zusätzliche Hinweise in der App geben."]},
      {h:"13. Kontakt",b:["Bei Fragen, Anfragen oder Feedback zu dieser Privacy Policy kontaktiere uns unter {{email}}."]}
    ];

    sections.ar = [
      {h:"1. نظرة عامة",b:["توضح Privacy Policy هذه كيف يتعامل CycleLog (\"CycleLog\" أو \"التطبيق\" أو \"نحن\") مع المعلومات عند استخدام التطبيق. CycleLog هو تطبيق خاص لتتبع الدورة الشهرية لتسجيل الدورات وتواريخ الحيض وشدة التدفق والمزاج والأعراض ودرجة حرارة الجسم الأساسية (BBT) ومستوى الطاقة وجودة النوم والإشارات الصحية المرتبطة.","تم تصميم CycleLog ليكون خاصًا ويعمل دون اتصال أولًا. يتم تخزين بيانات الصحة والدورة على جهازك ولا يتم رفعها إلى خوادمنا أو مشاركتها مع أطراف ثالثة لأغراض الإعلان أو التتبع."]},
      {h:"2. المعلومات التي تتبعها أو تسجلها",b:["يعالج التطبيق المعلومات التالية لتقديم ميزاته:",["<strong>بيانات الدورة والحيض:</strong> تواريخ بداية ونهاية الحيض، طول الدورة، مدة الحيض، وبيانات تقويم الدورة.","<strong>الإشارات الصحية والأعراض:</strong> شدة التدفق، المزاج، مستوى الطاقة، جودة النوم، BBT، التقلصات، وأعراض أخرى تختارين تسجيلها.","<strong>الملاحظات:</strong> أي ملاحظات نصية تضيفينها إلى السجلات.","<strong>إعدادات التطبيق:</strong> افتراضيات طول الدورة، وقت التذكير، تفضيل قفل التطبيق، اللغة، وتفضيلات العرض.","<strong>بيانات الاستيراد والتصدير:</strong> إذا قمت باستيراد أو تصدير البيانات، يتم إنشاء أو قراءة ملف JSON محلي على جهازك.","<strong>التعليقات:</strong> إذا تواصلت معنا عبر البريد الإلكتروني، فقد نتلقى عنوان بريدك ورسالتك وأي معلومات تختارين تضمينها."],"يتم تخزين هذه المعلومات محليًا على جهازك. نحن لا نشغل خدمة مزامنة أو نسخ احتياطي سحابية لـ CycleLog."]},
      {h:"3. الأذونات",b:["اعتمادًا على الميزات التي تستخدمينها، قد يطلب التطبيق الوصول إلى:",["<strong>المصادقة الحيوية (Face ID، بصمة):</strong> إذا فعّلت App Lock. تتم معالجة بياناتك الحيوية بالكامل بواسطة نظام تشغيل جهازك ولا يصل إليها التطبيق أو يخزنها.","<strong>الإشعارات:</strong> لإرسال تذكيرات محلية للحيض أو توقعات الدورة أو تنبيهات أخرى تقومين بتفعيلها.","<strong>الملفات:</strong> لتصدير بيانات الدورة إلى ملف محلي أو استيراد نسخة احتياطية سبق تصديرها."],"يمكنك إدارة هذه الأذونات من إعدادات جهازك."]},
      {h:"4. العمل دون اتصال وبدون تحليلات خارجية",b:["تم تصميم CycleLog ليعمل بالكامل دون اتصال. لا يستخدم الإصدار الحالي خدمات تحليلات خارجية أو تقارير أعطال أو شبكات إعلانية.","لا يتم إرسال بيانات الدورة أو الإشارات الصحية أو نشاط الاستخدام إلى خوادم خارجية للتتبع أو التحليلات أو الإعلانات. إذا واجهت مشكلة تقنية، يمكنك اختيار مشاركة التفاصيل معنا مباشرة عبر البريد الإلكتروني."]},
      {h:"5. المشتريات والاشتراكات",b:["قد يقدم CycleLog ميزات مجانية وميزات Pro من خلال اشتراك شهري أو سنوي. تتم معالجة المدفوعات عبر Apple App Store أو Google Play. نحن لا نتلقى أو نخزن رقم بطاقتك الكامل.","قد نتلقى حالة الشراء أو معرفات المنتجات أو حالة الاستحقاق أو حالة الاشتراك من Apple أو Google حتى يتمكن التطبيق من فتح ميزات Pro."]},
      {h:"6. تصدير واستيراد البيانات",b:["إذا استخدمت ميزة Export، تتم كتابة بيانات الدورة في ملف JSON محلي على جهازك. يمكنك بعد ذلك اختيار مشاركة هذا الملف أو حفظه أو نسخه احتياطيًا باستخدام نظام ملفات الجهاز أو تطبيقات أخرى. يخضع تعامل التطبيقات الخارجية مع البيانات لسياسات الخصوصية الخاصة بها.","نحن لا نتلقى أو نخزن أو نعالج ملفات البيانات المصدرة على خوادمنا."]},
      {h:"7. Emergency Privacy Mode و App Lock",b:["يتيح Emergency Privacy Mode إخفاء كل بيانات الدورة الظاهرة فورًا بلمسة واحدة. يتيح App Lock طلب المصادقة الحيوية أو رمز الجهاز لفتح التطبيق. صممت هذه الميزات لحماية خصوصيتك على جهازك.","تتم معالجة البيانات الحيوية المستخدمة في App Lock بالكامل بواسطة المنطقة الآمنة في نظام التشغيل ولا يمكن للتطبيق الوصول إليها أو إرسالها."]},
      {h:"8. بيانات الصحة والمعلومات الطبية",b:["بيانات الدورة التي تسجلينها والتقديرات التي يولدها التطبيق هي معلومات صحية شخصية. نتعامل معها بعناية خاصة: تبقى على جهازك ولا تتم مشاركتها مع المعلنين أو وسطاء البيانات أو خدمات الطرف الثالث دون إجراء صريح منك.","CycleLog ليس جهازًا طبيًا ولا يقدم نصيحة طبية. تقديرات الدورة والحيض ونافذة الخصوبة والإباضة هي حسابات إحصائية. ليست تشخيصات طبية ولا تصلح كوسيلة لمنع الحمل."]},
      {h:"9. الاحتفاظ بالبيانات وحذفها",b:["تبقى بيانات التطبيق المحلية على جهازك حتى تحذفي السجلات الفردية أو تمسحي كل البيانات من Settings أو تزيلي تثبيت التطبيق.","إذا تواصلت معنا عبر البريد الإلكتروني، فقد نحتفظ بالمحادثة لأغراض الدعم وتحسين المنتج."]},
      {h:"10. الأطفال",b:["CycleLog غير موجه للأطفال دون 13 عامًا. نحن لا نجمع عمدًا معلومات شخصية من أطفال دون 13 عامًا. إذا كنت تعتقدين أن طفلًا قدم معلومات شخصية، يرجى التواصل معنا لاتخاذ الإجراء المناسب."]},
      {h:"11. المستخدمون الدوليون",b:["يمكن استخدام CycleLog عالميًا. إذا أجريت عملية شراء، فقد تعالج Apple أو Google معلومات الدفع في دول غير بلد إقامتك وفقًا لسياساتهما الخاصة. نحن لا نرفع بيانات الصحة أو الدورة إلى خوادم خارجية."]},
      {h:"12. تغييرات هذه السياسة",b:["قد نحدث Privacy Policy هذه من وقت لآخر. إذا أجرينا تغييرات جوهرية، سنحدث تاريخ \"Last updated\" وقد نقدم إشعارًا إضافيًا في التطبيق حيثما كان مناسبًا."]},
      {h:"13. التواصل",b:["إذا كانت لديك أسئلة أو طلبات أو ملاحظات حول Privacy Policy هذه، تواصلي معنا عبر {{email}}."]}
    ];

    function renderSections(code) {
      const s = sections[code] || sections.en;
      const EMAIL = '<a href="mailto:khanhquang29000@gmail.com">khanhquang29000@gmail.com</a>';
      document.getElementById("sc").innerHTML = s.map(sec =>
        `<section><h2>${sec.h}</h2>${sec.b.map(n =>
          Array.isArray(n)
            ? `<ul>${n.map(i => `<li>${i}</li>`).join("")}</ul>`
            : `<p>${n.replace("{{email}}", EMAIL)}</p>`
        ).join("")}</section>`
      ).join("");
    }

    const select = document.getElementById("languageSelect");
    const browserLanguage = (navigator.language || "en").slice(0, 2).toLowerCase();
    const initialLanguage = copy[browserLanguage] ? browserLanguage : "en";

    for (const [code, label] of languages) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = label;
      select.appendChild(option);
    }

    function renderLanguage(code) {
      const item = copy[code] || copy.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("languageTitle").textContent = item.title;
      document.getElementById("languageSubtitle").textContent = item.subtitle;
      document.getElementById("localizedSummary").textContent = item.summary;
      document.getElementById("legalNote").textContent = item.note;
      select.value = code;
      renderSections(code);
    }

    select.addEventListener("change", (event) => renderLanguage(event.target.value));
    renderLanguage(initialLanguage);
  </script>
